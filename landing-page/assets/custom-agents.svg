<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Main circle node -->
  <circle cx="100" cy="100" r="35" fill="#0066cc" stroke="#0052a3" stroke-width="2"/>
  <!-- Center dot -->
  <circle cx="100" cy="100" r="8" fill="white"/>
  
  <!-- Connected node 1 (top-left) -->
  <circle cx="60" cy="60" r="20" fill="#0080ff" stroke="#0066cc" stroke-width="2"/>
  <circle cx="60" cy="60" r="4" fill="white"/>
  
  <!-- Connected node 2 (top-right) -->
  <circle cx="140" cy="60" r="20" fill="#0080ff" stroke="#0066cc" stroke-width="2"/>
  <circle cx="140" cy="60" r="4" fill="white"/>
  
  <!-- Connected node 3 (bottom-left) -->
  <circle cx="60" cy="140" r="20" fill="#0080ff" stroke="#0066cc" stroke-width="2"/>
  <circle cx="60" cy="140" r="4" fill="white"/>
  
  <!-- Connected node 4 (bottom-right) -->
  <circle cx="140" cy="140" r="20" fill="#0080ff" stroke="#0066cc" stroke-width="2"/>
  <circle cx="140" cy="140" r="4" fill="white"/>
  
  <!-- Connection lines -->
  <line x1="100" y1="100" x2="60" y2="60" stroke="#0066cc" stroke-width="2" stroke-dasharray="3,3"/>
  <line x1="100" y1="100" x2="140" y2="60" stroke="#0066cc" stroke-width="2" stroke-dasharray="3,3"/>
  <line x1="100" y1="100" x2="60" y2="140" stroke="#0066cc" stroke-width="2" stroke-dasharray="3,3"/>
  <line x1="100" y1="100" x2="140" y2="140" stroke="#0066cc" stroke-width="2" stroke-dasharray="3,3"/>
</svg>