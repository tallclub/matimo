<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Laptop screen -->
  <rect x="30" y="25" width="140" height="90" rx="8" fill="none" stroke="#0066cc" stroke-width="2.5"/>
  <!-- Screen content - terminal lines -->
  <line x1="45" y1="45" x2="95" y2="45" stroke="#00ff00" stroke-width="1.5"/>
  <line x1="45" y1="60" x2="135" y2="60" stroke="#00ff00" stroke-width="1.5"/>
  <line x1="45" y1="75" x2="110" y2="75" stroke="#00ff00" stroke-width="1.5"/>
  <line x1="45" y1="90" x2="125" y2="90" stroke="#00ff00" stroke-width="1.5"/>
  
  <!-- Laptop base -->
  <path d="M 50 115 L 150 115 L 155 145 L 45 145 Z" fill="none" stroke="#0066cc" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Keyboard dash marks -->
  <line x1="70" y1="125" x2="130" y2="125" stroke="#999" stroke-width="1"/>
  <line x1="70" y1="135" x2="130" y2="135" stroke="#999" stroke-width="1"/>
  
  <!-- HTTP indicator (small) -->
  <text x="155" y="50" font-size="12" fill="#0066cc" font-weight="bold">HTTP</text>
</svg>