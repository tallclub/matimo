theme: jekyll-theme-slate
title: Matimo - AI Tools Ecosystem
description: Define tools once in YAML, use them everywhere
show_downloads: true
google_analytics: false

# Matimo Documentation
url: 'https://docs.matimo.dev'
baseurl: ''
repository: 'tallclub/matimo'

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# Build settings
markdown: kramdown
highlighter: rouge

# Navigation
nav:
  - text: 'Home'
    url: '/'
  - text: 'Getting Started'
    url: '/getting-started/'
  - text: 'Documentation'
    url: '/'
  - text: 'GitHub'
    url: 'https://github.com/tallclub/matimo'
  - text: 'npm'
    url: 'https://www.npmjs.com/package/matimo'
