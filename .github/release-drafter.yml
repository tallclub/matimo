name-template: 'v$NEXT_PATCH_VERSION'
tag-template: 'v$NEXT_PATCH_VERSION'
categories:
  - title: "🚀 Features"
    labels:
      - feature
      - enhancement
  - title: "🐛 Fixes"
    labels:
      - bug
  - title: "🧰 Chores"
    labels:
      - chore
      - docs
template: |
  ## What's changed

  $CHANGES

  <!-- Do not edit this file directly; Release Drafter manages releases -->

change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
no-changes-template: '- No significant changes'
