name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-typescript:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: 8

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: typescript

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
        working-directory: typescript

      - name: Lint
        run: pnpm lint
        working-directory: typescript

      - name: Build
        run: pnpm build
        working-directory: typescript

      - name: Test with coverage
        run: pnpm test:coverage
        working-directory: typescript

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4
        with:
          files: ./typescript/coverage/lcov.info
          flags: typescript
          fail_ci_if_error: false

  test-python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3
        with:
          version: "0.11.33"

      - name: Setup Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev
        working-directory: python

      # Audits what ships (matimo-core runtime deps), not optional framework extras:
      # crewai -> chromadb has advisories with no fixed release and is dev/extra only.
      - name: Audit runtime dependencies
        if: matrix.python-version == '3.12'
        run: |
          uv export --no-dev --no-hashes --frozen --no-emit-workspace --package matimo-core -o runtime-requirements.txt
          uvx pip-audit -r runtime-requirements.txt --no-deps --disable-pip
        working-directory: python

      - name: Lint
        run: uv run ruff check packages/
        working-directory: python

      - name: Type check
        run: uv run mypy src/   # strict, same as `make typecheck`
        working-directory: python/packages/core

      - name: Test with coverage
        run: uv run pytest packages/core/tests/ --cov=packages/core/src/matimo --cov-report=xml --cov-fail-under=95 -q --tb=short
        working-directory: python

      - name: Test provider packages
        run: uv run pytest packages/ --ignore=packages/core -q --tb=short
        working-directory: python

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4
        with:
          files: ./python/coverage.xml
          flags: python
          fail_ci_if_error: false
