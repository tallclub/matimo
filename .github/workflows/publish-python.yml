name: Publish Python SDK

on:
  push:
    tags:
      - "python/v*"   # e.g. python/v0.1.0  → publishes matimo core
      - "python/providers/*/v*"  # e.g. python/providers/slack/v0.1.0

# Deny all permissions by default; each job declares only what it needs.
permissions: {}

jobs:
  # -------------------------------------------------------------------------
  # Test gate — must pass before any publish
  # -------------------------------------------------------------------------
  test:
    name: Test Python SDK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest packages/core/tests/ --tb=short -q

      - name: Coverage check
        run: uv run pytest packages/core/tests/ --cov=packages/core/src/matimo --cov-fail-under=95 -q --tb=no

  # -------------------------------------------------------------------------
  # Publish core matimo package + all providers
  # -------------------------------------------------------------------------
  publish-core:
    name: Publish matimo-core, matimo, and all providers to PyPI
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/python/v')
    permissions:
      contents: read
    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      # Dependency order matters: matimo requires matimo-core and matimo-cli at the same
      # version, and providers require matimo-core. Publish the base packages first so a
      # `pip install matimo` that runs mid-release never falls back to the previous version.
      - name: Build base packages (matimo-core, matimo-cli)
        run: |
          uv build --package matimo-core --out-dir dist-base
          uv build --package matimo-cli --out-dir dist-base

      - name: Build umbrella and provider packages
        run: |
          uv build --package matimo --out-dir dist-rest
          cd packages
          for provider_dir in */; do
            provider_name="${provider_dir%/}"
            # Skip packages built above
            if [[ "$provider_name" != "core" && "$provider_name" != "cli" && "$provider_name" != "matimo" ]]; then
              echo "Building matimo-$provider_name..."
              uv build --package matimo-$provider_name --out-dir ../dist-rest
            fi
          done

      - name: Publish base packages to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist-base/
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Wait for matimo-core and matimo-cli to be installable
        run: |
          VERSION="${GITHUB_REF_NAME#python/v}"
          for pkg in matimo-core matimo-cli; do
            for i in $(seq 1 30); do
              if curl -fsS "https://pypi.org/pypi/$pkg/$VERSION/json" > /dev/null; then
                echo "$pkg $VERSION is live"; break
              fi
              if [ "$i" = 30 ]; then echo "$pkg $VERSION not visible on PyPI after 5 minutes"; exit 1; fi
              sleep 10
            done
          done

      - name: Publish umbrella and provider packages to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist-rest/
          password: ${{ secrets.PYPI_API_TOKEN }}

  # -------------------------------------------------------------------------
  # Legacy provider tag support (optional — kept for backwards compatibility)
  # -------------------------------------------------------------------------
  publish-provider:
    name: Publish provider package to PyPI
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/python/providers/')
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Extract provider from tag
        id: parse
        run: |
          # Tag format: python/providers/{provider}/v{version}
          TAG="${GITHUB_REF#refs/tags/}"
          PROVIDER=$(echo "$TAG" | cut -d'/' -f3)
          echo "provider=$PROVIDER" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Build provider wheel
        working-directory: python
        run: uv build --package matimo-${{ steps.parse.outputs.provider }}

      - name: Publish provider to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}

