name: Update changelog

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  prepend-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Prepend release notes to docs/RELEASES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          set -euo pipefail
          EVENT_FILE="$GITHUB_EVENT_PATH"
          TAG=$(jq -r .release.tag_name "$EVENT_FILE")
          BODY=$(jq -r .release.body "$EVENT_FILE")
          PUBLISHED_AT=$(jq -r .release.published_at "$EVENT_FILE" | cut -d'T' -f1)

          # Ensure docs directory exists
          mkdir -p docs
          FILE=docs/RELEASES.md
          if [ ! -f "$FILE" ]; then
            echo "# Changelog" > "$FILE"
            echo >> "$FILE"
          fi

          # Prepend the release notes
          TMP=$(mktemp)
          echo "## $TAG - $PUBLISHED_AT" > "$TMP"
          echo >> "$TMP"
          echo "$BODY" >> "$TMP"
          echo >> "$TMP"
          cat "$FILE" >> "$TMP"
          mv "$TMP" "$FILE"

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if git diff --staged --quiet; then
            echo "No changelog changes to commit"
          else
            git commit -m "chore(release): add changelog for $TAG"
            git push origin HEAD:${{ github.ref }}
          fi
