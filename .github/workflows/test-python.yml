name: Test Python SDK

on:
  push:
    branches: [main, "feature/*"]
    paths:
      - "python/**"
      - ".github/workflows/test-python.yml"
  pull_request:
    paths:
      - "python/**"

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3
        with:
          version: "0.11.33"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint (ruff)
        run: uv run ruff check packages/

      - name: Type check (mypy)
        run: uv run mypy packages/ || true   # non-blocking: union type refinement work in progress

      - name: Run tests with coverage
        run: uv run pytest packages/core/tests/ --cov=packages/core/src/matimo --cov-report=xml --cov-report=term-missing --cov-fail-under=95 -v --tb=short

      - name: Verify coverage file
        run: ls -lh coverage.xml || echo "coverage.xml not found"

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4
        with:
          files: python/coverage.xml
          flags: python-sdk
          fail_ci_if_error: false
