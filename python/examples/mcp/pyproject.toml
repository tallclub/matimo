[project]
name = "matimo-py-mcp"
version = "0.1.0a14.post1"
description = "Matimo MCP Examples - Unified Agent with Multi-Transport Support (stdio / HTTP / Multi)"
requires-python = ">=3.11"
dependencies = [
    "matimo-core>=0.1.0a14",
    "python-dotenv>=1.2.2",
    "mcp>=1.27.0",
]

[project.optional-dependencies]
# Minimal: Just core + Slack (for basic examples)
slack = [
    "matimo-slack>=0.1.0a14",
    "starlette>=1.0.0",
    "uvicorn>=0.44.0",
]

# HTTP server support
http = [
    "starlette>=1.0.0",
    "uvicorn>=0.44.0",
    "sse-starlette>=3.3.4",
]

# All providers (for comprehensive testing)
all = [
    "matimo-slack>=0.1.0a14",
    "matimo-github>=0.1.0a14",
    "matimo-gmail>=0.1.0a14",
    "matimo-notion>=0.1.0a14",
    "matimo-postgres>=0.1.0a14",
    "matimo-twilio>=0.1.0a14",
    "matimo-hubspot>=0.1.0a14",
    "matimo-mailchimp>=0.1.0a14",
    "starlette>=1.0.0",
    "uvicorn>=0.44.0",
    "sse-starlette>=3.3.4",
]

# Development and testing
dev = [
    "langchain-mcp-adapters>=0.1.0",
    "langchain-openai>=0.1.2",
    "langgraph>=0.1.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.uv.sources]
matimo-core = { path = "../../packages/core", editable = true }
matimo-slack = { path = "../../packages/slack", editable = true }
matimo-github = { path = "../../packages/github", editable = true }
matimo-mailchimp = { path = "../../packages/mailchimp", editable = true }
matimo-notion = { path = "../../packages/notion", editable = true }
matimo-hubspot = { path = "../../packages/hubspot", editable = true }
matimo-postgres = { path = "../../packages/postgres", editable = true }
matimo-gmail = { path = "../../packages/gmail", editable = true }
matimo-twilio = { path = "../../packages/twilio", editable = true }
