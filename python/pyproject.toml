[project]
name = "matimo-workspace"
version = "0.1.1"
description = "Matimo Python monorepo workspace"
requires-python = ">=3.11"
dependencies = [
    "matimo-core",
    "matimo-cli",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-watch>=4.2",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "pyyaml>=6.0",
    "mcp>=1.0",
    "hvac>=2.0",
    "boto3>=1.34",
    "python-dotenv>=1.0",
    "langchain-core>=0.3",
    "crewai>=0.80",
]

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/cli",
    "packages/matimo",
    "packages/bruno",
    "packages/github",
    "packages/gmail",
    "packages/hubspot",
    "packages/mailchimp",
    "packages/notion",
    "packages/postgres",
    "packages/slack",
    "packages/twilio",
    "examples",
    "examples/mcp",
]

[tool.uv.sources]
matimo-core = { workspace = true }
matimo = { workspace = true }
matimo-cli = { workspace = true }
matimo-bruno = { workspace = true }
matimo-github = { workspace = true }
matimo-gmail = { workspace = true }
matimo-hubspot = { workspace = true }
matimo-mailchimp = { workspace = true }
matimo-notion = { workspace = true }
matimo-postgres = { workspace = true }
matimo-slack = { workspace = true }
matimo-twilio = { workspace = true }
