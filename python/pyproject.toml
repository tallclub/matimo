[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "matimo"
version = "0.1.0"
description = "Configuration-driven AI tools SDK — YAML once, run everywhere"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["ai", "tools", "agents", "langchain", "crewai", "mcp", "matimo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "anyio>=4.0",
    "typing-extensions>=4.9",
    "langchain-openai>=1.1.12",
    "python-dotenv>=1.1.1",
    "crewai>=0.80",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
crewai = ["crewai>=0.80"]
mcp = ["mcp>=1.0"]
vault = ["hvac>=2.0"]
aws = ["boto3>=1.34"]
dotenv = ["python-dotenv>=1.0"]
all = [
    "langchain-core>=0.3",
    "crewai>=0.80",
    "mcp>=1.0",
    "hvac>=2.0",
    "boto3>=1.34",
    "python-dotenv>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "langchain-core>=0.3",
    "crewai>=0.80",
]

[project.urls]
Homepage = "https://matimo.dev"
Documentation = "https://matimo.dev/docs"
Repository = "https://github.com/tallclub/matimo"
Issues = "https://github.com/tallclub/matimo/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/matimo"]

[tool.hatch.build.targets.sdist]
include = ["src/", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["src/matimo"]
omit = ["tests/*", "examples/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
fail_under = 85

[tool.mypy]
mypy_path = "src"
packages = ["matimo"]
strict = true
ignore_missing_imports = true

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ANN"]
ignore = ["ANN101", "ANN102", "S603", "S607"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "respx>=0.22.0",
]
