name: execute
version: '1.0.0'
risk: critical
description: Execute shell commands and capture output. Supports command execution with arguments and streaming output capture.
requires_approval: true

parameters:
  command:
    type: string
    description: Shell command to execute (e.g., 'npm test', 'git status', 'ls -la')
    required: true
    example: 'npm test'

  args:
    type: array
    items:
      type: string
    description: Extra arguments appended to the command, each passed as one argument (optional, can also embed in command). The command runs without a shell.
    required: false
    example: ['--verbose', '--color']

  cwd:
    type: string
    description: Working directory context for command execution (relative or absolute path)
    required: false
    example: '/project/src'

  timeout:
    type: number
    description: Maximum execution time in milliseconds (default 30000)
    required: false
    example: 60000

  shell:
    type: string
    description: >-
      Shell executable to run the command through (e.g. '/bin/bash', 'cmd', 'pwsh').
      Omit it (the default) to run the command directly without a shell. When set,
      the command is a full shell line, so pipes, redirection and expansion are live,
      and every call requires explicit human approval: MATIMO_AUTO_APPROVE, approved
      patterns and caller-supplied approval flags do not apply. 'args' become positional
      parameters ($1, $2, ...) for POSIX shells and are not supported for cmd or PowerShell.
    required: false
    example: '/bin/bash'

execution:
  type: function
  code: './execute.py'

output_schema:
  type: object
  properties:
    success:
      type: boolean
      description: Whether command executed successfully (exit code 0)
    exitCode:
      type: number
      description: Command exit code
    stdout:
      type: string
      description: Standard output from command execution
    stderr:
      type: string
      description: Standard error from command execution
    command:
      type: string
      description: Command that was executed
    duration:
      type: number
      description: Execution duration in milliseconds
  required: [success, exitCode, stdout, stderr, duration]

error_handling:
  retry: 1
  backoff_type: exponential
  initial_delay_ms: 500

examples:
  - name: 'Run npm test'
    description: 'Execute npm test in current directory'
    params:
      command: 'npm test'
  - name: 'List files with details'
    description: 'List directory contents'
    params:
      command: 'ls'
      args: ['-la', '/Users']
  - name: 'Git status'
    description: 'Check git repository status'
    params:
      command: 'git status'
      cwd: '/project'
  - name: 'Run through a shell (always needs human approval)'
    description: 'Opt-in shell line; pipes and redirection work, auto-approve does not apply'
    params:
      command: 'ls | wc -l'
      shell: '/bin/bash'
  - name: 'Long running command with timeout'
    description: 'Execute with custom timeout'
    params:
      command: 'sleep 5'
      timeout: 10000

tags: [shell, command, system, execution, process]
