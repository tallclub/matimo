[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "matimo"
version = "0.1.0a14"
description = "Configuration-driven AI tools SDK — write tools once in YAML, use them everywhere"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["ai", "tools", "agents", "langchain", "crewai", "mcp", "matimo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# This is a meta-package: pip install matimo pulls in matimo-core which provides
# the actual `matimo` Python namespace.
dependencies = [
    "matimo-core>=0.1.0",
]

[project.optional-dependencies]
langchain = ["matimo-core[langchain]"]
crewai = ["matimo-core[crewai]"]
mcp = ["matimo-core[mcp]"]
dotenv = ["matimo-core[dotenv]"]
vault = ["matimo-core[vault]"]
aws = ["matimo-core[aws]"]
all = ["matimo-core[all]"]

[project.urls]
Homepage = "https://matimo.dev"
Documentation = "https://matimo.dev/docs"
Repository = "https://github.com/tallclub/matimo"
Issues = "https://github.com/tallclub/matimo/issues"

# No Python source files — matimo-core owns the `matimo` namespace.
[tool.hatch.build.targets.wheel]
packages = []

[tool.hatch.build.targets.sdist]
include = ["README.md", "LICENSE"]
