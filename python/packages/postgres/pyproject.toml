[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "matimo-postgres"
version = "0.1.0a14"
description = "Matimo provider — PostgreSQL tools (execute SQL)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["ai", "tools", "agents", "matimo", "postgres"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "matimo-core>=0.1.0",
    "asyncpg>=0.29",
]

[project.entry-points."matimo.providers"]
postgres = "matimo_postgres:get_tools_path"

[tool.hatch.build.targets.wheel]
packages = ["src/matimo_postgres"]
