# git-cliff configuration for automatic changelog generation
# Follows GitHub release notes standards

[changelog]
# Template for the whole changelog
body = """
{%- if version %}\
    ## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else %}\
    ## [Unreleased]
{%- endif %}
{%- for group, commits in commits | group_by(attribute="group") %}

    ### {{ group | striptags | trim }}
    {%- for commit in commits %}
    - {%- if commit.breaking %} **BREAKING**: {% endif %}{{ commit.message | upper_first }} \
    {%- if commit.author %} by [@{{ commit.author }}](https://github.com/{{ commit.author }}){% endif %}
    {%- endfor %}
{%- endfor %}
"""

# Template for the header
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

---
"""

# Template for the footer
footer = """
<!-- generated by git-cliff -->
"""

# Remove the prefix from commit tags
trim = true

[git]
# Parse the commits based on https://www.conventionalcommits.org
conventional_commits = true

# Filter out the commits that are not conventional
filter_unconventional = true

# Sort the tags topologically
topo_order = false

# Sort the commits inside each group
sort_commits = "newest"

# Group commits by type
group_by = "type"

# Group commits by scope
skip_tags = "v0.1.0-alpha.*"

[[git.commit_preprocessors]]
pattern = '\((\w+)(?:\s+#(\d+))?\)?'
replace = '[${1}](https://github.com/tallclub/matimo/issues/${2:-})'

[[git.commit_parsers]]
message = "^feat"
group = "✨ Features"
default_scope = "general"

[[git.commit_parsers]]
message = "^fix"
group = "🐛 Bug Fixes"
default_scope = "general"

[[git.commit_parsers]]
message = "^doc"
group = "📚 Documentation"
default_scope = "docs"

[[git.commit_parsers]]
message = "^perf"
group = "⚡ Performance"
default_scope = "performance"

[[git.commit_parsers]]
message = "^refactor"
group = "♻️ Refactoring"
default_scope = "code"

[[git.commit_parsers]]
message = "^test"
group = "✅ Testing"
default_scope = "tests"

[[git.commit_parsers]]
message = "^chore\\(release\\)"
skip = true

[[git.commit_parsers]]
message = "^chore\\(deps\\)"
group = "📦 Dependency Updates"
default_scope = "dependencies"

[[git.commit_parsers]]
message = "^chore"
group = "⚙️ Miscellaneous"
default_scope = "chores"

[[git.commit_parsers]]
message = "^style"
group = "🎨 Styling"
default_scope = "style"

[[git.commit_parsers]]
message = "^ci"
group = "🔁 CI/CD"
default_scope = "ci"

[[git.commit_parsers]]
message = "^merge pull request"
skip = true

[[git.commit_parsers]]
message = "^revert"
group = "⏮️ Reverts"
default_scope = "revert"

[[git.commit_parsers]]
body = ".*security"
group = "🔐 Security"

[github]
# GitHub owner and repo
owner = "tallclub"
repo = "matimo"
