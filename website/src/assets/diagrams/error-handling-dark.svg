<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 506" width="740" height="506" role="img" aria-label="Error handling: an error is caught, wrapped in a MatimoError with a code, message and details, handled by the application, and recovered from.">
  <title>Error handling: an error is caught, wrapped in a MatimoError with a code, message and details, handled by the application, and recovered from.</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#9a9aa8"/></marker>
    <style>
      .bg { fill: #0b0b10; }
      .box { fill: #14141b; stroke: #2a2a35; stroke-width: 1.2; }
      .box.accent { fill: #1a0f15; stroke: #ff3d7f; stroke-width: 1.4; }
      .box.ok { fill: #0f1a15; stroke: #3ddc97; stroke-width: 1.3; }
      .box.bad { fill: #1a1010; stroke: #ff5c5c; stroke-width: 1.3; }
      .chip { fill: #1b1b24; stroke: #2a2a35; stroke-width: 1; }
      .pill { fill: #1b1b24; stroke: #2a2a35; stroke-width: 1; }
      .pill.ok { stroke: #3ddc97; } .pill.bad { stroke: #ff5c5c; }
      .h { font: 650 15.5px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #ececf1; }
      .h.accent { fill: #ff7aa8; } .h.ok { fill: #7ae7b9; } .h.bad { fill: #ff8a8a; }
      .hs { font: 650 14px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #ececf1; }
      .t { font: 400 13.5px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #c4c4d0; }
      .sub { fill: #9a9aa8; }
      .m { font: 400 12.5px 'JetBrains Mono Variable', ui-monospace, Menlo, Consolas, monospace; fill: #c4c4d0; }
      .pt { font: 600 12px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #c4c4d0; }
      .pt.ok { fill: #7ae7b9; } .pt.bad { fill: #ff8a8a; }
      .ln { stroke: #9a9aa8; stroke-width: 1.5; fill: none; }
    </style>
  </defs>
  <rect class="bg" width="740" height="506" rx="18"/>
  <rect class="box" x="20" y="20" width="700" height="48" rx="12"/><text class="h" x="38" y="49">Error occurs</text><path class="ln" d="M370 68 V94" marker-end="url(#ar)"/><rect class="box" x="20" y="94" width="700" height="48" rx="12"/><text class="h" x="38" y="123">Catch with try/catch</text><path class="ln" d="M370 142 V168" marker-end="url(#ar)"/><rect class="box" x="20" y="168" width="700" height="109" rx="12"/><text class="h" x="38" y="197">Wrap in MatimoError</text><text class="t" x="38" y="220">code: ErrorCode</text><text class="t" x="38" y="241">message: string</text><text class="t" x="38" y="262">details?: object (includes retryable for HTTP-sourced errors)</text><path class="ln" d="M370 277 V303" marker-end="url(#ar)"/><rect class="box" x="20" y="303" width="700" height="109" rx="12"/><text class="h" x="38" y="332">Application error handling</text><text class="t" x="38" y="355">Log the error (never log secrets)</text><text class="t" x="38" y="376">Return a structured error</text><text class="t" x="38" y="397">Notify the user or system</text><path class="ln" d="M370 412 V438" marker-end="url(#ar)"/><rect class="box ok" x="20" y="438" width="700" height="48" rx="12"/><text class="h ok" x="38" y="467">Application recovery</text>
</svg>
