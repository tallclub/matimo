<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 438" width="900" height="438" role="img" aria-label="Decision tree: if it needs to run something, use a tool defined in definition.yaml; if it needs to teach the agent something, use a skill in SKILL.md; otherwise put it in the system prompt.">
  <title>Decision tree: if it needs to run something, use a tool defined in definition.yaml; if it needs to teach the agent something, use a skill in SKILL.md; otherwise put it in the system prompt.</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#9a9aa8"/></marker>
    <style>
      .bg { fill: #0b0b10; }
      .box { fill: #14141b; stroke: #2a2a35; stroke-width: 1.2; }
      .box.accent { fill: #1a0f15; stroke: #ff3d7f; stroke-width: 1.4; }
      .box.ok { fill: #0f1a15; stroke: #3ddc97; stroke-width: 1.3; }
      .box.bad { fill: #1a1010; stroke: #ff5c5c; stroke-width: 1.3; }
      .chip { fill: #1b1b24; stroke: #2a2a35; stroke-width: 1; }
      .pill { fill: #1b1b24; stroke: #2a2a35; stroke-width: 1; }
      .pill.ok { stroke: #3ddc97; } .pill.bad { stroke: #ff5c5c; }
      .h { font: 650 15.5px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #ececf1; }
      .h.accent { fill: #ff7aa8; } .h.ok { fill: #7ae7b9; } .h.bad { fill: #ff8a8a; }
      .hs { font: 650 14px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #ececf1; }
      .t { font: 400 13.5px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #c4c4d0; }
      .sub { fill: #9a9aa8; }
      .m { font: 400 12.5px 'JetBrains Mono Variable', ui-monospace, Menlo, Consolas, monospace; fill: #c4c4d0; }
      .pt { font: 600 12px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #c4c4d0; }
      .pt.ok { fill: #7ae7b9; } .pt.bad { fill: #ff8a8a; }
      .ln { stroke: #9a9aa8; stroke-width: 1.5; fill: none; }
    </style>
  </defs>
  <rect class="bg" width="900" height="438" rx="18"/>
  <rect class="box" x="20" y="20" width="860" height="67" rx="12"/><text class="h" x="38" y="49">Does it need to RUN something?</text><text class="t" x="38" y="72">An API call, a DB query, a command</text><path class="ln" d="M450 87 V113" marker-end="url(#ar)"/><path class="ln" d="M450 113 V127"/><path class="ln" d="M231 127 H669"/><path class="ln" d="M231 127 V149" marker-end="url(#ar)"/><rect class="pill ok" x="204" y="149" width="54" height="24" rx="12"/><text class="pt ok" x="231" y="165" text-anchor="middle">yes</text><path class="ln" d="M231 173 V195" marker-end="url(#ar)"/><rect class="box ok" x="20" y="195" width="422" height="67" rx="12"/><text class="h ok" x="38" y="224">Use a Tool</text><text class="m" x="38" y="247">definition.yaml</text><path class="ln" d="M669 127 V149" marker-end="url(#ar)"/><rect class="pill" x="642" y="149" width="54" height="24" rx="12"/><text class="pt" x="669" y="165" text-anchor="middle">no</text><path class="ln" d="M669 173 V195" marker-end="url(#ar)"/><rect class="box" x="458" y="195" width="422" height="48" rx="12"/><text class="h" x="476" y="224">Does it need to TEACH the agent something?</text><path class="ln" d="M669 243 V269" marker-end="url(#ar)"/><path class="ln" d="M669 269 V283"/><path class="ln" d="M559.5 283 H778.5"/><path class="ln" d="M559.5 283 V305" marker-end="url(#ar)"/><rect class="pill ok" x="532.5" y="305" width="54" height="24" rx="12"/><text class="pt ok" x="559.5" y="321" text-anchor="middle">yes</text><path class="ln" d="M559.5 329 V351" marker-end="url(#ar)"/><rect class="box ok" x="458" y="351" width="203" height="67" rx="12"/><text class="h ok" x="476" y="380">Use a Skill</text><text class="m" x="476" y="403">SKILL.md</text><path class="ln" d="M778.5 283 V305" marker-end="url(#ar)"/><rect class="pill" x="751.5" y="305" width="54" height="24" rx="12"/><text class="pt" x="778.5" y="321" text-anchor="middle">no</text><path class="ln" d="M778.5 329 V351" marker-end="url(#ar)"/><rect class="box" x="677" y="351" width="203" height="67" rx="12"/><text class="h" x="695" y="380">System prompt</text><text class="t" x="695" y="403">put it there</text>
</svg>
