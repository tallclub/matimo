<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 449" width="560" height="449" role="img" aria-label="A LangChain agent calls the LangChain official tool API, which calls matimo.execute, which runs the tool executors.">
  <title>A LangChain agent calls the LangChain official tool API, which calls matimo.execute, which runs the tool executors.</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#5c5c6a"/></marker>
    <style>
      .bg { fill: #f4f4f8; }
      .box { fill: #ffffff; stroke: #d4d4de; stroke-width: 1.2; }
      .box.accent { fill: #fff1f6; stroke: #d6205f; stroke-width: 1.4; }
      .box.ok { fill: #effaf5; stroke: #168a60; stroke-width: 1.3; }
      .box.bad { fill: #fff1f1; stroke: #d93a3a; stroke-width: 1.3; }
      .chip { fill: #ececf2; stroke: #d4d4de; stroke-width: 1; }
      .pill { fill: #ececf2; stroke: #d4d4de; stroke-width: 1; }
      .pill.ok { stroke: #168a60; } .pill.bad { stroke: #d93a3a; }
      .h { font: 650 15.5px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #14141a; }
      .h.accent { fill: #b3124f; } .h.ok { fill: #0f6b4a; } .h.bad { fill: #a32424; }
      .hs { font: 650 14px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #14141a; }
      .t { font: 400 13.5px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #2c2c38; }
      .sub { fill: #5c5c6a; }
      .m { font: 400 12.5px 'JetBrains Mono Variable', ui-monospace, Menlo, Consolas, monospace; fill: #2c2c38; }
      .pt { font: 600 12px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #2c2c38; }
      .pt.ok { fill: #0f6b4a; } .pt.bad { fill: #a32424; }
      .ln { stroke: #5c5c6a; stroke-width: 1.5; fill: none; }
    </style>
  </defs>
  <rect class="bg" width="560" height="449" rx="18"/>
  <rect class="box" x="20" y="20" width="520" height="67" rx="12"/><text class="h" x="38" y="49">LangChain agent</text><text class="t" x="38" y="72">with OpenAI GPT-4</text><path class="ln" d="M280 87 V113" marker-end="url(#ar)"/><rect class="box" x="20" y="113" width="520" height="130" rx="12"/><text class="h" x="38" y="142">LangChain official API</text><text class="m" x="38" y="165">tool(async fn, schema)</text><text class="t" x="38" y="186">• automatic schema generation</text><text class="t" x="38" y="207">• type validation via Zod</text><text class="t" x="38" y="228">• best IDE support</text><path class="ln" d="M280 243 V269" marker-end="url(#ar)"/><rect class="box" x="20" y="269" width="520" height="67" rx="12"/><text class="h" x="38" y="298">Matimo SDK</text><text class="m" x="38" y="321">m.execute(toolName, params)</text><path class="ln" d="M280 336 V362" marker-end="url(#ar)"/><rect class="box" x="20" y="362" width="520" height="67" rx="12"/><text class="h" x="38" y="391">Tool executors</text><text class="t" x="38" y="414">HTTP, function or command</text>
</svg>
