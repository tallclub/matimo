<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 815" width="900" height="815" role="img" aria-label="Decision flow for a tool call: if the call needs approval it checks for a pre-approved pattern, otherwise asks the onApproval handler per call, per instance or process-wide, and either executes or throws a MatimoError.">
  <title>Decision flow for a tool call: if the call needs approval it checks for a pre-approved pattern, otherwise asks the onApproval handler per call, per instance or process-wide, and either executes or throws a MatimoError.</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#9a9aa8"/></marker>
    <style>
      .bg { fill: #0b0b10; }
      .box { fill: #14141b; stroke: #2a2a35; stroke-width: 1.2; }
      .box.accent { fill: #1a0f15; stroke: #ff3d7f; stroke-width: 1.4; }
      .box.ok { fill: #0f1a15; stroke: #3ddc97; stroke-width: 1.3; }
      .box.bad { fill: #1a1010; stroke: #ff5c5c; stroke-width: 1.3; }
      .chip { fill: #1b1b24; stroke: #2a2a35; stroke-width: 1; }
      .pill { fill: #1b1b24; stroke: #2a2a35; stroke-width: 1; }
      .pill.ok { stroke: #3ddc97; } .pill.bad { stroke: #ff5c5c; }
      .h { font: 650 15.5px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #ececf1; }
      .h.accent { fill: #ff7aa8; } .h.ok { fill: #7ae7b9; } .h.bad { fill: #ff8a8a; }
      .hs { font: 650 14px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #ececf1; }
      .t { font: 400 13.5px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #c4c4d0; }
      .sub { fill: #9a9aa8; }
      .m { font: 400 12.5px 'JetBrains Mono Variable', ui-monospace, Menlo, Consolas, monospace; fill: #c4c4d0; }
      .pt { font: 600 12px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #c4c4d0; }
      .pt.ok { fill: #7ae7b9; } .pt.bad { fill: #ff8a8a; }
      .ln { stroke: #9a9aa8; stroke-width: 1.5; fill: none; }
    </style>
  </defs>
  <rect class="bg" width="900" height="815" rx="18"/>
  <rect class="box" x="20" y="20" width="860" height="48" rx="12"/><text class="h" x="38" y="49">matimo.execute('tool_name', params)</text><path class="ln" d="M450 68 V96" marker-end="url(#ar)"/><rect class="box" x="20" y="96" width="860" height="109" rx="12"/><text class="h" x="38" y="125">Needs approval?</text><text class="t" x="38" y="148">requires_approval: true in the YAML</text><text class="t" x="38" y="169">HTTP DELETE or command tool without requires_approval (secure mode)</text><text class="t" x="38" y="190">destructive keyword in the sql or command argument</text><path class="ln" d="M450 205 V231" marker-end="url(#ar)"/><path class="ln" d="M450 231 V245"/><path class="ln" d="M125.5 245 H563.5"/><path class="ln" d="M125.5 245 V267" marker-end="url(#ar)"/><rect class="pill ok" x="98.5" y="267" width="54" height="24" rx="12"/><text class="pt ok" x="125.5" y="283" text-anchor="middle">no</text><path class="ln" d="M125.5 291 V313" marker-end="url(#ar)"/><rect class="box ok" x="20" y="313" width="211" height="48" rx="12"/><text class="h ok" x="38" y="342">Execute</text><path class="ln" d="M563.5 245 V267" marker-end="url(#ar)"/><rect class="pill" x="536.5" y="267" width="54" height="24" rx="12"/><text class="pt" x="563.5" y="283" text-anchor="middle">yes</text><path class="ln" d="M563.5 291 V313" marker-end="url(#ar)"/><rect class="box" x="247" y="313" width="633" height="88" rx="12"/><text class="h" x="265" y="342">Pre-approved?</text><text class="t" x="265" y="365">MATIMO_APPROVED_PATTERNS or MATIMO_AUTO_APPROVE</text><text class="t" x="265" y="386">never for matimo_approve_tool</text><path class="ln" d="M563.5 401 V427" marker-end="url(#ar)"/><path class="ln" d="M563.5 427 V441"/><path class="ln" d="M349.8333333333333 441 H674.3333333333333"/><path class="ln" d="M349.8333333333333 441 V463" marker-end="url(#ar)"/><rect class="pill ok" x="322.8333333333333" y="463" width="54" height="24" rx="12"/><text class="pt ok" x="349.8333333333333" y="479" text-anchor="middle">yes</text><path class="ln" d="M349.8333333333333 487 V509" marker-end="url(#ar)"/><rect class="box ok" x="247" y="509" width="205.66666666666666" height="48" rx="12"/><text class="h ok" x="265" y="538">Execute</text><path class="ln" d="M674.3333333333333 441 V463" marker-end="url(#ar)"/><rect class="pill" x="647.3333333333333" y="463" width="54" height="24" rx="12"/><text class="pt" x="674.3333333333333" y="479" text-anchor="middle">no</text><path class="ln" d="M674.3333333333333 487 V509" marker-end="url(#ar)"/><rect class="box" x="468.66666666666663" y="509" width="411.3333333333333" height="130" rx="12"/><text class="h" x="486.66666666666663" y="538">Ask, first handler that is set</text><text class="t" x="486.66666666666663" y="561">1. execute(..., { onApproval }), per call</text><text class="t" x="486.66666666666663" y="582">2. init({ onApproval }), per instance</text><text class="t" x="486.66666666666663" y="603">3. getGlobalApprovalHandler(), process-wide</text><text class="t" x="486.66666666666663" y="624">4. none, so the call is rejected</text><path class="ln" d="M674.3333333333333 639 V665" marker-end="url(#ar)"/><path class="ln" d="M674.3333333333333 665 V679"/><path class="ln" d="M567.5 679 H781.1666666666666"/><path class="ln" d="M567.5 679 V701" marker-end="url(#ar)"/><rect class="pill ok" x="528.1" y="701" width="78.8" height="24" rx="12"/><text class="pt ok" x="567.5" y="717" text-anchor="middle">approved</text><path class="ln" d="M567.5 725 V747" marker-end="url(#ar)"/><rect class="box ok" x="468.66666666666663" y="747" width="197.66666666666666" height="48" rx="12"/><text class="h ok" x="486.66666666666663" y="776">Execute</text><path class="ln" d="M781.1666666666666 679 V701" marker-end="url(#ar)"/><rect class="pill bad" x="741.7666666666667" y="701" width="78.8" height="24" rx="12"/><text class="pt bad" x="781.1666666666666" y="717" text-anchor="middle">rejected</text><path class="ln" d="M781.1666666666666 725 V747" marker-end="url(#ar)"/><rect class="box bad" x="682.3333333333333" y="747" width="197.66666666666666" height="48" rx="12"/><text class="h bad" x="700.3333333333333" y="776">Throw MatimoError</text>
</svg>
