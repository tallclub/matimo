<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 191" width="900" height="191" role="img" aria-label="An SDK developer writes SKILL.md files under packages/core/skills, and the agent loads, creates and validates skills at runtime with the matimo skill meta-tools.">
