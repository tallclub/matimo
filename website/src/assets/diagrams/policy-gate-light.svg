<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 418" width="740" height="418" role="img" aria-label="The agent calls matimo.execute, the policy gate checks it with canExecute, the approval handler, the content validator, the risk classifier, the integrity tracker and the HMAC approval manifest, and an allowed call reaches the tool executor.">
  <title>The agent calls matimo.execute, the policy gate checks it with canExecute, the approval handler, the content validator, the risk classifier, the integrity tracker and the HMAC approval manifest, and an allowed call reaches the tool executor.</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#5c5c6a"/></marker>
    <style>
      .bg { fill: #f4f4f8; }
      .box { fill: #ffffff; stroke: #d4d4de; stroke-width: 1.2; }
      .box.accent { fill: #fff1f6; stroke: #d6205f; stroke-width: 1.4; }
      .box.ok { fill: #effaf5; stroke: #168a60; stroke-width: 1.3; }
      .box.bad { fill: #fff1f1; stroke: #d93a3a; stroke-width: 1.3; }
      .chip { fill: #ececf2; stroke: #d4d4de; stroke-width: 1; }
      .pill { fill: #ececf2; stroke: #d4d4de; stroke-width: 1; }
      .pill.ok { stroke: #168a60; } .pill.bad { stroke: #d93a3a; }
      .h { font: 650 15.5px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #14141a; }
      .h.accent { fill: #b3124f; } .h.ok { fill: #0f6b4a; } .h.bad { fill: #a32424; }
      .hs { font: 650 14px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #14141a; }
      .t { font: 400 13.5px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #2c2c38; }
      .sub { fill: #5c5c6a; }
      .m { font: 400 12.5px 'JetBrains Mono Variable', ui-monospace, Menlo, Consolas, monospace; fill: #2c2c38; }
      .pt { font: 600 12px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #2c2c38; }
      .pt.ok { fill: #0f6b4a; } .pt.bad { fill: #a32424; }
      .ln { stroke: #5c5c6a; stroke-width: 1.5; fill: none; }
    </style>
  </defs>
  <rect class="bg" width="740" height="418" rx="18"/>
  <rect class="box" x="20" y="20" width="700" height="67" rx="12"/><text class="h" x="38" y="49">Agent or framework</text><text class="t" x="38" y="72">LangChain, MCP, or direct SDK calls</text><path class="ln" d="M370 87 V115" marker-end="url(#ar)"/><text class="t sub" x="380" y="105" style="font-size:12px">matimo.execute(toolName, params)</text><rect class="box accent" x="20" y="115" width="700" height="188" rx="12"/><text class="h accent" x="38" y="144">Policy gate</text><rect class="chip" x="38" y="161" width="213.33333333333334" height="54" rx="9"/><text class="hs" x="52" y="183">canExecute()</text><text class="t" x="52" y="202" style="font-size:12.5px">RBAC and status</text><rect class="chip" x="263.33333333333337" y="161" width="213.33333333333334" height="54" rx="9"/><text class="hs" x="277.33333333333337" y="193">Approval handler</text><rect class="chip" x="488.6666666666667" y="161" width="213.33333333333334" height="54" rx="9"/><text class="hs" x="502.6666666666667" y="183">Content validator</text><text class="t" x="502.6666666666667" y="202" style="font-size:12.5px">9 security rules</text><rect class="chip" x="38" y="225" width="213.33333333333334" height="54" rx="9"/><text class="hs" x="52" y="257">Risk classifier</text><rect class="chip" x="263.33333333333337" y="225" width="213.33333333333334" height="54" rx="9"/><text class="hs" x="277.33333333333337" y="257">Integrity tracker</text><rect class="chip" x="488.6666666666667" y="225" width="213.33333333333334" height="54" rx="9"/><text class="hs" x="502.6666666666667" y="257">HMAC approval manifest</text><path class="ln" d="M370 303 V331" marker-end="url(#ar)"/><text class="t sub" x="380" y="321" style="font-size:12px">allowed</text><rect class="box" x="20" y="331" width="700" height="67" rx="12"/><text class="h" x="38" y="360">Tool execution</text><text class="t" x="38" y="383">HTTP, command or function executor</text>
</svg>
