<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 149" width="900" height="149" role="img" aria-label="Tool lifecycle in four steps: create a YAML draft, approve it with an HMAC signature, reload the registry, then use the tool.">
  <title>Tool lifecycle in four steps: create a YAML draft, approve it with an HMAC signature, reload the registry, then use the tool.</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#5c5c6a"/></marker>
    <style>
      .bg { fill: #f4f4f8; }
      .box { fill: #ffffff; stroke: #d4d4de; stroke-width: 1.2; }
      .box.accent { fill: #fff1f6; stroke: #d6205f; stroke-width: 1.4; }
      .box.ok { fill: #effaf5; stroke: #168a60; stroke-width: 1.3; }
      .box.bad { fill: #fff1f1; stroke: #d93a3a; stroke-width: 1.3; }
      .chip { fill: #ececf2; stroke: #d4d4de; stroke-width: 1; }
      .pill { fill: #ececf2; stroke: #d4d4de; stroke-width: 1; }
      .pill.ok { stroke: #168a60; } .pill.bad { stroke: #d93a3a; }
      .h { font: 650 15.5px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #14141a; }
      .h.accent { fill: #b3124f; } .h.ok { fill: #0f6b4a; } .h.bad { fill: #a32424; }
      .hs { font: 650 14px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #14141a; }
      .t { font: 400 13.5px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #2c2c38; }
      .sub { fill: #5c5c6a; }
      .m { font: 400 12.5px 'JetBrains Mono Variable', ui-monospace, Menlo, Consolas, monospace; fill: #2c2c38; }
      .pt { font: 600 12px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #2c2c38; }
      .pt.ok { fill: #0f6b4a; } .pt.bad { fill: #a32424; }
      .ln { stroke: #5c5c6a; stroke-width: 1.5; fill: none; }
    </style>
  </defs>
  <rect class="bg" width="900" height="149" rx="18"/>
  <rect class="box" x="20" y="20" width="182" height="109" rx="12"/><text class="h" x="38" y="49">Create</text><text class="t" x="38" y="72">YAML draft</text><text class="t" x="38" y="93">validates content</text><text class="t" x="38" y="114">forces draft</text><path class="ln" d="M208 74.5 H240" marker-end="url(#ar)"/><rect class="box" x="246" y="20" width="182" height="109" rx="12"/><text class="h" x="264" y="49">Approve</text><text class="t" x="264" y="72">status: approved</text><text class="t" x="264" y="93">re-validates</text><text class="t" x="264" y="114">signs the HMAC</text><path class="ln" d="M434 74.5 H466" marker-end="url(#ar)"/><rect class="box" x="472" y="20" width="182" height="109" rx="12"/><text class="h" x="490" y="49">Reload</text><text class="t" x="490" y="72">registry loaded</text><text class="t" x="490" y="93">policy check on</text><text class="t" x="490" y="114">untrusted tools</text><path class="ln" d="M660 74.5 H692" marker-end="url(#ar)"/><rect class="box" x="698" y="20" width="182" height="109" rx="12"/><text class="h" x="716" y="49">Use</text><text class="t" x="716" y="72">execute, result</text><text class="t" x="716" y="93">approval if required</text>
</svg>
