<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 656" width="740" height="656" role="img" aria-label="OAuth2 token flow: an access token in the environment is read by the HTTP tool, injected as a Bearer header, and sent to the external service, which returns a result or 401.">
  <title>OAuth2 token flow: an access token in the environment is read by the HTTP tool, injected as a Bearer header, and sent to the external service, which returns a result or 401.</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#9a9aa8"/></marker>
    <style>
      .bg { fill: #0b0b10; }
      .box { fill: #14141b; stroke: #2a2a35; stroke-width: 1.2; }
      .box.accent { fill: #1a0f15; stroke: #ff3d7f; stroke-width: 1.4; }
      .box.ok { fill: #0f1a15; stroke: #3ddc97; stroke-width: 1.3; }
      .box.bad { fill: #1a1010; stroke: #ff5c5c; stroke-width: 1.3; }
      .chip { fill: #1b1b24; stroke: #2a2a35; stroke-width: 1; }
      .pill { fill: #1b1b24; stroke: #2a2a35; stroke-width: 1; }
      .pill.ok { stroke: #3ddc97; } .pill.bad { stroke: #ff5c5c; }
      .h { font: 650 15.5px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #ececf1; }
      .h.accent { fill: #ff7aa8; } .h.ok { fill: #7ae7b9; } .h.bad { fill: #ff8a8a; }
      .hs { font: 650 14px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #ececf1; }
      .t { font: 400 13.5px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #c4c4d0; }
      .sub { fill: #9a9aa8; }
      .m { font: 400 12.5px 'JetBrains Mono Variable', ui-monospace, Menlo, Consolas, monospace; fill: #c4c4d0; }
      .pt { font: 600 12px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #c4c4d0; }
      .pt.ok { fill: #7ae7b9; } .pt.bad { fill: #ff8a8a; }
      .ln { stroke: #9a9aa8; stroke-width: 1.5; fill: none; }
    </style>
  </defs>
  <rect class="bg" width="740" height="656" rx="18"/>
  <rect class="box" x="20" y="20" width="700" height="67" rx="12"/><text class="h" x="38" y="49">1. Environment</text><text class="m" x="38" y="72">process.env.GMAIL_ACCESS_TOKEN = "ya29.abc..."</text><path class="ln" d="M370 87 V113" marker-end="url(#ar)"/><rect class="box" x="20" y="113" width="700" height="88" rx="12"/><text class="h" x="38" y="142">2. HTTP tool execution</text><text class="t" x="38" y="165">The tool requires an OAuth2 token</text><text class="t" x="38" y="186">Check the authentication config and find the provider: google</text><path class="ln" d="M370 201 V227" marker-end="url(#ar)"/><rect class="box" x="20" y="227" width="700" height="88" rx="12"/><text class="h" x="38" y="256">3. Token injection</text><text class="t" x="38" y="279">Read from the environment variable</text><text class="m" x="38" y="300">GMAIL_ACCESS_TOKEN -&gt; "ya29.abc..."</text><path class="ln" d="M370 315 V341" marker-end="url(#ar)"/><rect class="box" x="20" y="341" width="700" height="88" rx="12"/><text class="h" x="38" y="370">4. HTTP request</text><text class="t" x="38" y="393">Add it to the headers</text><text class="m" x="38" y="414">Authorization: "Bearer ya29.abc..."</text><path class="ln" d="M370 429 V455" marker-end="url(#ar)"/><rect class="box" x="20" y="455" width="700" height="88" rx="12"/><text class="h" x="38" y="484">5. External service (Gmail API)</text><text class="t" x="38" y="507">Token valid: execute the request</text><text class="t" x="38" y="528">Token invalid: 401 Unauthorized</text><path class="ln" d="M370 543 V569" marker-end="url(#ar)"/><rect class="box ok" x="20" y="569" width="700" height="67" rx="12"/><text class="h ok" x="38" y="598">6. Response</text><text class="t" x="38" y="621">Return the result or the error</text>
</svg>
