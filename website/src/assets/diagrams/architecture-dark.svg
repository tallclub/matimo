<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 906" width="900" height="906" role="img" aria-labelledby="t d">
  <title id="t">Matimo runtime architecture</title>
  <desc id="d">Application code calls Matimo through the factory, decorator, framework adapters or MCP server. Every call passes through the MatimoInstance orchestrator and the policy gate, then runs in a function, HTTP or command executor against external services. Tool and skill definitions are loaded into the orchestrator.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#9a9aa8"/></marker>
    <marker id="arp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#ff3d7f"/></marker>
    <style>
      .bg { fill: #0b0b10; }
      .box { fill: #14141b; stroke: #2a2a35; stroke-width: 1.2; }
      .wrap { fill: #101016; stroke: #2a2a35; stroke-width: 1.2; }
      .hot { fill: #1a0f15; stroke: #ff3d7f; stroke-width: 1.4; }
      .lbl { font: 600 11px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; letter-spacing: .09em; fill: #9a9aa8; }
      .h { font: 650 15.5px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #ececf1; }
      .hp { font: 650 15.5px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #ff7aa8; }
      .t { font: 400 13.5px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #c4c4d0; }
      .m { font: 400 12.5px 'JetBrains Mono Variable', ui-monospace, Menlo, Consolas, monospace; fill: #c4c4d0; }
      .chip { fill: #1b1b24; stroke: #2a2a35; stroke-width: 1; }
      .ln { stroke: #9a9aa8; stroke-width: 1.5; fill: none; }
      .lnp { stroke: #ff3d7f; stroke-width: 1.5; fill: none; }
      .dash { stroke: #9a9aa8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .c { text-anchor: middle; }
    </style>
  </defs>
  <rect class="bg" width="900" height="906" rx="18"/>

  <rect class="wrap" x="20" y="20" width="860" height="80" rx="14"/>
  <text class="lbl" x="40" y="42">YOUR APPLICATION</text>
  <g class="t c">
    <rect class="chip" x="40" y="54" width="152" height="32" rx="8"/><text x="116" y="74.5">Express or any API</text>
    <rect class="chip" x="202" y="54" width="152" height="32" rx="8"/><text x="278" y="74.5">CLI</text>
    <rect class="chip" x="364" y="54" width="152" height="32" rx="8"/><text x="440" y="74.5">Scheduled jobs</text>
    <rect class="chip" x="526" y="54" width="152" height="32" rx="8"/><text x="602" y="74.5">AI agents</text>
    <rect class="chip" x="688" y="54" width="152" height="32" rx="8"/><text x="764" y="74.5">MCP clients</text>
  </g>
  <path class="ln" d="M450 100 V124" marker-end="url(#ar)"/>

  <g>
    <rect class="box" x="20" y="124" width="206" height="82" rx="12"/>
    <text class="h" x="36" y="150">Factory</text>
    <text class="m" x="36" y="173">MatimoInstance.init()</text>
    <text class="t" x="36" y="192">then execute()</text>
    <rect class="box" x="238" y="124" width="206" height="82" rx="12"/>
    <text class="h" x="254" y="150">Decorator</text>
    <text class="m" x="254" y="173">@tool('calculator')</text>
    <text class="t" x="254" y="192">on class methods</text>
    <rect class="box" x="456" y="124" width="206" height="82" rx="12"/>
    <text class="h" x="472" y="150">Framework adapters</text>
    <text class="t" x="472" y="173">LangChain, CrewAI, Agno</text>
    <text class="t" x="472" y="192">one YAML, any framework</text>
    <rect class="box" x="674" y="124" width="206" height="82" rx="12"/>
    <text class="h" x="690" y="150">MCP server</text>
    <text class="t" x="690" y="173">stdio and HTTP transport</text>
    <text class="t" x="690" y="192">human approval prompts</text>
  </g>
  <path class="ln" d="M450 206 V230" marker-end="url(#ar)"/>

  <rect class="wrap" x="20" y="230" width="860" height="342" rx="16"/>
  <text class="lbl" x="40" y="254">SDK LAYER  ·  packages/core/src</text>

  <rect class="box" x="40" y="268" width="820" height="100" rx="12"/>
  <text class="h" x="60" y="294">MatimoInstance <tspan class="t" dx="6">orchestrator</tspan></text>
  <g class="t">
    <text x="60" y="324">Tool registry and auto-discovery</text>
    <text x="60" y="348">Skills registry</text>
    <text x="340" y="324">Credential injection</text>
    <text x="340" y="348">Executor coordination</text>
    <text x="600" y="324">Events to onEvent, auditSink</text>
    <text x="600" y="348">Per-call approval callbacks</text>
  </g>
  <path class="lnp" d="M450 368 V388" marker-end="url(#arp)"/>

  <rect class="hot" x="40" y="388" width="820" height="168" rx="12"/>
  <text class="hp" x="60" y="414">Policy gate</text>
  <text class="t" x="840" y="414" text-anchor="end" style="fill:#9a9aa8">frozen after init()</text>
  <rect class="box" x="56" y="426" width="330" height="114" rx="10"/>
  <text class="lbl" x="72" y="448">ON LOAD  ·  UNTRUSTED TOOLS</text>
  <g class="t">
    <text x="72" y="474">Content validator: 9 rules</text>
    <text x="72" y="496">HMAC approval verification</text>
    <text x="72" y="518">New agent tools start as draft</text>
  </g>
  <rect class="box" x="398" y="426" width="446" height="114" rx="10"/>
  <text class="lbl" x="414" y="448">ON EVERY CALL</text>
  <g class="t">
    <text x="414" y="472">Risk class: low, medium, high, critical</text>
    <text x="414" y="491">Gates: status, roles, environment</text>
    <text x="414" y="510">HITL quarantine at hitlMinRiskLevel</text>
    <text x="414" y="529">Per-call approval (onApproval)</text>
  </g>

  <path class="lnp" d="M270 572 V600" marker-end="url(#arp)"/>
  <path class="dash" d="M710 600 V572" marker-end="url(#ar)"/>
  <text class="t" x="722" y="591" style="fill:#9a9aa8;font-size:11.5px">loaded at init and reload</text>

  <g>
    <rect class="box" x="20" y="600" width="500" height="56" rx="12"/>
    <text class="h" x="36" y="634">Function executor</text>
    <text class="t" x="200" y="633">TS or Python module (core, meta-tools)</text>
    <rect class="box" x="20" y="666" width="500" height="56" rx="12"/>
    <text class="h" x="36" y="700">HTTP executor</text>
    <text class="t" x="200" y="699">REST, auth injection, SSRF re-check</text>
    <rect class="box" x="20" y="732" width="500" height="56" rx="12"/>
    <text class="h" x="36" y="766">Command executor</text>
    <text class="t" x="200" y="765">Shell; asks on every call by default</text>
  </g>

  <rect class="box" x="540" y="600" width="340" height="188" rx="12"/>
  <text class="h" x="560" y="630">Definitions <tspan class="t" dx="6">YAML and SKILL.md</tspan></text>
  <g class="t">
    <text x="560" y="668">Core tools: 9 built in</text>
    <text x="560" y="696">Provider tools: @matimo/* packages</text>
    <text x="560" y="724">Meta-tools: 15 matimo_* tools</text>
    <text x="560" y="752">Skills: SKILL.md, loaded on demand</text>
  </g>

  <path class="ln" d="M270 788 V812" marker-end="url(#ar)"/>
  <rect class="wrap" x="20" y="812" width="860" height="74" rx="14"/>
  <text class="lbl" x="40" y="834">EXTERNAL SERVICES</text>
  <g class="t c">
    <rect class="chip" x="40" y="846" width="126" height="26" rx="8"/><text x="103" y="863.5">Gmail</text>
    <rect class="chip" x="174" y="846" width="126" height="26" rx="8"/><text x="237" y="863.5">Slack</text>
    <rect class="chip" x="308" y="846" width="126" height="26" rx="8"/><text x="371" y="863.5">GitHub</text>
    <rect class="chip" x="442" y="846" width="126" height="26" rx="8"/><text x="505" y="863.5">Composio</text>
    <rect class="chip" x="576" y="846" width="126" height="26" rx="8"/><text x="639" y="863.5">Custom HTTP APIs</text>
    <rect class="chip" x="710" y="846" width="126" height="26" rx="8"/><text x="773" y="863.5">Shell and files</text>
  </g>
</svg>
