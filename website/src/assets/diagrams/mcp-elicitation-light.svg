<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 784" width="900" height="784" role="img" aria-label="An MCP tools/call runs matimo.execute with an onApproval handler. If the call needs approval and the client supports elicitation, the user is asked; accepting runs the tool, anything else rejects it. Clients without elicitation get an error.">
  <title>An MCP tools/call runs matimo.execute with an onApproval handler. If the call needs approval and the client supports elicitation, the user is asked; accepting runs the tool, anything else rejects it. Clients without elicitation get an error.</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#5c5c6a"/></marker>
    <style>
      .bg { fill: #f4f4f8; }
      .box { fill: #ffffff; stroke: #d4d4de; stroke-width: 1.2; }
      .box.accent { fill: #fff1f6; stroke: #d6205f; stroke-width: 1.4; }
      .box.ok { fill: #effaf5; stroke: #168a60; stroke-width: 1.3; }
      .box.bad { fill: #fff1f1; stroke: #d93a3a; stroke-width: 1.3; }
      .chip { fill: #ececf2; stroke: #d4d4de; stroke-width: 1; }
      .pill { fill: #ececf2; stroke: #d4d4de; stroke-width: 1; }
      .pill.ok { stroke: #168a60; } .pill.bad { stroke: #d93a3a; }
      .h { font: 650 15.5px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #14141a; }
      .h.accent { fill: #b3124f; } .h.ok { fill: #0f6b4a; } .h.bad { fill: #a32424; }
      .hs { font: 650 14px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #14141a; }
      .t { font: 400 13.5px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #2c2c38; }
      .sub { fill: #5c5c6a; }
      .m { font: 400 12.5px 'JetBrains Mono Variable', ui-monospace, Menlo, Consolas, monospace; fill: #2c2c38; }
      .pt { font: 600 12px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #2c2c38; }
      .pt.ok { fill: #0f6b4a; } .pt.bad { fill: #a32424; }
      .ln { stroke: #5c5c6a; stroke-width: 1.5; fill: none; }
    </style>
  </defs>
  <rect class="bg" width="900" height="784" rx="18"/>
  <rect class="box" x="20" y="20" width="860" height="67" rx="12"/><text class="h" x="38" y="49">MCP client</text><text class="m" x="38" y="72">tools/call { name: 'tool_name', arguments: { ... } }</text><path class="ln" d="M450 87 V115" marker-end="url(#ar)"/><rect class="box" x="20" y="115" width="860" height="67" rx="12"/><text class="h" x="38" y="144">matimo.execute(..., { onApproval })</text><text class="t" x="38" y="167">onApproval asks this session's user</text><path class="ln" d="M450 182 V210" marker-end="url(#ar)"/><rect class="box" x="20" y="210" width="860" height="67" rx="12"/><text class="h" x="38" y="239">Call needs approval?</text><text class="t" x="38" y="262">requires_approval, DELETE or command tool, destructive keyword</text><path class="ln" d="M450 277 V303" marker-end="url(#ar)"/><path class="ln" d="M450 303 V317"/><path class="ln" d="M125.5 317 H563.5"/><path class="ln" d="M125.5 317 V339" marker-end="url(#ar)"/><rect class="pill ok" x="98.5" y="339" width="54" height="24" rx="12"/><text class="pt ok" x="125.5" y="355" text-anchor="middle">no</text><path class="ln" d="M125.5 363 V385" marker-end="url(#ar)"/><rect class="box ok" x="20" y="385" width="211" height="48" rx="12"/><text class="h ok" x="38" y="414">Runs</text><path class="ln" d="M563.5 317 V339" marker-end="url(#ar)"/><rect class="pill" x="536.5" y="339" width="54" height="24" rx="12"/><text class="pt" x="563.5" y="355" text-anchor="middle">yes</text><path class="ln" d="M563.5 363 V385" marker-end="url(#ar)"/><rect class="box" x="247" y="385" width="633" height="48" rx="12"/><text class="h" x="265" y="414">Client supports elicitation?</text><path class="ln" d="M563.5 433 V459" marker-end="url(#ar)"/><path class="ln" d="M563.5 459 V473"/><path class="ln" d="M401.25 473 H725.75"/><path class="ln" d="M401.25 473 V495" marker-end="url(#ar)"/><rect class="pill" x="374.25" y="495" width="54" height="24" rx="12"/><text class="pt" x="401.25" y="511" text-anchor="middle">yes</text><path class="ln" d="M401.25 519 V541" marker-end="url(#ar)"/><rect class="box" x="247" y="541" width="308.5" height="67" rx="12"/><text class="h" x="265" y="570">elicitation/create</text><text class="t" x="265" y="593">Allow the agent to run 'tool_name'?</text><path class="ln" d="M401.25 608 V634" marker-end="url(#ar)"/><path class="ln" d="M401.25 634 V648"/><path class="ln" d="M320.125 648 H482.375"/><path class="ln" d="M320.125 648 V670" marker-end="url(#ar)"/><rect class="pill ok" x="247.725" y="670" width="144.8" height="24" rx="12"/><text class="pt ok" x="320.125" y="686" text-anchor="middle">accept and approve</text><path class="ln" d="M320.125 694 V716" marker-end="url(#ar)"/><rect class="box ok" x="247" y="716" width="146.25" height="48" rx="12"/><text class="h ok" x="265" y="745">Run</text><path class="ln" d="M482.375 648 V670" marker-end="url(#ar)"/><rect class="pill bad" x="426.475" y="670" width="111.8" height="24" rx="12"/><text class="pt bad" x="482.375" y="686" text-anchor="middle">anything else</text><path class="ln" d="M482.375 694 V716" marker-end="url(#ar)"/><rect class="box bad" x="409.25" y="716" width="146.25" height="48" rx="12"/><text class="h bad" x="427.25" y="745">Rejected</text><path class="ln" d="M725.75 473 V495" marker-end="url(#ar)"/><rect class="pill bad" x="698.75" y="495" width="54" height="24" rx="12"/><text class="pt bad" x="725.75" y="511" text-anchor="middle">no</text><path class="ln" d="M725.75 519 V541" marker-end="url(#ar)"/><rect class="box bad" x="571.5" y="541" width="308.5" height="109" rx="12"/><text class="h bad" x="589.5" y="570">Error</text><text class="t" x="589.5" y="593">needs human approval, but this</text><text class="t" x="589.5" y="614">MCP client does not support</text><text class="t" x="589.5" y="635">elicitation</text>
</svg>
