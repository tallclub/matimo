<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 752" width="800" height="752" role="img" aria-label="Agent tool lifecycle: validate, create a draft that asks a human, reload, approve with a human, then reload and use, where each call still asks a human.">
  <title>Agent tool lifecycle: validate, create a draft that asks a human, reload, approve with a human, then reload and use, where each call still asks a human.</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#5c5c6a"/></marker>
    <style>
      .bg { fill: #f4f4f8; }
      .box { fill: #ffffff; stroke: #d4d4de; stroke-width: 1.2; }
      .box.accent { fill: #fff1f6; stroke: #d6205f; stroke-width: 1.4; }
      .box.ok { fill: #effaf5; stroke: #168a60; stroke-width: 1.3; }
      .box.bad { fill: #fff1f1; stroke: #d93a3a; stroke-width: 1.3; }
      .chip { fill: #ececf2; stroke: #d4d4de; stroke-width: 1; }
      .pill { fill: #ececf2; stroke: #d4d4de; stroke-width: 1; }
      .pill.ok { stroke: #168a60; } .pill.bad { stroke: #d93a3a; }
      .h { font: 650 15.5px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #14141a; }
      .h.accent { fill: #b3124f; } .h.ok { fill: #0f6b4a; } .h.bad { fill: #a32424; }
      .hs { font: 650 14px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #14141a; }
      .t { font: 400 13.5px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #2c2c38; }
      .sub { fill: #5c5c6a; }
      .m { font: 400 12.5px 'JetBrains Mono Variable', ui-monospace, Menlo, Consolas, monospace; fill: #2c2c38; }
      .pt { font: 600 12px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #2c2c38; }
      .pt.ok { fill: #0f6b4a; } .pt.bad { fill: #a32424; }
      .ln { stroke: #5c5c6a; stroke-width: 1.5; fill: none; }
    </style>
  </defs>
  <rect class="bg" width="800" height="752" rx="18"/>
  <rect class="box" x="20" y="20" width="760" height="109" rx="12"/><text class="h" x="38" y="49">1. Validate</text><text class="m" x="38" y="72">matimo_validate_tool(yaml_content)</text><text class="t" x="38" y="93">Schema check plus the 9 content rules (default policy)</text><text class="t" x="38" y="114">valid: true exactly when matimo_create_tool would accept it</text><path class="ln" d="M400 129 V155" marker-end="url(#ar)"/><rect class="box accent" x="20" y="155" width="760" height="151" rx="12"/><text class="h accent" x="38" y="184">2. Create<tspan class="t sub" dx="8">asks a human: requires_approval</tspan></text><text class="m" x="38" y="207">matimo_create_tool(name, yaml_content, target_dir)</text><text class="t" x="38" y="228">Forces status: draft and requires_approval: true</text><text class="t" x="38" y="249">Refuses matimo_* names and runs the content rules again</text><text class="t" x="38" y="270">Writes &lt;target_dir&gt;/&lt;name&gt;/definition.yaml (default ./matimo-tools)</text><text class="t" x="38" y="291">Reports approvalState: pending</text><path class="ln" d="M400 306 V332" marker-end="url(#ar)"/><rect class="box" x="20" y="332" width="760" height="130" rx="12"/><text class="h" x="38" y="361">3. Reload</text><text class="m" x="38" y="384">matimo_reload_tools()</text><text class="t" x="38" y="405">Re-reads every tool path; untrusted tools face the developer's policy</text><text class="t" x="38" y="426">Returns { loaded, removed, revalidated, rejected }</text><text class="t" x="38" y="447">The draft is now registered but cannot run: drafts need the admin role</text><path class="ln" d="M400 462 V488" marker-end="url(#ar)"/><rect class="box accent" x="20" y="488" width="760" height="130" rx="12"/><text class="h accent" x="38" y="517">4. Approve<tspan class="t sub" dx="8">always asks a human</tspan></text><text class="m" x="38" y="540">matimo_approve_tool(name, tool_dir)</text><text class="t" x="38" y="561">Refuses a tool the calling agent created; needs admin when a context is set</text><text class="t" x="38" y="582">Re-validates, sets status: approved, signs the hash (HMAC)</text><text class="t" x="38" y="603">Records it in the instance's .matimo-approvals.json</text><path class="ln" d="M400 618 V644" marker-end="url(#ar)"/><rect class="box ok" x="20" y="644" width="760" height="88" rx="12"/><text class="h ok" x="38" y="673">5. Reload, then use</text><text class="m" x="38" y="696">matimo_reload_tools()  then  matimo.execute(new_tool_name, params)</text><text class="t" x="38" y="717">Each call still asks a human, because the tool keeps requires_approval: true</text>
</svg>
