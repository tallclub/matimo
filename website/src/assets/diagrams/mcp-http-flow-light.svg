<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 478" width="900" height="478" role="img" aria-label="An MCP client POSTs tools/call to the MCPServer handler, which calls matimo.execute with an onApproval elicitation handler. Execute runs the policy check, approval, credential injection and executor routing, and the result returns as an MCP response.">
  <title>An MCP client POSTs tools/call to the MCPServer handler, which calls matimo.execute with an onApproval elicitation handler. Execute runs the policy check, approval, credential injection and executor routing, and the result returns as an MCP response.</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#5c5c6a"/></marker>
    <style>
      .bg { fill: #f4f4f8; }
      .box { fill: #ffffff; stroke: #d4d4de; stroke-width: 1.2; }
      .box.accent { fill: #fff1f6; stroke: #d6205f; stroke-width: 1.4; }
      .box.ok { fill: #effaf5; stroke: #168a60; stroke-width: 1.3; }
      .box.bad { fill: #fff1f1; stroke: #d93a3a; stroke-width: 1.3; }
      .chip { fill: #ececf2; stroke: #d4d4de; stroke-width: 1; }
      .pill { fill: #ececf2; stroke: #d4d4de; stroke-width: 1; }
      .pill.ok { stroke: #168a60; } .pill.bad { stroke: #d93a3a; }
      .h { font: 650 15.5px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #14141a; }
      .h.accent { fill: #b3124f; } .h.ok { fill: #0f6b4a; } .h.bad { fill: #a32424; }
      .hs { font: 650 14px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #14141a; }
      .t { font: 400 13.5px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #2c2c38; }
      .sub { fill: #5c5c6a; }
      .m { font: 400 12.5px 'JetBrains Mono Variable', ui-monospace, Menlo, Consolas, monospace; fill: #2c2c38; }
      .pt { font: 600 12px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #2c2c38; }
      .pt.ok { fill: #0f6b4a; } .pt.bad { fill: #a32424; }
      .ln { stroke: #5c5c6a; stroke-width: 1.5; fill: none; }
    </style>
  </defs>
  <rect class="bg" width="900" height="478" rx="18"/>
  <rect class="box" x="20" y="20" width="860" height="67" rx="12"/><text class="h" x="38" y="49">MCP client</text><text class="m" x="38" y="72">POST /mcp (tools/call)</text><path class="ln" d="M450 87 V115" marker-end="url(#ar)"/><rect class="box" x="20" y="115" width="860" height="48" rx="12"/><text class="h" x="38" y="144">MCPServer handler</text><path class="ln" d="M450 163 V191" marker-end="url(#ar)"/><rect class="box accent" x="20" y="191" width="860" height="172" rx="12"/><text class="h accent" x="38" y="220">matimo.execute(toolName, params, { onApproval })</text><text class="t" x="38" y="243">onApproval is the elicitation prompt for this session</text><text class="t" x="38" y="264">Policy check (canExecute): gates and HITL quarantine</text><text class="t" x="38" y="285">Approval, if the call needs it: elicitation prompt to the client's user</text><text class="t" x="38" y="306">(_matimo_approved counts only with trustClientApproval)</text><text class="t" x="38" y="327">Credential injection</text><text class="t" x="38" y="348">Executor routing</text><path class="ln" d="M450 363 V391" marker-end="url(#ar)"/><rect class="box" x="20" y="391" width="860" height="67" rx="12"/><text class="h" x="38" y="420">Result</text><text class="t" x="38" y="443">returned as the MCP response</text>
</svg>
