<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 658" width="900" height="658" role="img" aria-label="MCP server startup: a client connects over stdio or HTTP, then the server resolves secrets, runs MatimoInstance.init with auto-discovery, filters tools, registers each tool on McpServer, and connects the transport.">
  <title>MCP server startup: a client connects over stdio or HTTP, then the server resolves secrets, runs MatimoInstance.init with auto-discovery, filters tools, registers each tool on McpServer, and connects the transport.</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#5c5c6a"/></marker>
    <style>
      .bg { fill: #f4f4f8; }
      .box { fill: #ffffff; stroke: #d4d4de; stroke-width: 1.2; }
      .box.accent { fill: #fff1f6; stroke: #d6205f; stroke-width: 1.4; }
      .box.ok { fill: #effaf5; stroke: #168a60; stroke-width: 1.3; }
      .box.bad { fill: #fff1f1; stroke: #d93a3a; stroke-width: 1.3; }
      .chip { fill: #ececf2; stroke: #d4d4de; stroke-width: 1; }
      .pill { fill: #ececf2; stroke: #d4d4de; stroke-width: 1; }
      .pill.ok { stroke: #168a60; } .pill.bad { stroke: #d93a3a; }
      .h { font: 650 15.5px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #14141a; }
      .h.accent { fill: #b3124f; } .h.ok { fill: #0f6b4a; } .h.bad { fill: #a32424; }
      .hs { font: 650 14px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #14141a; }
      .t { font: 400 13.5px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #2c2c38; }
      .sub { fill: #5c5c6a; }
      .m { font: 400 12.5px 'JetBrains Mono Variable', ui-monospace, Menlo, Consolas, monospace; fill: #2c2c38; }
      .pt { font: 600 12px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #2c2c38; }
      .pt.ok { fill: #0f6b4a; } .pt.bad { fill: #a32424; }
      .ln { stroke: #5c5c6a; stroke-width: 1.5; fill: none; }
    </style>
  </defs>
  <rect class="bg" width="900" height="658" rx="18"/>
  <rect class="box" x="20" y="20" width="860" height="67" rx="12"/><text class="h" x="38" y="49">Client</text><text class="t" x="38" y="72">Claude Desktop, Cursor, Windsurf, or an HTTP client</text><path class="ln" d="M450 87 V115" marker-end="url(#ar)"/><text class="t sub" x="460" y="105" style="font-size:12px">MCP protocol: JSON-RPC over stdio or HTTP+SSE</text><rect class="box" x="20" y="115" width="860" height="88" rx="12"/><text class="h" x="38" y="144">1. SecretResolverChain</text><text class="t" x="38" y="167">Resolves secrets from env, dotenv, vault or aws</text><text class="t" x="38" y="188">Seeds process.env with the resolved secrets</text><path class="ln" d="M450 203 V229" marker-end="url(#ar)"/><rect class="box" x="20" y="229" width="860" height="109" rx="12"/><text class="h" x="38" y="258">2. MatimoInstance.init(autoDiscover: true)</text><text class="t" x="38" y="281">Entry points: scans @matimo/* (TS) or matimo-* (PY) packages via package.json or pkg_resources</text><text class="t" x="38" y="302">Filesystem: recursively scans the toolPaths directories for YAML and JavaScript or Python tool definitions</text><text class="t" x="38" y="323">Registry: registers every discovered tool</text><path class="ln" d="M450 338 V364" marker-end="url(#ar)"/><rect class="box" x="20" y="364" width="860" height="67" rx="12"/><text class="h" x="38" y="393">3. Filter tools</text><text class="t" x="38" y="416">Allow and deny lists</text><path class="ln" d="M450 431 V457" marker-end="url(#ar)"/><rect class="box" x="20" y="457" width="860" height="67" rx="12"/><text class="h" x="38" y="486">4. Register each tool on McpServer (MCP SDK)</text><text class="t" x="38" y="509">Converts YAML params to Zod schemas (TS) or Pydantic models (PY), then to MCP input schemas</text><path class="ln" d="M450 524 V550" marker-end="url(#ar)"/><rect class="box ok" x="20" y="550" width="860" height="88" rx="12"/><text class="h ok" x="38" y="579">5. Connect the transport</text><text class="t" x="38" y="602">stdio: StdioServerTransport (local clients)</text><text class="t" x="38" y="623">http or https: StreamableHTTPServerTransport with Bearer auth</text>
</svg>
