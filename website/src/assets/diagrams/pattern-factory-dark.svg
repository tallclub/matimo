<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 356" width="560" height="356" role="img" aria-label="An agent with custom logic routes to tools itself and calls matimo.execute directly, which runs the tool executors.">
  <title>An agent with custom logic routes to tools itself and calls matimo.execute directly, which runs the tool executors.</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#9a9aa8"/></marker>
    <style>
      .bg { fill: #0b0b10; }
      .box { fill: #14141b; stroke: #2a2a35; stroke-width: 1.2; }
      .box.accent { fill: #1a0f15; stroke: #ff3d7f; stroke-width: 1.4; }
      .box.ok { fill: #0f1a15; stroke: #3ddc97; stroke-width: 1.3; }
      .box.bad { fill: #1a1010; stroke: #ff5c5c; stroke-width: 1.3; }
      .chip { fill: #1b1b24; stroke: #2a2a35; stroke-width: 1; }
      .pill { fill: #1b1b24; stroke: #2a2a35; stroke-width: 1; }
      .pill.ok { stroke: #3ddc97; } .pill.bad { stroke: #ff5c5c; }
      .h { font: 650 15.5px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #ececf1; }
      .h.accent { fill: #ff7aa8; } .h.ok { fill: #7ae7b9; } .h.bad { fill: #ff8a8a; }
      .hs { font: 650 14px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #ececf1; }
      .t { font: 400 13.5px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #c4c4d0; }
      .sub { fill: #9a9aa8; }
      .m { font: 400 12.5px 'JetBrains Mono Variable', ui-monospace, Menlo, Consolas, monospace; fill: #c4c4d0; }
      .pt { font: 600 12px 'Inter Variable', Inter, system-ui, 'Segoe UI', sans-serif; fill: #c4c4d0; }
      .pt.ok { fill: #7ae7b9; } .pt.bad { fill: #ff8a8a; }
      .ln { stroke: #9a9aa8; stroke-width: 1.5; fill: none; }
    </style>
  </defs>
  <rect class="bg" width="560" height="356" rx="18"/>
  <rect class="box" x="20" y="20" width="520" height="130" rx="12"/><text class="h" x="38" y="49">Agent with custom logic</text><text class="m" x="38" y="72">if (prompt.includes('calc'))</text><text class="m" x="38" y="93">  m.execute('calculator', ...)</text><text class="m" x="38" y="114">if (prompt.includes('email'))</text><text class="m" x="38" y="135">  m.execute('gmail-send-email')</text><path class="ln" d="M280 150 V176" marker-end="url(#ar)"/><rect class="box" x="20" y="176" width="520" height="67" rx="12"/><text class="h" x="38" y="205">Matimo SDK</text><text class="m" x="38" y="228">m.execute(toolName, params)</text><path class="ln" d="M280 243 V269" marker-end="url(#ar)"/><rect class="box" x="20" y="269" width="520" height="67" rx="12"/><text class="h" x="38" y="298">Tool executors</text><text class="t" x="38" y="321">HTTP, function or command</text>
</svg>
