name: composio_asana_get_goals
description: >-
  Tool to retrieve multiple goals. use when you need to get a list of goals, optionally filtered by
  workspace, team, portfolio, project, time period, or archived status.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ASANA toolkit, scoped to the calling tenant. The
      "Connect ASANA" flow must be completed before this tool will succeed.
    required: true
  team:
    type: string
    description: Globally unique identifier for the team.
    default: null
  limit:
    type: number
    description: The number of results to return.
    default: null
  offset:
    type: string
    description: Offset token for pagination.
    default: null
  project:
    type: string
    description: Globally unique identifier for the project.
    default: null
  archived:
    type: boolean
    description: Filter to archived goals.
    default: null
  portfolio:
    type: string
    description: Globally unique identifier for the portfolio.
    default: null
  workspace:
    type: string
    description: Globally unique identifier for the workspace or organization.
    default: null
  opt_fields:
    type: array
    description: >-
      Defines fields to return. Some requests support structured objects supporting cascades of
      multiple objects separated by commas; "data.gid" will return the gid field of the data object
      or "data.subtask.gid" will return the gid field of the subtask object.
    default: null
  time_period:
    type: string
    description: Globally unique identifier for the time period.
    default: null
  is_workspace_level:
    type: boolean
    description: Filter to goals at the workspace level.
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ASANA_GET_GOALS
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_asana_get_goals
      team: '{team}'
      limit: '{limit}'
      offset: '{offset}'
      project: '{project}'
      archived: '{archived}'
      portfolio: '{portfolio}'
      workspace: '{workspace}'
      opt_fields: '{opt_fields}'
      time_period: '{time_period}'
      is_workspace_level: '{is_workspace_level}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - asana
notes:
  env: COMPOSIO_API_KEY
  toolkit: asana
  composio_slug: ASANA_GET_GOALS
