name: composio_outlook_delete_mail_folder
description: Delete a mail folder from the user's mailbox. use when you need to remove an existing mail folder.
version: 1.0.0
risk: high
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the OUTLOOK toolkit, scoped to the calling tenant. The
      "Connect OUTLOOK" flow must be completed before this tool will succeed.
    required: true
  user_id:
    type: string
    description: >-
      Identifier for the user whose mailbox contains the folder to delete. Use 'me' for the
      authenticated user or provide the user's principal name or ID.
    default: me
  folder_id:
    type: string
    description: >-
      The unique identifier or well-known name of the mail folder to delete (e.g., folder ID or
      'Drafts', 'SentItems').
    required: true
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/OUTLOOK_DELETE_MAIL_FOLDER
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_outlook_delete_mail_folder
      user_id: '{user_id}'
      folder_id: '{folder_id}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - outlook
notes:
  env: COMPOSIO_API_KEY
  toolkit: outlook
  composio_slug: OUTLOOK_DELETE_MAIL_FOLDER
