name: composio_outlook_outlook_add_event_attachment
description: >-
  Adds an attachment to a specific outlook calendar event. use when you need to attach a file or
  nested item to an existing event.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the OUTLOOK toolkit, scoped to the calling tenant. The
      "Connect OUTLOOK" flow must be completed before this tool will succeed.
    required: true
  item:
    type: object
    description: The nested item payload; required when '@odata.type' is itemAttachment.
    default: null
  name:
    type: string
    description: The display name of the attachment.
    required: true
  user_id:
    type: string
    description: The user's email address or 'me' for the authenticated user.
    default: me
  event_id:
    type: string
    description: The unique identifier of the calendar event to which the attachment will be added.
    required: true
  odata_type:
    type: string
    description: >-
      Attachment type: '#microsoft.graph.fileAttachment' requires 'contentBytes';
      '#microsoft.graph.itemAttachment' requires 'item'.
    required: true
    enum:
      - '#microsoft.graph.fileAttachment'
      - '#microsoft.graph.itemAttachment'
  contentBytes:
    type: string
    description: Base64-encoded file contents; required when '@odata.type' is fileAttachment.
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/OUTLOOK_OUTLOOK_ADD_EVENT_ATTACHMENT
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_outlook_outlook_add_event_attachment
      item: '{item}'
      name: '{name}'
      user_id: '{user_id}'
      event_id: '{event_id}'
      odata_type: '{odata_type}'
      contentBytes: '{contentBytes}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - outlook
notes:
  env: COMPOSIO_API_KEY
  toolkit: outlook
  composio_slug: OUTLOOK_OUTLOOK_ADD_EVENT_ATTACHMENT
