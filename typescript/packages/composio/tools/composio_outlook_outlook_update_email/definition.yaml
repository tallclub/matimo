name: composio_outlook_outlook_update_email
description: >-
  Updates specified properties of an existing email message; `message id` must identify a valid
  message within the specified `user id`'s mailbox.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the OUTLOOK toolkit, scoped to the calling tenant. The
      "Connect OUTLOOK" flow must be completed before this tool will succeed.
    required: true
  body:
    type: object
    description: New body content (Text or HTML). If omitted, the existing message body remains unchanged.
    default: null
  subject:
    type: string
    description: >-
      New subject. Omitting or providing an empty string clears the subject. To preserve the current
      subject, provide its existing value.
    default: ''
  user_id:
    type: string
    description: >-
      The UPN (User Principal Name) of the user whose mailbox contains the message, or 'me' for the
      currently authenticated user. This determines whose message is updated.
    default: me
  importance:
    type: string
    description: New importance level ('low', 'normal', 'high'). If omitted, importance is set to 'normal'.
    default: normal
  message_id:
    type: string
    description: >-
      The unique identifier of the email message to be updated. This ID is typically obtained from
      listing messages or creating/sending a message.
    required: true
  cc_recipients:
    type: array
    description: >-
      List of CC recipients; replaces all existing CCs. Omitting this field removes all current CC
      recipients.
  to_recipients:
    type: array
    description: >-
      List of TO recipients; replaces all existing TOs. Omitting this field removes all current TO
      recipients.
  bcc_recipients:
    type: array
    description: >-
      List of BCC recipients; replaces all existing BCCs. Omitting this field removes all current
      BCC recipients.
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/OUTLOOK_OUTLOOK_UPDATE_EMAIL
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_outlook_outlook_update_email
      body: '{body}'
      subject: '{subject}'
      user_id: '{user_id}'
      importance: '{importance}'
      message_id: '{message_id}'
      cc_recipients: '{cc_recipients}'
      to_recipients: '{to_recipients}'
      bcc_recipients: '{bcc_recipients}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - outlook
notes:
  env: COMPOSIO_API_KEY
  toolkit: outlook
  composio_slug: OUTLOOK_OUTLOOK_UPDATE_EMAIL
