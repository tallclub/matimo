name: composio_asana_create_a_tag_in_a_workspace
description: >-
  Creates a new tag, with properties like name and color defined in the request body, within a
  specific asana workspace (using `workspace gid`); this tag helps categorize tasks, is confined to
  the workspace, and is not automatically applied to tasks.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ASANA toolkit, scoped to the calling tenant. The
      "Connect ASANA" flow must be completed before this tool will succeed.
    required: true
  data:
    type: object
    description: >-
      The properties for the tag creation, including name (required), color (optional), and notes
      (optional).
    required: true
  opt_fields:
    type: array
    description: >-
      Comma-separated string of fields from `OptFieldsEnm0` (e.g., 'name', 'color') to include in
      the response; returns a compact representation by default.
    default: null
  opt_pretty:
    type: boolean
    description: If true, pretty-prints the JSON response; useful for debugging but may increase response size.
    default: null
  workspace_gid:
    type: string
    description: >-
      The globally unique identifier (GID) for the workspace or organization in which to create the
      tag.
    required: true
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ASANA_CREATE_A_TAG_IN_A_WORKSPACE
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_asana_create_a_tag_in_a_workspace
      data: '{data}'
      opt_fields: '{opt_fields}'
      opt_pretty: '{opt_pretty}'
      workspace_gid: '{workspace_gid}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - asana
notes:
  env: COMPOSIO_API_KEY
  toolkit: asana
  composio_slug: ASANA_CREATE_A_TAG_IN_A_WORKSPACE
