name: composio_asana_get_tasks_from_a_project
description: >-
  Retrieves tasks from a specified asana project, allowing filtering by completion status and
  selection of optional fields for detailed responses.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ASANA toolkit, scoped to the calling tenant. The
      "Connect ASANA" flow must be completed before this tool will succeed.
    required: true
  limit:
    type: number
    description: Maximum number of tasks to return per page (1-100).
  offset:
    type: string
    description: >-
      Opaque offset token for pagination from a previous request. If omitted, returns first page.
      Tokens may expire.
  opt_fields:
    type: array
    description: >-
      Optional fields for a detailed task representation (e.g., 'assignee', 'due_on'), as tasks are
      compact by default. Refer to Asana API docs for all field names.
  opt_pretty:
    type: boolean
    description: If true, returns human-readable JSON; useful for debugging but increases response size.
  project_gid:
    type: string
    description: Globally unique identifier (GID) of the project.
    required: true
  completed_since:
    type: string
    description: >-
      Filters tasks: returns incomplete tasks or those completed after the specified ISO 8601
      date-time (e.g., '2023-10-26T10:00:00Z') or 'now'.
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ASANA_GET_TASKS_FROM_A_PROJECT
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_asana_get_tasks_from_a_project
      limit: '{limit}'
      offset: '{offset}'
      opt_fields: '{opt_fields}'
      opt_pretty: '{opt_pretty}'
      project_gid: '{project_gid}'
      completed_since: '{completed_since}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - asana
notes:
  env: COMPOSIO_API_KEY
  toolkit: asana
  composio_slug: ASANA_GET_TASKS_FROM_A_PROJECT
