name: composio_one_drive_onedrive_list_items
description: >-
  Retrieves all files and folders as `driveitem` resources from the root of a specified user's
  onedrive, automatically handling pagination.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ONE_DRIVE toolkit, scoped to the calling tenant. The
      "Connect ONE_DRIVE" flow must be completed before this tool will succeed.
    required: true
  top:
    type: number
    description: >-
      Maximum items per API request, setting the batch size; the action automatically handles
      pagination to fetch all items. The Microsoft Graph API may limit this (e.g., to 999).
    default: 50
  select:
    type: array
    description: >-
      Specifies `driveItem` properties to return. If omitted or empty, default properties are
      returned. Refer to Microsoft Graph API documentation for a complete list of `driveItem`
      properties.
    default: []
  user_id:
    type: string
    description: >-
      User's unique identifier (e.g., 'user@example.com', object ID) or 'me' for the authenticated
      user's OneDrive.
    default: me
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ONE_DRIVE_ONEDRIVE_LIST_ITEMS
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_one_drive_onedrive_list_items
      top: '{top}'
      select: '{select}'
      user_id: '{user_id}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - one_drive
notes:
  env: COMPOSIO_API_KEY
  toolkit: one_drive
  composio_slug: ONE_DRIVE_ONEDRIVE_LIST_ITEMS
