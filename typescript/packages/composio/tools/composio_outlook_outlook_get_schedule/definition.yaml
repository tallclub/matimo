name: composio_outlook_outlook_get_schedule
description: >-
  Retrieves free/busy schedule information for specified email addresses within a defined time
  window.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the OUTLOOK toolkit, scoped to the calling tenant. The
      "Connect OUTLOOK" flow must be completed before this tool will succeed.
    required: true
  EndTime:
    type: object
    description: >-
      The end date, time, and time zone for the period for which to retrieve schedules. The period
      can be up to 62 days.
    required: true
  Schedules:
    type: array
    description: >-
      A list of SMTP email addresses for users, distribution lists, or resources whose schedules are
      to be retrieved. Maximum of 20 addresses.
    required: true
  StartTime:
    type: object
    description: The start date, time, and time zone for the period for which to retrieve schedules.
    required: true
  availabilityViewInterval:
    type: string
    description: >-
      The duration of each time slot in the availability view, specified in minutes. Minimum: 5,
      Maximum: 1440. Default: 30.
    default: '30'
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/OUTLOOK_OUTLOOK_GET_SCHEDULE
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_outlook_outlook_get_schedule
      EndTime: '{EndTime}'
      Schedules: '{Schedules}'
      StartTime: '{StartTime}'
      availabilityViewInterval: '{availabilityViewInterval}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - outlook
notes:
  env: COMPOSIO_API_KEY
  toolkit: outlook
  composio_slug: OUTLOOK_OUTLOOK_GET_SCHEDULE
