name: composio_one_drive_copy_item
description: >-
  Tool to copy a driveitem (file or folder) to a new location asynchronously. use when you need to
  duplicate an item, optionally renaming it or specifying a different parent folder. the operation
  is asynchronous; the response provides a url to monitor the copy progress.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ONE_DRIVE toolkit, scoped to the calling tenant. The
      "Connect ONE_DRIVE" flow must be completed before this tool will succeed.
    required: true
  name:
    type: string
    description: The new name for the copied item. If not provided, the original name is used.
    default: null
  item_id:
    type: string
    description: The ID of the DriveItem to be copied.
    required: true
  site_id:
    type: string
    description: The ID of the site if the item is in a SharePoint site.
    default: null
  user_id:
    type: string
    description: The ID of the user if accessing another user's drive.
    default: null
  drive_id:
    type: string
    description: >-
      The ID of the drive where the item is located. If not provided, 'me' (user's default drive) is
      assumed.
    default: null
  group_id:
    type: string
    description: The ID of the group if the item is in a group drive.
    default: null
  children_only:
    type: boolean
    description: >-
      If set to true, only the children of the source driveItem (if it's a folder) are copied, not
      the driveItem itself. Defaults to false.
    default: false
  parent_reference:
    type: object
    description: >-
      Reference to the parent item (folder) where the copy will be created. If not provided, the
      item is copied to the same folder as the original.
    default: null
  include_all_version_history:
    type: boolean
    description: >-
      If set to true, the version history of the source file is copied to the destination. Defaults
      to false.
    default: false
  '@microsoft.graph.conflictBehavior':
    type: string
    description: >-
      Specifies how to handle a naming conflict if an item with the same name already exists in the
      destination. 'fail' (default), 'replace', or 'rename'.
    enum:
      - fail
      - replace
      - rename
    default: fail
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ONE_DRIVE_COPY_ITEM
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_one_drive_copy_item
      name: '{name}'
      item_id: '{item_id}'
      site_id: '{site_id}'
      user_id: '{user_id}'
      drive_id: '{drive_id}'
      group_id: '{group_id}'
      children_only: '{children_only}'
      parent_reference: '{parent_reference}'
      include_all_version_history: '{include_all_version_history}'
      '@microsoft.graph.conflictBehavior': '{@microsoft.graph.conflictBehavior}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - one_drive
notes:
  env: COMPOSIO_API_KEY
  toolkit: one_drive
  composio_slug: ONE_DRIVE_COPY_ITEM
