name: composio_microsoft_teams_teams_create_channel
description: Creates a new 'standard', 'private', or 'shared' channel within a specified microsoft teams team.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the MICROSOFT_TEAMS toolkit, scoped to the calling
      tenant. The "Connect MICROSOFT_TEAMS" flow must be completed before this tool will succeed.
    required: true
  name:
    type: string
    description: >-
      The display name for the new channel. Maximum length is 50 characters. Cannot contain
      characters ~ # % & * { } + / \ : < > ? | ' " or start with an underscore or period, or end
      with a period.
    required: true
  team_id:
    type: string
    description: The GUID of the existing Microsoft Teams team where the new channel will be created.
    required: true
  description:
    type: string
    description: >-
      An optional, user-friendly description of the channel's purpose. Maximum length is 1024
      characters.
    default: ''
  membership_type:
    type: string
    description: >-
      Membership type determining channel accessibility: 'standard' is accessible to all team
      members, 'private' is only accessible to a specific subset of team members, and 'shared' can
      be shared with people outside the team or organization (requires appropriate policies).
    default: standard
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/MICROSOFT_TEAMS_TEAMS_CREATE_CHANNEL
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_microsoft_teams_teams_create_channel
      name: '{name}'
      team_id: '{team_id}'
      description: '{description}'
      membership_type: '{membership_type}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - microsoft_teams
notes:
  env: COMPOSIO_API_KEY
  toolkit: microsoft_teams
  composio_slug: MICROSOFT_TEAMS_TEAMS_CREATE_CHANNEL
