name: composio_linear_update_issue
description: >-
  Updates an existing linear issue using its `issue id`; requires at least one other attribute for
  modification, and all provided entity ids (for state, assignee, labels, etc.) must be valid.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the LINEAR toolkit, scoped to the calling tenant. The
      "Connect LINEAR" flow must be completed before this tool will succeed.
    required: true
  title:
    type: string
    description: New title for the issue.
    default: null
  team_id:
    type: string
    description: Identifier of the team to associate with the issue.
    default: null
  due_date:
    type: string
    description: New due date in 'YYYY,MM,DD,hh,mm,ss' format (e.g., '2024,10,27,12,58,00').
    default: null
  estimate:
    type: number
    description: New time estimate in minutes.
    default: null
  issue_id:
    type: string
    description: Identifier of the issue to update.
    required: true
  priority:
    type: number
    description: 'Priority: 0 (No), 1 (Urgent), 2 (High), 3 (Normal), 4 (Low).'
    default: null
  state_id:
    type: string
    description: Identifier of the new state (e.g., To Do, In Progress, Done).
    default: null
  label_ids:
    type: array
    description: >-
      List of label identifiers to set; replaces all existing labels. An empty list removes all
      labels.
    default: null
  parent_id:
    type: string
    description: Identifier of an existing issue to set as parent.
    default: null
  project_id:
    type: string
    description: Identifier of the project to associate with the issue.
    default: null
  assignee_id:
    type: string
    description: Identifier of the user to assign to the issue.
    default: null
  description:
    type: string
    description: New Markdown description for the issue.
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/LINEAR_UPDATE_ISSUE
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_linear_update_issue
      title: '{title}'
      team_id: '{team_id}'
      due_date: '{due_date}'
      estimate: '{estimate}'
      issue_id: '{issue_id}'
      priority: '{priority}'
      state_id: '{state_id}'
      label_ids: '{label_ids}'
      parent_id: '{parent_id}'
      project_id: '{project_id}'
      assignee_id: '{assignee_id}'
      description: '{description}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - linear
notes:
  env: COMPOSIO_API_KEY
  toolkit: linear
  composio_slug: LINEAR_UPDATE_ISSUE
