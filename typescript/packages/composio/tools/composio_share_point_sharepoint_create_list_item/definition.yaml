name: composio_share_point_sharepoint_create_list_item
description: Creates a new item in a sharepoint list.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the SHARE_POINT toolkit, scoped to the calling tenant.
      The "Connect SHARE_POINT" flow must be completed before this tool will succeed.
    required: true
  list_name:
    type: string
    description: The name or title of the list where the item will be created.
    required: true
  item_properties:
    type: object
    description: >-
      Dictionary of field names and values for the list item. Example: {'Title': 'New Item', 'Body':
      'Content'}
    required: true
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/SHARE_POINT_SHAREPOINT_CREATE_LIST_ITEM
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_share_point_sharepoint_create_list_item
      list_name: '{list_name}'
      item_properties: '{item_properties}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - share_point
notes:
  env: COMPOSIO_API_KEY
  toolkit: share_point
  composio_slug: SHARE_POINT_SHAREPOINT_CREATE_LIST_ITEM
