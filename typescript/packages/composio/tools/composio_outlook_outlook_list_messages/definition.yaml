name: composio_outlook_outlook_list_messages
description: >-
  Retrieves a list of email messages from a specified mail folder in an outlook mailbox, with
  options for filtering (including by conversationid to get all messages in a thread), pagination,
  and sorting; ensure 'user id' and 'folder' are valid, and all date/time strings are in iso 8601
  format.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the OUTLOOK toolkit, scoped to the calling tenant. The
      "Connect OUTLOOK" flow must be completed before this tool will succeed.
    required: true
  top:
    type: number
    description: Maximum number of messages to return (1-1000).
    default: 10
  skip:
    type: number
    description: Number of messages to skip from the beginning of the result set, for pagination.
    default: 0
  folder:
    type: string
    description: >-
      ID or well-known name of the mail folder (e.g., 'Inbox', 'SentItems', 'Drafts',
      'DeletedItems').
    default: inbox
  select:
    type: array
    description: >-
      List of message properties to include. Each item is a property name like 'subject', 'from', or
      'receivedDateTime'. MUST be provided as a list. Reduces data transfer.
  is_read:
    type: boolean
    description: >-
      Filter by read status: 'true' for read, 'false' for unread. Unspecified means no filter by
      read status.
    default: null
  orderby:
    type: array
    description: >-
      List of properties to sort results by, with direction. Each item is a string like
      'receivedDateTime desc' or 'subject asc'. MUST be provided as a list, even for single sort
      criteria.
    default:
      - receivedDateTime desc
  subject:
    type: string
    description: Filter by exact match of the subject line.
    default: null
  user_id:
    type: string
    description: >-
      Target user's email or 'me' for authenticated user. For delegated access, use shared mailbox
      or delegated user's email.
    default: me
  categories:
    type: array
    description: Filter by categories (case-sensitive); matches if tagged with any specified category.
  importance:
    type: string
    description: 'Filter by importance: ''low'', ''normal'', or ''high''.'
    default: null
  from_address:
    type: string
    description: Filter by the sender's exact email address.
    default: null
  conversationId:
    type: string
    description: Filter messages by conversation ID to retrieve all messages in a specific email thread.
    default: null
  has_attachments:
    type: boolean
    description: >-
      Filter by attachment presence: 'true' for messages with attachments, 'false' for those
      without.
    default: null
  subject_contains:
    type: string
    description: Filter messages where the subject contains the specified case-insensitive substring.
    default: null
  subject_endswith:
    type: string
    description: Filter messages where the subject ends with the specified case-insensitive string.
    default: null
  sent_date_time_gt:
    type: string
    description: Filter messages sent after this ISO 8601 timestamp.
    default: null
  sent_date_time_lt:
    type: string
    description: Filter messages sent before this ISO 8601 timestamp.
    default: null
  subject_startswith:
    type: string
    description: Filter messages where the subject starts with the specified case-insensitive string.
    default: null
  received_date_time_ge:
    type: string
    description: Filter messages received on or after this ISO 8601 timestamp.
    default: null
  received_date_time_gt:
    type: string
    description: Filter messages received after this ISO 8601 timestamp (e.g., '2023-01-01T00:00:00Z').
    default: null
  received_date_time_le:
    type: string
    description: Filter messages received on or before this ISO 8601 timestamp.
    default: null
  received_date_time_lt:
    type: string
    description: Filter messages received before this ISO 8601 timestamp.
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/OUTLOOK_OUTLOOK_LIST_MESSAGES
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_outlook_outlook_list_messages
      top: '{top}'
      skip: '{skip}'
      folder: '{folder}'
      select: '{select}'
      is_read: '{is_read}'
      orderby: '{orderby}'
      subject: '{subject}'
      user_id: '{user_id}'
      categories: '{categories}'
      importance: '{importance}'
      from_address: '{from_address}'
      conversationId: '{conversationId}'
      has_attachments: '{has_attachments}'
      subject_contains: '{subject_contains}'
      subject_endswith: '{subject_endswith}'
      sent_date_time_gt: '{sent_date_time_gt}'
      sent_date_time_lt: '{sent_date_time_lt}'
      subject_startswith: '{subject_startswith}'
      received_date_time_ge: '{received_date_time_ge}'
      received_date_time_gt: '{received_date_time_gt}'
      received_date_time_le: '{received_date_time_le}'
      received_date_time_lt: '{received_date_time_lt}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - outlook
notes:
  env: COMPOSIO_API_KEY
  toolkit: outlook
  composio_slug: OUTLOOK_OUTLOOK_LIST_MESSAGES
