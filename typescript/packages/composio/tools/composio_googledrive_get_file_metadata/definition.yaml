name: composio_googledrive_get_file_metadata
description: >-
  Tool to get a file's metadata by id. use when you need to retrieve the metadata for a specific
  file in google drive.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the GOOGLEDRIVE toolkit, scoped to the calling tenant.
      The "Connect GOOGLEDRIVE" flow must be completed before this tool will succeed.
    required: true
  fileId:
    type: string
    description: The ID of the file.
    required: true
  includeLabels:
    type: string
    description: A comma-separated list of IDs of labels to include in the labelInfo part of the response.
    default: null
  acknowledgeAbuse:
    type: boolean
    description: >-
      Whether the user is acknowledging the risk of downloading known malware or other abusive
      files. This is only applicable when the alt parameter is set to media and the user is the
      owner of the file or an organizer of the shared drive in which the file resides.
    default: null
  supportsAllDrives:
    type: boolean
    description: >-
      Whether the requesting application supports both My Drives and shared drives. This parameter
      will default to false.
    default: null
  includePermissionsForView:
    type: string
    description: >-
      Specifies which additional view's permissions to include in the response. Only 'published' is
      supported.
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/GOOGLEDRIVE_GET_FILE_METADATA
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_googledrive_get_file_metadata
      fileId: '{fileId}'
      includeLabels: '{includeLabels}'
      acknowledgeAbuse: '{acknowledgeAbuse}'
      supportsAllDrives: '{supportsAllDrives}'
      includePermissionsForView: '{includePermissionsForView}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - googledrive
notes:
  env: COMPOSIO_API_KEY
  toolkit: googledrive
  composio_slug: GOOGLEDRIVE_GET_FILE_METADATA
