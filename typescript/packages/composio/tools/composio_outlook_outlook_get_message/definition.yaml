name: composio_outlook_outlook_get_message
description: >-
  Retrieves a specific email message by its id from the specified user's outlook mailbox. use the
  'select' parameter to include specific fields like 'internetmessageheaders' for filtering
  automated emails.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the OUTLOOK toolkit, scoped to the calling tenant. The
      "Connect OUTLOOK" flow must be completed before this tool will succeed.
    required: true
  select:
    type: string
    description: >-
      Comma-separated list of properties to include. Use 'internetMessageHeaders' to get email
      headers for filtering automated messages.
    default: null
  user_id:
    type: string
    description: User's email address, UPN, or 'me' for the currently authenticated user.
    default: me
  message_id:
    type: string
    description: Unique ID of the Outlook email message to retrieve.
    required: true
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/OUTLOOK_OUTLOOK_GET_MESSAGE
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_outlook_outlook_get_message
      select: '{select}'
      user_id: '{user_id}'
      message_id: '{message_id}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - outlook
notes:
  env: COMPOSIO_API_KEY
  toolkit: outlook
  composio_slug: OUTLOOK_OUTLOOK_GET_MESSAGE
