name: composio_googlecalendar_calendar_list_insert
description: Inserts an existing calendar into the user's calendar list.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the GOOGLECALENDAR toolkit, scoped to the calling
      tenant. The "Connect GOOGLECALENDAR" flow must be completed before this tool will succeed.
    required: true
  id:
    type: string
    description: The identifier of the calendar to insert.
    required: true
  hidden:
    type: boolean
    description: Whether the calendar has been hidden from the list. Default is False.
    default: null
  color_id:
    type: string
    description: >-
      The color of the calendar. This is an ID referring to an entry in the calendarCore color
      palette.
    default: null
  selected:
    type: boolean
    description: Whether the calendar is selected and visible in the calendar list. Default is True.
    default: null
  background_color:
    type: string
    description: The background color of the calendar in the Web UI. (Hexadecimal color code)
    default: null
  color_rgb_format:
    type: boolean
    description: >-
      Whether to use the foregroundColor and backgroundColor fields to write the calendar colors
      (RGB). If this feature is used, the index-based colorId field will be set to the best matching
      option automatically. Optional. The default is False.
    default: null
  foreground_color:
    type: string
    description: The foreground color of the calendar in the Web UI. (Hexadecimal color code)
    default: null
  summary_override:
    type: string
    description: The summary that the authenticated user has set for this calendar.
    default: null
  default_reminders:
    type: array
    description: The default reminders that the authenticated user has for this calendar.
    default: null
  notification_settings:
    type: object
    description: The notifications that the authenticated user is receiving for this calendar.
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/GOOGLECALENDAR_CALENDAR_LIST_INSERT
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_googlecalendar_calendar_list_insert
      id: '{id}'
      hidden: '{hidden}'
      color_id: '{color_id}'
      selected: '{selected}'
      background_color: '{background_color}'
      color_rgb_format: '{color_rgb_format}'
      foreground_color: '{foreground_color}'
      summary_override: '{summary_override}'
      default_reminders: '{default_reminders}'
      notification_settings: '{notification_settings}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - googlecalendar
notes:
  env: COMPOSIO_API_KEY
  toolkit: googlecalendar
  composio_slug: GOOGLECALENDAR_CALENDAR_LIST_INSERT
