name: composio_googlecalendar_free_busy_query
description: Returns free/busy information for a set of calendars.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the GOOGLECALENDAR toolkit, scoped to the calling
      tenant. The "Connect GOOGLECALENDAR" flow must be completed before this tool will succeed.
    required: true
  items:
    type: array
    description: List of calendars and/or groups to query.
    required: true
  timeMax:
    type: string
    description: The end of the interval for the query formatted as per RFC3339.
    required: true
  timeMin:
    type: string
    description: The start of the interval for the query formatted as per RFC3339.
    required: true
  timeZone:
    type: string
    description: Time zone used in the response. Optional. The default is UTC.
    default: null
  groupExpansionMax:
    type: number
    description: >-
      Maximal number of calendar identifiers to be provided for a single group. Optional. An error
      is returned for a group with more members than this value. Maximum value is 100.
    default: null
  calendarExpansionMax:
    type: number
    description: >-
      Maximal number of calendars for which FreeBusy information is to be provided. Optional.
      Maximum value is 50.
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/GOOGLECALENDAR_FREE_BUSY_QUERY
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_googlecalendar_free_busy_query
      items: '{items}'
      timeMax: '{timeMax}'
      timeMin: '{timeMin}'
      timeZone: '{timeZone}'
      groupExpansionMax: '{groupExpansionMax}'
      calendarExpansionMax: '{calendarExpansionMax}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - googlecalendar
notes:
  env: COMPOSIO_API_KEY
  toolkit: googlecalendar
  composio_slug: GOOGLECALENDAR_FREE_BUSY_QUERY
