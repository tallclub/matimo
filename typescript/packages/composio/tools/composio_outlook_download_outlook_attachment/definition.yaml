name: composio_outlook_download_outlook_attachment
description: >-
  Downloads a specific file attachment from an email message in a microsoft outlook mailbox; the
  attachment must contain 'contentbytes' (binary data) and not be a link or embedded item.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the OUTLOOK toolkit, scoped to the calling tenant. The
      "Connect OUTLOOK" flow must be completed before this tool will succeed.
    required: true
  user_id:
    type: string
    description: >-
      The user's UPN (User Principal Name) or 'me' for the authenticated user. This identifies the
      mailbox where the message is located.
    default: me
  file_name:
    type: string
    description: >-
      The desired filename for the downloaded attachment. This name will be assigned to the
      `FileDownloadable` object.
    required: true
  message_id:
    type: string
    description: >-
      The unique identifier of the email message that contains the attachment to be downloaded. This
      ID is typically obtained when listing or retrieving messages.
    required: true
  attachment_id:
    type: string
    description: >-
      The unique identifier of the attachment to be downloaded. This ID is typically obtained from
      the message's details when an email message object is retrieved.
    required: true
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/OUTLOOK_DOWNLOAD_OUTLOOK_ATTACHMENT
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_outlook_download_outlook_attachment
      user_id: '{user_id}'
      file_name: '{file_name}'
      message_id: '{message_id}'
      attachment_id: '{attachment_id}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - outlook
notes:
  env: COMPOSIO_API_KEY
  toolkit: outlook
  composio_slug: OUTLOOK_DOWNLOAD_OUTLOOK_ATTACHMENT
