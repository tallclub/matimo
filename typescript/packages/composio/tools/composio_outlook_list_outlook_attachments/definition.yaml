name: composio_outlook_list_outlook_attachments
description: >-
  Lists metadata (like name, size, and type, but not `contentbytes`) for all attachments of a
  specified outlook email message.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the OUTLOOK toolkit, scoped to the calling tenant. The
      "Connect OUTLOOK" flow must be completed before this tool will succeed.
    required: true
  user_id:
    type: string
    description: >-
      The unique identifier of the user. Use the user's UPN (e.g., 'AdeleV@contoso.onmicrosoft.com')
      or 'me' for the currently authenticated user. This specifies the mailbox to query.
    default: me
  message_id:
    type: string
    description: >-
      The unique identifier of the email message from which to retrieve attachments. This ID is
      specific to the Outlook message.
    required: true
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/OUTLOOK_LIST_OUTLOOK_ATTACHMENTS
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_outlook_list_outlook_attachments
      user_id: '{user_id}'
      message_id: '{message_id}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - outlook
notes:
  env: COMPOSIO_API_KEY
  toolkit: outlook
  composio_slug: OUTLOOK_LIST_OUTLOOK_ATTACHMENTS
