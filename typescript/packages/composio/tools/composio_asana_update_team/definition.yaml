name: composio_asana_update_team
description: >-
  Tool to update details of an existing team. use when you need to change a team's name,
  description, or organization.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ASANA toolkit, scoped to the calling tenant. The
      "Connect ASANA" flow must be completed before this tool will succeed.
    required: true
  name:
    type: string
    description: The new name of the team.
    default: null
  team_gid:
    type: string
    description: Globally unique identifier for the team.
    required: true
  opt_fields:
    type: array
    description: Defines fields to return.
    default: null
  opt_pretty:
    type: boolean
    description: Provides “pretty” output.
    default: null
  description:
    type: string
    description: The new description of the team.
    default: null
  organization:
    type: string
    description: >-
      GID of the organization to which the team belongs. This is the GID of an organization, not its
      name.
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ASANA_UPDATE_TEAM
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_asana_update_team
      name: '{name}'
      team_gid: '{team_gid}'
      opt_fields: '{opt_fields}'
      opt_pretty: '{opt_pretty}'
      description: '{description}'
      organization: '{organization}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - asana
notes:
  env: COMPOSIO_API_KEY
  toolkit: asana
  composio_slug: ASANA_UPDATE_TEAM
