name: composio_googlecalendar_list_calendars
description: >-
  Retrieves calendars from the user's google calendar list, with options for pagination and
  filtering.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the GOOGLECALENDAR toolkit, scoped to the calling
      tenant. The "Connect GOOGLECALENDAR" flow must be completed before this tool will succeed.
    required: true
  page_token:
    type: string
    description: Token for the page of results to return, from a previous response.
    default: null
  sync_token:
    type: string
    description: >-
      Sync token from a previous list request to get only changed entries; showDeleted, showHidden,
      and pageToken are ignored if provided.
    default: null
  max_results:
    type: number
    description: Maximum number of calendars to return per page. Max 250.
    default: 10
  show_hidden:
    type: boolean
    description: Include calendars not typically shown in the UI.
    default: false
  show_deleted:
    type: boolean
    description: Include deleted calendars in the result.
    default: false
  min_access_role:
    type: string
    description: >-
      Minimum access role for calendars returned. Valid values: 'freeBusyReader', 'owner', 'reader',
      'writer'.
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/GOOGLECALENDAR_LIST_CALENDARS
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_googlecalendar_list_calendars
      page_token: '{page_token}'
      sync_token: '{sync_token}'
      max_results: '{max_results}'
      show_hidden: '{show_hidden}'
      show_deleted: '{show_deleted}'
      min_access_role: '{min_access_role}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - googlecalendar
notes:
  env: COMPOSIO_API_KEY
  toolkit: googlecalendar
  composio_slug: GOOGLECALENDAR_LIST_CALENDARS
