name: composio_googlecalendar_events_watch
description: Watch for changes to events resources.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the GOOGLECALENDAR toolkit, scoped to the calling
      tenant. The "Connect GOOGLECALENDAR" flow must be completed before this tool will succeed.
    required: true
  id:
    type: string
    description: A UUID or similar unique string that identifies this channel.
    required: true
  type:
    type: string
    description: The type of delivery mechanism used for this channel.
    default: web_hook
  token:
    type: string
    description: >-
      An arbitrary string delivered to the target address with each notification delivered over this
      channel. Optional.
    default: null
  params:
    type: object
    description: Additional parameters controlling delivery channel behavior. Optional.
    default: null
  address:
    type: string
    description: The address where notifications are delivered for this channel.
    required: true
  payload:
    type: boolean
    description: A Boolean value to indicate whether payload is wanted. Optional.
    default: null
  calendarId:
    type: string
    description: >-
      Calendar identifier. To retrieve calendar IDs call the calendarList.list method. If you want
      to access the primary calendar of the currently logged in user, use the "primary" keyword.
    required: true
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/GOOGLECALENDAR_EVENTS_WATCH
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_googlecalendar_events_watch
      id: '{id}'
      type: '{type}'
      token: '{token}'
      params: '{params}'
      address: '{address}'
      payload: '{payload}'
      calendarId: '{calendarId}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - googlecalendar
notes:
  env: COMPOSIO_API_KEY
  toolkit: googlecalendar
  composio_slug: GOOGLECALENDAR_EVENTS_WATCH
