name: composio_jira_get_issue
description: Retrieves a jira issue by id or key with customizable fields and expansions.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the JIRA toolkit, scoped to the calling tenant. The
      "Connect JIRA" flow must be completed before this tool will succeed.
    required: true
  expand:
    type: string
    description: >-
      A comma-separated string of issue entities to expand in the response, providing more details.
      Common expansions include 'renderedFields' (HTML content), 'changelog' (history),
      'transitions' (available workflows), and 'operations' (available actions).
    default: null
  fields:
    type: array
    description: >-
      A list of field names or IDs to return for the issue. If omitted or empty, a default set of
      fields (often all fields or all navigable fields) is returned. For specific fields, provide a
      list like `["summary", "status"]`.
    default: null
  properties:
    type: array
    description: >-
      A list of issue property keys to include in the response. Issue properties are extra key-value
      data attached to an issue, often by apps. Example: `["jira.meta.data",
      "com.example.custom.info"]`.
    default: null
  fields_by_keys:
    type: boolean
    description: >-
      If true, the strings in the `fields` parameter are interpreted as field keys (e.g., 'summary')
      instead of field IDs (e.g., 'customfield_10000'). Default is false (uses field IDs).
    default: null
  update_history:
    type: boolean
    description: >-
      If true, viewing the issue will add it to the user's 'Recently Viewed' issues list. Set to
      false to prevent this, which can be useful for automated processes. The default behavior (true
      or false) can be determined by Jira's system settings if not explicitly set.
    default: null
  issue_id_or_key:
    type: string
    description: The ID (e.g., '10000') or key (e.g., 'PROJ-123') of the Jira issue to retrieve.
    required: true
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/JIRA_GET_ISSUE
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_jira_get_issue
      expand: '{expand}'
      fields: '{fields}'
      properties: '{properties}'
      fields_by_keys: '{fields_by_keys}'
      update_history: '{update_history}'
      issue_id_or_key: '{issue_id_or_key}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - jira
notes:
  env: COMPOSIO_API_KEY
  toolkit: jira
  composio_slug: JIRA_GET_ISSUE
