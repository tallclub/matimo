name: composio_asana_get_a_project
description: >-
  Retrieves a specific asana project by its `project gid`, with an option to include additional
  fields for comprehensive details using `opt fields`; this action does not return tasks within the
  project.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ASANA toolkit, scoped to the calling tenant. The
      "Connect ASANA" flow must be completed before this tool will succeed.
    required: true
  opt_fields:
    type: array
    description: >-
      Defines a comma-separated list of optional fields for a more detailed project representation
      in the response, beyond the default compact view.
  opt_pretty:
    type: boolean
    description: Pretty-prints the JSON response for readability, useful for debugging.
  project_gid:
    type: string
    description: Globally unique identifier for the project.
    required: true
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ASANA_GET_A_PROJECT
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_asana_get_a_project
      opt_fields: '{opt_fields}'
      opt_pretty: '{opt_pretty}'
      project_gid: '{project_gid}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - asana
notes:
  env: COMPOSIO_API_KEY
  toolkit: asana
  composio_slug: ASANA_GET_A_PROJECT
