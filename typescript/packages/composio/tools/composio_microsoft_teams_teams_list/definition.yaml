name: composio_microsoft_teams_teams_list
description: >-
  Retrieves microsoft teams accessible by the authenticated user, allowing filtering, property
  selection, and pagination.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the MICROSOFT_TEAMS toolkit, scoped to the calling
      tenant. The "Connect MICROSOFT_TEAMS" flow must be completed before this tool will succeed.
    required: true
  top:
    type: number
    description: >-
      Maximum number of teams to return per page (1-999). Used for pagination; see `next_link` in
      response.
    default: 100
  filter:
    type: string
    description: >-
      OData v4.0 filter string to refine results based on team properties (e.g.,
      `startsWith(displayName,'A')`). Consult OData v4.0 documentation for syntax.
    default: ''
  select:
    type: string
    description: >-
      Comma-separated team properties to retrieve (e.g., 'id,displayName,description'). If empty or
      omitted, standard properties are returned. Supported properties include `id`, `displayName`,
      `description`, `visibility`.
    default: ''
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/MICROSOFT_TEAMS_TEAMS_LIST
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_microsoft_teams_teams_list
      top: '{top}'
      filter: '{filter}'
      select: '{select}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - microsoft_teams
notes:
  env: COMPOSIO_API_KEY
  toolkit: microsoft_teams
  composio_slug: MICROSOFT_TEAMS_TEAMS_LIST
