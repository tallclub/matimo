name: composio_microsoft_teams_teams_create_chat
description: >-
  Creates a new chat; if a 'oneonone' chat with the specified members already exists, its details
  are returned, while 'group' chats are always newly created.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the MICROSOFT_TEAMS toolkit, scoped to the calling
      tenant. The "Connect MICROSOFT_TEAMS" flow must be completed before this tool will succeed.
    required: true
  topic:
    type: string
    description: Subject or title for a group chat; ignored for 'oneOnOne' chats.
    default: null
  members:
    type: array
    description: >-
      List of members. For 'oneOnOne' chats, exactly two members are expected. For 'group' chats, at
      least one member must have the 'owner' role.
    required: true
  chatType:
    type: string
    description: >-
      Type of chat. If 'oneOnOne' for members with an existing chat, that chat's details are
      returned.
    required: true
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/MICROSOFT_TEAMS_TEAMS_CREATE_CHAT
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_microsoft_teams_teams_create_chat
      topic: '{topic}'
      members: '{members}'
      chatType: '{chatType}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - microsoft_teams
notes:
  env: COMPOSIO_API_KEY
  toolkit: microsoft_teams
  composio_slug: MICROSOFT_TEAMS_TEAMS_CREATE_CHAT
