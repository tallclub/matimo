name: composio_asana_get_multiple_users
description: >-
  Returns a list of users in an asana workspace or organization, optionally filtered by workspace or
  team gid, with support for pagination and specifying optional fields.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ASANA toolkit, scoped to the calling tenant. The
      "Connect ASANA" flow must be completed before this tool will succeed.
    required: true
  team:
    type: string
    description: The GID of the Asana team. If specified, only includes users who are members of this team.
  limit:
    type: number
    description: The maximum number of user objects to return per page (1-100).
  offset:
    type: string
    description: Opaque token for pagination to retrieve the subsequent page of results.
  workspace:
    type: string
    description: >-
      The GID of the Asana workspace or organization. If specified, only includes users belonging to
      this workspace.
  opt_fields:
    type: array
    description: >-
      A list of optional field names to include in the response for each user. Available fields
      include 'email', 'name', 'photo' (and its specific sizes like 'photo.image_1024x1024'),
      'workspaces', 'uri', and 'offset'.
  opt_pretty:
    type: boolean
    description: Return the response in a human-readable JSON format.
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ASANA_GET_MULTIPLE_USERS
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_asana_get_multiple_users
      team: '{team}'
      limit: '{limit}'
      offset: '{offset}'
      workspace: '{workspace}'
      opt_fields: '{opt_fields}'
      opt_pretty: '{opt_pretty}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - asana
notes:
  env: COMPOSIO_API_KEY
  toolkit: asana
  composio_slug: ASANA_GET_MULTIPLE_USERS
