name: composio_asana_get_time_periods
description: >-
  Tool to retrieve compact or full representations of time periods. use this when you need to fetch
  information about specific time periods, such as their start and end dates, display names, and
  parent periods.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ASANA toolkit, scoped to the calling tenant. The
      "Connect ASANA" flow must be completed before this tool will succeed.
    required: true
  limit:
    type: number
    description: Results per page.
    default: null
  end_on:
    type: string
    description: The last day of the time period, YYYY-MM-DD.
    default: null
  offset:
    type: string
    description: Offset token for pagination.
    default: null
  start_on:
    type: string
    description: The first day of the time period, YYYY-MM-DD.
    default: null
  opt_fields:
    type: array
    description: A comma-separated list of fields to include in the response.
    default: null
  opt_pretty:
    type: boolean
    description: Provides the response in "pretty" output.
    default: null
  workspace_gid:
    type: string
    description: Globally unique identifier for the workspace.
    required: true
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ASANA_GET_TIME_PERIODS
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_asana_get_time_periods
      limit: '{limit}'
      end_on: '{end_on}'
      offset: '{offset}'
      start_on: '{start_on}'
      opt_fields: '{opt_fields}'
      opt_pretty: '{opt_pretty}'
      workspace_gid: '{workspace_gid}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - asana
notes:
  env: COMPOSIO_API_KEY
  toolkit: asana
  composio_slug: ASANA_GET_TIME_PERIODS
