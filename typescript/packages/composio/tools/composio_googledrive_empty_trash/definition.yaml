name: composio_googledrive_empty_trash
description: >-
  Tool to permanently delete all of the user's trashed files. use when you want to empty the trash
  in google drive.
version: 1.0.0
risk: high
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the GOOGLEDRIVE toolkit, scoped to the calling tenant.
      The "Connect GOOGLEDRIVE" flow must be completed before this tool will succeed.
    required: true
  driveId:
    type: string
    description: >-
      If set, empties the trash of the provided shared drive. This parameter is ignored if the item
      is not in a shared drive.
    default: null
  enforceSingleParent:
    type: boolean
    description: >-
      Deprecated: If an item is not in a shared drive and its last parent is deleted but the item
      itself is not, the item will be placed under its owner's root. This parameter is ignored if
      the item is not in a shared drive.
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/GOOGLEDRIVE_EMPTY_TRASH
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_googledrive_empty_trash
      driveId: '{driveId}'
      enforceSingleParent: '{enforceSingleParent}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - googledrive
notes:
  env: COMPOSIO_API_KEY
  toolkit: googledrive
  composio_slug: GOOGLEDRIVE_EMPTY_TRASH
