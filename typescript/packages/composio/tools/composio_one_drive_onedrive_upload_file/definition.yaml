name: composio_one_drive_onedrive_upload_file
description: >-
  Uploads a file to a specified onedrive folder, automatically renaming on conflict and supporting
  large files via chunking.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ONE_DRIVE toolkit, scoped to the calling tenant. The
      "Connect ONE_DRIVE" flow must be completed before this tool will succeed.
    required: true
  file:
    type: object
    description: The file to be uploaded, including its name and access to its binary content.
    required: true
  folder:
    type: string
    description: Destination folder path from root (e.g., '/Documents/Reports') or a unique folder ID.
    default: /
  user_id:
    type: string
    description: >-
      User ID (e.g., user_principal_name, unique GUID) or 'me' for the authenticated user,
      determining the target OneDrive.
    default: me
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ONE_DRIVE_ONEDRIVE_UPLOAD_FILE
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_one_drive_onedrive_upload_file
      file: '{file}'
      folder: '{folder}'
      user_id: '{user_id}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - one_drive
notes:
  env: COMPOSIO_API_KEY
  toolkit: one_drive
  composio_slug: ONE_DRIVE_ONEDRIVE_UPLOAD_FILE
