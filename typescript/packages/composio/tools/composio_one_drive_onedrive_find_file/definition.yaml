name: composio_one_drive_onedrive_find_file
description: >-
  Non-recursively finds an item (file or folder) in a specified onedrive folder; if `folder` is
  provided as a path, it must actually exist.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ONE_DRIVE toolkit, scoped to the calling tenant. The
      "Connect ONE_DRIVE" flow must be completed before this tool will succeed.
    required: true
  name:
    type: string
    description: The exact name of the file or folder to find within the specified `folder`.
    required: true
  folder:
    type: string
    description: >-
      The unique identifier (ID) or absolute path of the OneDrive folder for the search. For the
      root folder, use '/'. Paths must start with '/'.
    default: /
  user_id:
    type: string
    description: >-
      The unique identifier of the user (e.g., a GUID) or the alias 'me' to represent the currently
      authenticated user. This determines whose OneDrive will be accessed.
    default: me
  include_metadata:
    type: boolean
    description: >-
      If set to true, the response will include the complete metadata for each found item. If false
      (default), only essential properties like id, name, and webUrl are returned.
    default: false
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ONE_DRIVE_ONEDRIVE_FIND_FILE
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_one_drive_onedrive_find_file
      name: '{name}'
      folder: '{folder}'
      user_id: '{user_id}'
      include_metadata: '{include_metadata}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - one_drive
notes:
  env: COMPOSIO_API_KEY
  toolkit: one_drive
  composio_slug: ONE_DRIVE_ONEDRIVE_FIND_FILE
