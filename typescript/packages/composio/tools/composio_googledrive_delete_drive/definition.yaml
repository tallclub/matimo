name: composio_googledrive_delete_drive
description: >-
  Tool to permanently delete a shared drive. use when you need to remove a shared drive and its
  contents (if specified).
version: 1.0.0
risk: high
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the GOOGLEDRIVE toolkit, scoped to the calling tenant.
      The "Connect GOOGLEDRIVE" flow must be completed before this tool will succeed.
    required: true
  driveId:
    type: string
    description: The ID of the shared drive.
    required: true
  allowItemDeletion:
    type: boolean
    description: >-
      Whether any items inside the shared drive should also be deleted. This option is only
      supported when `useDomainAdminAccess` is also set to `true`.
    default: null
  useDomainAdminAccess:
    type: boolean
    description: >-
      Issue the request as a domain administrator; if set to true, then the requester will be
      granted access if they are an administrator of the domain to which the shared drive belongs.
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/GOOGLEDRIVE_DELETE_DRIVE
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_googledrive_delete_drive
      driveId: '{driveId}'
      allowItemDeletion: '{allowItemDeletion}'
      useDomainAdminAccess: '{useDomainAdminAccess}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - googledrive
notes:
  env: COMPOSIO_API_KEY
  toolkit: googledrive
  composio_slug: GOOGLEDRIVE_DELETE_DRIVE
