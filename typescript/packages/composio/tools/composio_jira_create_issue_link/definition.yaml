name: composio_jira_create_issue_link
description: Links two jira issues using a specified link type with optional comment.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the JIRA toolkit, scoped to the calling tenant. The
      "Connect JIRA" flow must be completed before this tool will succeed.
    required: true
  comment:
    type: string
    description: An optional textual comment to add to the created issue link, providing additional context.
    default: null
  link_type:
    type: string
    description: >-
      The specific type of relationship to establish between the issues (e.g., 'Blocks', 'Relates
      to', 'Duplicates').
    required: true
  inward_issue_key:
    type: string
    description: >-
      The key of the issue that initiates the link relationship (the 'source' issue). For example,
      if creating a 'Blocks' link from Issue A to Issue B, Issue A is the inward issue.
    required: true
  outward_issue_key:
    type: string
    description: >-
      The key of the issue that is the target of the link relationship (the 'destination' issue).
      For example, if creating a 'Blocks' link from Issue A to Issue B, Issue B is the outward
      issue.
    required: true
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/JIRA_CREATE_ISSUE_LINK
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_jira_create_issue_link
      comment: '{comment}'
      link_type: '{link_type}'
      inward_issue_key: '{inward_issue_key}'
      outward_issue_key: '{outward_issue_key}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - jira
notes:
  env: COMPOSIO_API_KEY
  toolkit: jira
  composio_slug: JIRA_CREATE_ISSUE_LINK
