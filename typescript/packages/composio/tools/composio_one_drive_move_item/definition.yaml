name: composio_one_drive_move_item
description: >-
  Tool to move a file or folder to a new parent folder in onedrive. use when you need to reorganize
  your files or folders by changing their location. you can optionally rename the item during the
  move.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ONE_DRIVE toolkit, scoped to the calling tenant. The
      "Connect ONE_DRIVE" flow must be completed before this tool will succeed.
    required: true
  name:
    type: string
    description: The new name for the DriveItem. If not provided, the item retains its original name.
    default: null
  itemId:
    type: string
    description: The unique identifier of the file or folder (DriveItem) to be moved.
    required: true
  driveId:
    type: string
    description: >-
      The unique identifier of the Drive that contains the item. If not specified, it defaults to
      the user's personal drive (`/me/drive`).
    default: null
  parentReference:
    type: object
    description: The new parent folder reference.
    required: true
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ONE_DRIVE_MOVE_ITEM
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_one_drive_move_item
      name: '{name}'
      itemId: '{itemId}'
      driveId: '{driveId}'
      parentReference: '{parentReference}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - one_drive
notes:
  env: COMPOSIO_API_KEY
  toolkit: one_drive
  composio_slug: ONE_DRIVE_MOVE_ITEM
