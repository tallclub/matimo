name: composio_jira_update_comment
description: Updates text content or visibility of an existing jira comment.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the JIRA toolkit, scoped to the calling tenant. The
      "Connect JIRA" flow must be completed before this tool will succeed.
    required: true
  comment_id:
    type: string
    description: The unique ID of the comment to be updated.
    required: true
  comment_text:
    type: string
    description: >-
      The new text content for the comment. This will replace the existing comment body. Supports
      plain text and basic formatting like *bold*, _italic_, and @mentions.
    required: true
  notify_users:
    type: boolean
    description: >-
      A boolean flag indicating whether to send notifications to users about the comment update.
      Defaults to True.
    default: true
  issue_id_or_key:
    type: string
    description: >-
      The ID or key of the Jira issue where the comment is located. This can be the numerical ID or
      the project key followed by the issue number (e.g., 'PROJ-123').
    required: true
  visibility_type:
    type: string
    description: >-
      Optional. The type of visibility restriction to apply to the comment. If provided,
      `visibility_value` must also be specified. Valid values are 'group' or 'role'.
    default: null
  visibility_value:
    type: string
    description: >-
      Optional. The name of the group or role to restrict comment visibility to. Required if
      `visibility_type` is specified. For 'group' type, provide the group name (e.g.,
      'jira-administrators'). For 'role' type, provide the project role name (e.g.,
      'Administrators').
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/JIRA_UPDATE_COMMENT
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_jira_update_comment
      comment_id: '{comment_id}'
      comment_text: '{comment_text}'
      notify_users: '{notify_users}'
      issue_id_or_key: '{issue_id_or_key}'
      visibility_type: '{visibility_type}'
      visibility_value: '{visibility_value}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - jira
notes:
  env: COMPOSIO_API_KEY
  toolkit: jira
  composio_slug: JIRA_UPDATE_COMMENT
