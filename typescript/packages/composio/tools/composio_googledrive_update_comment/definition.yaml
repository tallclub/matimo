name: composio_googledrive_update_comment
description: >-
  Tool to update an existing comment on a google drive file. use when you need to change the content
  or status (e.g., resolve) of a comment.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the GOOGLEDRIVE toolkit, scoped to the calling tenant.
      The "Connect GOOGLEDRIVE" flow must be completed before this tool will succeed.
    required: true
  fields:
    type: string
    description: >-
      Selector specifying which fields to include in a partial response. The API documentation
      states this is required. If not specified by the user, this action defaults to '*' to retrieve
      all fields, ensuring the API requirement is met. Example: 'id,content,resolved'.
    default: null
  content:
    type: string
    description: >-
      The plain text content of the comment. This field is used to update the comment's text. If not
      provided, the existing content will be retained unless 'resolved' is being updated.
    default: null
  file_id:
    type: string
    description: The ID of the file.
    required: true
  resolved:
    type: boolean
    description: >-
      Whether the comment has been resolved. This can be used to mark a comment as resolved or
      reopen it.
    default: null
  comment_id:
    type: string
    description: The ID of the comment to update.
    required: true
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/GOOGLEDRIVE_UPDATE_COMMENT
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_googledrive_update_comment
      fields: '{fields}'
      content: '{content}'
      file_id: '{file_id}'
      resolved: '{resolved}'
      comment_id: '{comment_id}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - googledrive
notes:
  env: COMPOSIO_API_KEY
  toolkit: googledrive
  composio_slug: GOOGLEDRIVE_UPDATE_COMMENT
