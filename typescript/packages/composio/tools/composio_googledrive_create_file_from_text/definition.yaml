name: composio_googledrive_create_file_from_text
description: >-
  Creates a new file in google drive from provided text content (up to 10mb), supporting various
  formats including automatic conversion to google workspace types.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the GOOGLEDRIVE toolkit, scoped to the calling tenant.
      The "Connect GOOGLEDRIVE" flow must be completed before this tool will succeed.
    required: true
  file_name:
    type: string
    description: Desired name for the new file on Google Drive.
    required: true
  mime_type:
    type: string
    description: MIME type for the new file, determining how Google Drive interprets its content.
    default: text/plain
  parent_id:
    type: string
    description: >-
      ID of the parent folder in Google Drive; if omitted, the file is created in the root of 'My
      Drive'.
    default: null
  text_content:
    type: string
    description: Plain text content to be written into the new file.
    required: true
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/GOOGLEDRIVE_CREATE_FILE_FROM_TEXT
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_googledrive_create_file_from_text
      file_name: '{file_name}'
      mime_type: '{mime_type}'
      parent_id: '{parent_id}'
      text_content: '{text_content}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - googledrive
notes:
  env: COMPOSIO_API_KEY
  toolkit: googledrive
  composio_slug: GOOGLEDRIVE_CREATE_FILE_FROM_TEXT
