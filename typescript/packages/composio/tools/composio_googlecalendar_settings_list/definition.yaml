name: composio_googlecalendar_settings_list
description: Returns all user settings for the authenticated user.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the GOOGLECALENDAR toolkit, scoped to the calling
      tenant. The "Connect GOOGLECALENDAR" flow must be completed before this tool will succeed.
    required: true
  pageToken:
    type: string
    description: Token specifying which result page to return.
    default: null
  syncToken:
    type: string
    description: >-
      Token obtained from the nextSyncToken field returned on the last page of results from the
      previous list request. It makes the result of this list request contain only entries that have
      changed since then. If the syncToken expires, the server will respond with a 410 GONE response
      code and the client should clear its storage and perform a full synchronization without any
      syncToken.
    default: null
  maxResults:
    type: number
    description: >-
      Maximum number of entries returned on one result page. By default the value is 100 entries.
      The page size can never be larger than 250 entries.
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/GOOGLECALENDAR_SETTINGS_LIST
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_googlecalendar_settings_list
      pageToken: '{pageToken}'
      syncToken: '{syncToken}'
      maxResults: '{maxResults}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - googlecalendar
notes:
  env: COMPOSIO_API_KEY
  toolkit: googlecalendar
  composio_slug: GOOGLECALENDAR_SETTINGS_LIST
