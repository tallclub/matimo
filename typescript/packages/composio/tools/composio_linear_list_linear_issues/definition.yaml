name: composio_linear_list_linear_issues
description: >-
  Lists non-archived linear issues; if project id is not specified, issues from all accessible
  projects are returned. can also filter by assignee id to get issues assigned to a specific user.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the LINEAR toolkit, scoped to the calling tenant. The
      "Connect LINEAR" flow must be completed before this tool will succeed.
    required: true
  after:
    type: string
    description: >-
      Cursor for pagination. Use the `endCursor` from the previous response's `page_info` to fetch
      the next set of issues.
    default: null
  first:
    type: number
    description: Number of issues to return.
    default: 10
  project_id:
    type: string
    description: >-
      ID of the project to filter issues by. If provided, only issues belonging to this project will
      be returned.
    default: null
  assignee_id:
    type: string
    description: >-
      ID of the user to filter issues by assignee. If provided, only issues assigned to this user
      will be returned.
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/LINEAR_LIST_LINEAR_ISSUES
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_linear_list_linear_issues
      after: '{after}'
      first: '{first}'
      project_id: '{project_id}'
      assignee_id: '{assignee_id}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - linear
notes:
  env: COMPOSIO_API_KEY
  toolkit: linear
  composio_slug: LINEAR_LIST_LINEAR_ISSUES
