name: composio_outlook_create_mail_folder
description: Tool to create a new mail folder. use when you need to organize email into a new folder.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the OUTLOOK toolkit, scoped to the calling tenant. The
      "Connect OUTLOOK" flow must be completed before this tool will succeed.
    required: true
  user_id:
    type: string
    description: >-
      Identifier for the user whose mailbox the folder will be created in. Use 'me' for the
      authenticated user or provide the user's principal name or ID.
    default: me
  isHidden:
    type: boolean
    description: >-
      Indicates whether the new folder is hidden. Default is false. Once set, this property cannot
      be updated.
    default: false
  displayName:
    type: string
    description: The display name of the new mail folder.
    required: true
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/OUTLOOK_CREATE_MAIL_FOLDER
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_outlook_create_mail_folder
      user_id: '{user_id}'
      isHidden: '{isHidden}'
      displayName: '{displayName}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - outlook
notes:
  env: COMPOSIO_API_KEY
  toolkit: outlook
  composio_slug: OUTLOOK_CREATE_MAIL_FOLDER
