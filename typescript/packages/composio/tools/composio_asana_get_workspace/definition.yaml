name: composio_asana_get_workspace
description: >-
  Tool to retrieve details of a specific workspace by its gid. use when you need to get information
  about a particular asana workspace.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ASANA toolkit, scoped to the calling tenant. The
      "Connect ASANA" flow must be completed before this tool will succeed.
    required: true
  opt_fields:
    type: array
    description: >-
      This results in a compact response, suitable for data-transfer sensitive applications. Valid
      values are: gid, name, resource_type, email_domains, is_organization.
    default: null
  opt_pretty:
    type: boolean
    description: >-
      Provides “pretty” output. Formatting dates and times as human-readable strings, numbers as
      strings, and including newlines and indentation. The default value is false.
    default: null
  workspace_gid:
    type: string
    description: The globally unique identifier of the workspace.
    required: true
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ASANA_GET_WORKSPACE
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_asana_get_workspace
      opt_fields: '{opt_fields}'
      opt_pretty: '{opt_pretty}'
      workspace_gid: '{workspace_gid}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - asana
notes:
  env: COMPOSIO_API_KEY
  toolkit: asana
  composio_slug: ASANA_GET_WORKSPACE
