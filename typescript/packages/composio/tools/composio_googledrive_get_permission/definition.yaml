name: composio_googledrive_get_permission
description: >-
  Gets a permission by id. use this tool to retrieve a specific permission for a file or shared
  drive.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the GOOGLEDRIVE toolkit, scoped to the calling tenant.
      The "Connect GOOGLEDRIVE" flow must be completed before this tool will succeed.
    required: true
  file_id:
    type: string
    description: The ID of the file.
    required: true
  permission_id:
    type: string
    description: The ID of the permission.
    required: true
  supports_all_drives:
    type: boolean
    description: Whether the requesting application supports both My Drives and shared drives.
    default: null
  use_domain_admin_access:
    type: boolean
    description: >-
      Issue the request as a domain administrator; if set to true, then the requester will be
      granted access if the file ID parameter refers to a shared drive and the requester is an
      administrator of the domain to which the shared drive belongs.
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/GOOGLEDRIVE_GET_PERMISSION
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_googledrive_get_permission
      file_id: '{file_id}'
      permission_id: '{permission_id}'
      supports_all_drives: '{supports_all_drives}'
      use_domain_admin_access: '{use_domain_admin_access}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - googledrive
notes:
  env: COMPOSIO_API_KEY
  toolkit: googledrive
  composio_slug: GOOGLEDRIVE_GET_PERMISSION
