name: composio_linear_create_linear_attachment
description: Creates a new attachment and associates it with a specific, existing linear issue.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the LINEAR toolkit, scoped to the calling tenant. The
      "Connect LINEAR" flow must be completed before this tool will succeed.
    required: true
  url:
    type: string
    description: URL of the attachment's content (e.g., file, webpage, online resource).
    required: true
  title:
    type: string
    description: Title for the attachment.
    required: true
  issue_id:
    type: string
    description: Identifier of the existing Linear issue to which the attachment will be added.
    required: true
  subtitle:
    type: string
    description: Optional subtitle or short description for the attachment.
    required: true
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/LINEAR_CREATE_LINEAR_ATTACHMENT
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_linear_create_linear_attachment
      url: '{url}'
      title: '{title}'
      issue_id: '{issue_id}'
      subtitle: '{subtitle}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - linear
notes:
  env: COMPOSIO_API_KEY
  toolkit: linear
  composio_slug: LINEAR_CREATE_LINEAR_ATTACHMENT
