name: composio_googlecalendar_list_acl_rules
description: >-
  Retrieves the list of access control rules (acls) for a specified calendar, providing the
  necessary 'rule id' values required for updating specific acl rules.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the GOOGLECALENDAR toolkit, scoped to the calling
      tenant. The "Connect GOOGLECALENDAR" flow must be completed before this tool will succeed.
    required: true
  page_token:
    type: string
    description: Token specifying which result page to return. Optional.
    default: null
  sync_token:
    type: string
    description: >-
      Token obtained from the nextSyncToken field returned on the last page of a previous list
      operation. It makes the result of this list operation contain only entries that have changed
      since then. Optional. The default is to retrieve all entries.
    default: null
  calendar_id:
    type: string
    description: >-
      Calendar identifier. To retrieve calendar IDs call the calendarList.list method. If you want
      to access the primary calendar of the currently logged in user, use the "primary" keyword.
    required: true
  max_results:
    type: number
    description: Maximum number of entries returned on one result page. Optional. The default is 100.
    default: null
  show_deleted:
    type: boolean
    description: Whether to include deleted ACLs in the result. Optional. The default is False.
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/GOOGLECALENDAR_LIST_ACL_RULES
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_googlecalendar_list_acl_rules
      page_token: '{page_token}'
      sync_token: '{sync_token}'
      calendar_id: '{calendar_id}'
      max_results: '{max_results}'
      show_deleted: '{show_deleted}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - googlecalendar
notes:
  env: COMPOSIO_API_KEY
  toolkit: googlecalendar
  composio_slug: GOOGLECALENDAR_LIST_ACL_RULES
