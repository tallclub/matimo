name: composio_googledrive_update_permission
description: >-
  Tool to update a permission with patch semantics. use when you need to modify an existing
  permission for a file or shared drive.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the GOOGLEDRIVE toolkit, scoped to the calling tenant.
      The "Connect GOOGLEDRIVE" flow must be completed before this tool will succeed.
    required: true
  fileId:
    type: string
    description: The ID of the file or shared drive.
    required: true
  permission:
    type: object
    description: The permission resource to update. Only 'role' and 'expirationTime' can be updated.
    required: true
  permissionId:
    type: string
    description: The ID of the permission.
    required: true
  removeExpiration:
    type: boolean
    description: Whether to remove the expiration date.
    default: false
  supportsAllDrives:
    type: boolean
    description: Whether the requesting application supports both My Drives and shared drives.
    default: false
  transferOwnership:
    type: boolean
    description: >-
      Whether to transfer ownership to the specified user and downgrade the current owner to a
      writer. This parameter is required as an acknowledgement of the side effect when set to true.
    default: false
  useDomainAdminAccess:
    type: boolean
    description: >-
      Issue the request as a domain administrator; if set to true, then the requester will be
      granted access if the file ID parameter refers to a shared drive and the requester is an
      administrator of the domain to which the shared drive belongs.
    default: false
  enforceExpansiveAccess:
    type: boolean
    description: >-
      Whether the request should enforce expansive access rules. This field is deprecated, it is
      recommended to use `permissionDetails` instead.
    default: false
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/GOOGLEDRIVE_UPDATE_PERMISSION
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_googledrive_update_permission
      fileId: '{fileId}'
      permission: '{permission}'
      permissionId: '{permissionId}'
      removeExpiration: '{removeExpiration}'
      supportsAllDrives: '{supportsAllDrives}'
      transferOwnership: '{transferOwnership}'
      useDomainAdminAccess: '{useDomainAdminAccess}'
      enforceExpansiveAccess: '{enforceExpansiveAccess}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - googledrive
notes:
  env: COMPOSIO_API_KEY
  toolkit: googledrive
  composio_slug: GOOGLEDRIVE_UPDATE_PERMISSION
