name: composio_jira_delete_version
description: Deletes a jira version and optionally reassigns its issues.
version: 1.0.0
risk: high
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the JIRA toolkit, scoped to the calling tenant. The
      "Connect JIRA" flow must be completed before this tool will succeed.
    required: true
  version_id:
    type: string
    description: The unique identifier of the version to be deleted.
    required: true
  move_fix_issues_to:
    type: string
    description: >-
      The ID of an alternative version to which issues with the deleted version as their fix version
      will be moved. If unspecified or null, these issues will remain unassigned from a fix version.
    default: null
  move_affected_issues_to:
    type: string
    description: >-
      The ID of an alternative version to which issues with the deleted version as their affected
      version will be moved. If unspecified or null, these issues will remain unassigned from an
      affected version.
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/JIRA_DELETE_VERSION
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_jira_delete_version
      version_id: '{version_id}'
      move_fix_issues_to: '{move_fix_issues_to}'
      move_affected_issues_to: '{move_affected_issues_to}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - jira
notes:
  env: COMPOSIO_API_KEY
  toolkit: jira
  composio_slug: JIRA_DELETE_VERSION
