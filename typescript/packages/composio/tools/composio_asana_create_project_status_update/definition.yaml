name: composio_asana_create_project_status_update
description: >-
  Tool to create a new status update on a project. use when you need to communicate the current
  status, progress, or any blockers related to a specific project.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ASANA toolkit, scoped to the calling tenant. The
      "Connect ASANA" flow must be completed before this tool will succeed.
    required: true
  text:
    type: string
    description: The HTML content of the status update.
    required: true
  color:
    type: string
    description: 'Color of the status update. Supported values: GREEN, YELLOW, RED, BLUE, COMPLETE.'
    required: true
    enum:
      - GREEN
      - YELLOW
      - RED
      - BLUE
      - COMPLETE
  title:
    type: string
    description: The title of the project status update.
    required: true
  project_gid:
    type: string
    description: Globally unique identifier for the project.
    required: true
  status_type:
    type: string
    description: 'The type of status. Must be one of: on_track, at_risk, off_track, on_hold, complete.'
    required: true
    enum:
      - on_track
      - at_risk
      - off_track
      - on_hold
      - complete
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ASANA_CREATE_PROJECT_STATUS_UPDATE
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_asana_create_project_status_update
      text: '{text}'
      color: '{color}'
      title: '{title}'
      project_gid: '{project_gid}'
      status_type: '{status_type}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - asana
notes:
  env: COMPOSIO_API_KEY
  toolkit: asana
  composio_slug: ASANA_CREATE_PROJECT_STATUS_UPDATE
