name: composio_one_drive_list_root_drive_changes
description: >-
  Tool to list changes in the root of the user's primary drive using a delta token. use when you
  need to track file and folder modifications, additions, or deletions in the main onedrive
  directory.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ONE_DRIVE toolkit, scoped to the calling tenant. The
      "Connect ONE_DRIVE" flow must be completed before this tool will succeed.
    required: true
  token:
    type: string
    description: >-
      A string token that represents the state of the drive from a previous call. It can be a
      deltaLink from a previous response, the literal string 'latest' to get a token for future
      calls without enumerating current items, or omitted to get all current items and a nextLink or
      deltaLink.
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ONE_DRIVE_LIST_ROOT_DRIVE_CHANGES
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_one_drive_list_root_drive_changes
      token: '{token}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - one_drive
notes:
  env: COMPOSIO_API_KEY
  toolkit: one_drive
  composio_slug: ONE_DRIVE_LIST_ROOT_DRIVE_CHANGES
