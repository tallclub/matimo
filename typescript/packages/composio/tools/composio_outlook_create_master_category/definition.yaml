name: composio_outlook_create_master_category
description: >-
  Tool to create a new category in the user's master category list. use after selecting a unique
  display name.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the OUTLOOK toolkit, scoped to the calling tenant. The
      "Connect OUTLOOK" flow must be completed before this tool will succeed.
    required: true
  color:
    type: string
    description: 'A pre-set color constant for the category. Allowed values: preset0 through preset24.'
    enum:
      - preset0
      - preset1
      - preset2
      - preset3
      - preset4
      - preset5
      - preset6
      - preset7
      - preset8
      - preset9
      - preset10
      - preset11
      - preset12
      - preset13
      - preset14
      - preset15
      - preset16
      - preset17
      - preset18
      - preset19
      - preset20
      - preset21
      - preset22
      - preset23
      - preset24
    default: null
  displayName:
    type: string
    description: Unique name that identifies the category in the user's mailbox.
    required: true
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/OUTLOOK_CREATE_MASTER_CATEGORY
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_outlook_create_master_category
      color: '{color}'
      displayName: '{displayName}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - outlook
notes:
  env: COMPOSIO_API_KEY
  toolkit: outlook
  composio_slug: OUTLOOK_CREATE_MASTER_CATEGORY
