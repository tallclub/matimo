name: composio_asana_add_supporting_relationship
description: >-
  Tool to add a supporting goal relationship to a goal. use when you want to link a project, task,
  portfolio, or another goal as a supporting resource to a specific goal in asana.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ASANA toolkit, scoped to the calling tenant. The
      "Connect ASANA" flow must be completed before this tool will succeed.
    required: true
  data:
    type: object
    description: The data parameter.
    required: true
  goal_gid:
    type: string
    description: Globally unique identifier for the goal.
    required: true
  opt_fields:
    type: array
    description: >-
      This endpoint returns a compact resource, which excludes some properties by default. To
      include those optional properties, set this query parameter to a comma-separated list of the
      properties you wish to include.
    default: null
  opt_pretty:
    type: boolean
    description: >-
      Provides “pretty” output. In the case of JSON this means doing proper line breaking and
      indentation to make it readable. This will take extra time and increase the response size so
      it is advisable only to use this during debugging.
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ASANA_ADD_SUPPORTING_RELATIONSHIP
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_asana_add_supporting_relationship
      data: '{data}'
      goal_gid: '{goal_gid}'
      opt_fields: '{opt_fields}'
      opt_pretty: '{opt_pretty}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - asana
notes:
  env: COMPOSIO_API_KEY
  toolkit: asana
  composio_slug: ASANA_ADD_SUPPORTING_RELATIONSHIP
