name: composio_asana_get_multiple_tasks
description: >-
  Retrieves a list of tasks, allowing filtering by assignee (requires `workspace`), project,
  section, `completed since`, and `modified since`; `workspace` also requires `assignee`.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ASANA toolkit, scoped to the calling tenant. The
      "Connect ASANA" flow must be completed before this tool will succeed.
    required: true
  limit:
    type: number
    description: Number of task objects to return per page (must be between 1 and 100).
  offset:
    type: string
    description: >-
      Offset token for pagination, from a previous paginated request. If omitted, returns the first
      page.
  project:
    type: string
    description: Project GID to filter tasks on.
  section:
    type: string
    description: Section GID to filter tasks on. Tasks must be in a project that contains sections.
  assignee:
    type: string
    description: >-
      Filter tasks by assignee's GID (user GID, 'me', or 'assignee.any=null' for unassigned). Note:
      If `assignee` is specified, `workspace` must also be provided.
  workspace:
    type: string
    description: >-
      Workspace GID to filter tasks on. Note: If `workspace` is specified, `assignee` must also be
      provided.
  opt_fields:
    type: array
    description: >-
      Optional fields to include for more detailed task information; see `OptFieldsEnm0` for
      available keys.
  opt_pretty:
    type: boolean
    description: >-
      Format JSON output with line breaking and indentation for readability (for debugging; may
      increase response time/size).
  modified_since:
    type: string
    description: >-
      Return tasks modified since the given ISO 8601 date-time. 'Modified' includes property
      changes, association changes (e.g., task added to project), assigning, renaming, completing,
      or adding stories.
  completed_since:
    type: string
    description: Filter for tasks incomplete or completed since this ISO 8601 date-time.
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ASANA_GET_MULTIPLE_TASKS
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_asana_get_multiple_tasks
      limit: '{limit}'
      offset: '{offset}'
      project: '{project}'
      section: '{section}'
      assignee: '{assignee}'
      workspace: '{workspace}'
      opt_fields: '{opt_fields}'
      opt_pretty: '{opt_pretty}'
      modified_since: '{modified_since}'
      completed_since: '{completed_since}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - asana
notes:
  env: COMPOSIO_API_KEY
  toolkit: asana
  composio_slug: ASANA_GET_MULTIPLE_TASKS
