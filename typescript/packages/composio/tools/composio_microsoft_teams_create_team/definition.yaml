name: composio_microsoft_teams_create_team
description: >-
  Tool to create a new microsoft teams team. use when you need to provision a team with optional
  template, channels, and members.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the MICROSOFT_TEAMS toolkit, scoped to the calling
      tenant. The "Connect MICROSOFT_TEAMS" flow must be completed before this tool will succeed.
    required: true
  members:
    type: array
    description: >-
      List of initial members to add to the team. Each must include '@odata.type', roles, and
      'user@odata.bind'.
    default: null
  visibility:
    type: string
    description: The visibility parameter.
    required: true
    enum:
      - private
      - public
  description:
    type: string
    description: Description for the new team.
    default: null
  displayName:
    type: string
    description: Name of the new team.
    required: true
  firstChannelName:
    type: string
    description: Name of the first channel created; defaults to 'General' if omitted.
    default: null
  template_odata_bind:
    type: string
    description: URL of the Teams template to apply.
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/MICROSOFT_TEAMS_CREATE_TEAM
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_microsoft_teams_create_team
      members: '{members}'
      visibility: '{visibility}'
      description: '{description}'
      displayName: '{displayName}'
      firstChannelName: '{firstChannelName}'
      template_odata_bind: '{template_odata_bind}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - microsoft_teams
notes:
  env: COMPOSIO_API_KEY
  toolkit: microsoft_teams
  composio_slug: MICROSOFT_TEAMS_CREATE_TEAM
