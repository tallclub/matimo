name: composio_one_drive_get_item
description: >-
  Retrieves the metadata of a driveitem by its unique id. use this tool to get information about a
  specific file or folder in onedrive when you have its id. if a `drive id` is not provided, it
  defaults to the user's main drive.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ONE_DRIVE toolkit, scoped to the calling tenant. The
      "Connect ONE_DRIVE" flow must be completed before this tool will succeed.
    required: true
  item_id:
    type: string
    description: The unique identifier of the DriveItem (file or folder).
    required: true
  drive_id:
    type: string
    description: >-
      The unique identifier of the Drive where the item is located. If not provided, the action will
      target the user's personal OneDrive (me/drive).
    default: null
  select_fields:
    type: array
    description: >-
      A list of DriveItem properties to return. If not specified, a default set of properties is
      returned. Refer to the DriveItem resource documentation for available fields.
    default: null
  expand_relations:
    type: array
    description: A list of relationships to expand in the response, such as 'children'.
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ONE_DRIVE_GET_ITEM
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_one_drive_get_item
      item_id: '{item_id}'
      drive_id: '{drive_id}'
      select_fields: '{select_fields}'
      expand_relations: '{expand_relations}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - one_drive
notes:
  env: COMPOSIO_API_KEY
  toolkit: one_drive
  composio_slug: ONE_DRIVE_GET_ITEM
