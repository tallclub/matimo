name: composio_asana_get_status_updates
description: >-
  Retrieve status updates from an object. use when you need to get the latest or historical status
  updates for a specific project, portfolio, or goal.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ASANA toolkit, scoped to the calling tenant. The
      "Connect ASANA" flow must be completed before this tool will succeed.
    required: true
  limit:
    type: number
    description: The maximum number of items to return per page. The value must be between 1 and 100.
    default: null
  offset:
    type: string
    description: >-
      An offset token returned from a previous query that had a `next_page` property. This is used
      for pagination.
    default: null
  parent:
    type: string
    description: >-
      Globally unique identifier (GID) of the object (project, portfolio, or goal) from which to
      fetch status updates.
    required: true
  opt_fields:
    type: array
    description: >-
      A comma-separated list of fields to include in the response. This allows customization of the
      returned data.
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ASANA_GET_STATUS_UPDATES
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_asana_get_status_updates
      limit: '{limit}'
      offset: '{offset}'
      parent: '{parent}'
      opt_fields: '{opt_fields}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - asana
notes:
  env: COMPOSIO_API_KEY
  toolkit: asana
  composio_slug: ASANA_GET_STATUS_UPDATES
