name: composio_outlook_list_calendars
description: >-
  Tool to list calendars in the signed-in user's mailbox. use when you need to retrieve calendars
  with optional odata queries.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the OUTLOOK toolkit, scoped to the calling tenant. The
      "Connect OUTLOOK" flow must be completed before this tool will succeed.
    required: true
  top:
    type: number
    description: Maximum number of calendars to return (OData $top).
    default: null
  skip:
    type: number
    description: Number of calendars to skip (OData $skip).
    default: null
  filter:
    type: string
    description: OData filter expression (OData $filter).
    default: null
  select:
    type: array
    description: Properties to include (OData $select).
    default: null
  orderby:
    type: array
    description: Order by expressions (OData $orderby).
    default: null
  user_id:
    type: string
    description: User ID or userPrincipalName. Use 'me' for the signed-in user.
    default: me
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/OUTLOOK_LIST_CALENDARS
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_outlook_list_calendars
      top: '{top}'
      skip: '{skip}'
      filter: '{filter}'
      select: '{select}'
      orderby: '{orderby}'
      user_id: '{user_id}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - outlook
notes:
  env: COMPOSIO_API_KEY
  toolkit: outlook
  composio_slug: OUTLOOK_LIST_CALENDARS
