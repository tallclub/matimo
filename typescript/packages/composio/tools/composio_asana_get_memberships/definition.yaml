name: composio_asana_get_memberships
description: >-
  Tool to retrieve memberships for goals, projects, portfolios, or custom fields. use this to find
  out who has access to a specific asana resource or what resources a specific user/team has access
  to.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ASANA toolkit, scoped to the calling tenant. The
      "Connect ASANA" flow must be completed before this tool will succeed.
    required: true
  limit:
    type: number
    description: The number of results to return per page.
    default: null
  member:
    type: string
    description: GID of the member (user or team) to filter memberships.
    default: null
  offset:
    type: string
    description: Offset token for pagination.
    default: null
  parent:
    type: string
    description: >-
      GID of the parent resource (e.g., project_gid, goal_gid, portfolio_gid, or custom_field_gid)
      to filter memberships.
    default: null
  opt_fields:
    type: string
    description: >-
      Comma-separated list of fields to include in the response (e.g.,
      "parent,member,access_level,parent.name,member.name").
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ASANA_GET_MEMBERSHIPS
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_asana_get_memberships
      limit: '{limit}'
      member: '{member}'
      offset: '{offset}'
      parent: '{parent}'
      opt_fields: '{opt_fields}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - asana
notes:
  env: COMPOSIO_API_KEY
  toolkit: asana
  composio_slug: ASANA_GET_MEMBERSHIPS
