name: composio_jira_add_comment
description: Adds a comment using atlassian document format (adf) for rich text to an existing jira issue.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the JIRA toolkit, scoped to the calling tenant. The
      "Connect JIRA" flow must be completed before this tool will succeed.
    required: true
  comment:
    type: string
    description: >-
      The comment text. Supports Markdown formatting including **bold**, *italic*, `code`, links
      [text](url), lists, and @mentions.
    required: true
  issue_id_or_key:
    type: string
    description: The ID or key of the issue to add the comment to.
    required: true
  visibility_type:
    type: string
    description: >-
      Specifies the type of visibility restriction for the comment. Valid values are 'group' or
      'role'. If this field is used, `visibility_value` must also be provided.
    default: null
  visibility_value:
    type: string
    description: Name of the group or role that can view the comment (required if visibility_type is set).
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/JIRA_ADD_COMMENT
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_jira_add_comment
      comment: '{comment}'
      issue_id_or_key: '{issue_id_or_key}'
      visibility_type: '{visibility_type}'
      visibility_value: '{visibility_value}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - jira
notes:
  env: COMPOSIO_API_KEY
  toolkit: jira
  composio_slug: JIRA_ADD_COMMENT
