name: composio_linear_run_query_or_mutation
description: >-
  Wildcard action that executes any graphql query or mutation against the linear api. use this as a
  fallback when no specific action exists for your use case, or when you need to perform complex
  operations not covered by other linear actions. supports full graphql capabilities including
  custom queries, mutations, and advanced filtering.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the LINEAR toolkit, scoped to the calling tenant. The
      "Connect LINEAR" flow must be completed before this tool will succeed.
    required: true
  variables:
    type: object
    description: >-
      Variables for the GraphQL operation. Keys must match variable names defined in the
      query/mutation (without the '$' prefix). Use empty dict {} if no variables are needed. All
      variables must have values matching the expected GraphQL types (String, Int, Boolean, etc.).
    required: true
  query_or_mutation:
    type: string
    description: >-
      A valid GraphQL query or mutation string. Use this for any Linear operation not covered by
      specific actions. Common use cases: get current user info, complex filtering, custom data
      retrieval, advanced mutations.
    required: true
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/LINEAR_RUN_QUERY_OR_MUTATION
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_linear_run_query_or_mutation
      variables: '{variables}'
      query_or_mutation: '{query_or_mutation}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - linear
notes:
  env: COMPOSIO_API_KEY
  toolkit: linear
  composio_slug: LINEAR_RUN_QUERY_OR_MUTATION
