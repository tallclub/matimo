name: composio_jira_find_users
description: >-
  Searches for jira users by email, display name, or username to find account ids; essential for
  assigning issues, adding watchers, and other user-related operations.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the JIRA toolkit, scoped to the calling tenant. The
      "Connect JIRA" flow must be completed before this tool will succeed.
    required: true
  query:
    type: string
    description: >-
      A query string that is matched against user attributes. This can be used to search by display
      name, email address, or username. For example, 'john@company.com' to find a user by email.
    default: null
  start_at:
    type: number
    description: The 0-based index of the first item to return in the page of results. Used for pagination.
    default: null
  username:
    type: string
    description: >-
      The username to search for. This parameter is deprecated in newer Jira versions but may still
      work in some instances.
    default: null
  account_id:
    type: string
    description: >-
      The account ID to search for. Use this to get user details when you already have the account
      ID.
    default: null
  max_results:
    type: number
    description: >-
      The maximum number of items to return per page. Defaults to 50. Maximum allowed is typically
      1000.
    default: null
  include_active:
    type: boolean
    description: Whether to include active users in the search results. Defaults to true.
    default: true
  include_inactive:
    type: boolean
    description: Whether to include inactive users in the search results. Defaults to false.
    default: false
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/JIRA_FIND_USERS
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_jira_find_users
      query: '{query}'
      start_at: '{start_at}'
      username: '{username}'
      account_id: '{account_id}'
      max_results: '{max_results}'
      include_active: '{include_active}'
      include_inactive: '{include_inactive}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - jira
notes:
  env: COMPOSIO_API_KEY
  toolkit: jira
  composio_slug: JIRA_FIND_USERS
