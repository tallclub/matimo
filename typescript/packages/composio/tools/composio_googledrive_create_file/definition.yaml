name: composio_googledrive_create_file
description: >-
  Creates a new file or folder with metadata. use to create empty files or folders, or files with
  content by providing it in the request body (though this action primarily focuses on metadata
  creation).
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the GOOGLEDRIVE toolkit, scoped to the calling tenant.
      The "Connect GOOGLEDRIVE" flow must be completed before this tool will succeed.
    required: true
  name:
    type: string
    description: The name of the file.
    default: null
  fields:
    type: string
    description: A comma-separated list of fields to include in the response.
    default: null
  parents:
    type: array
    description: The IDs of parent folders.
    default: null
  starred:
    type: boolean
    description: Whether the user has starred the file.
    default: null
  mimeType:
    type: string
    description: The MIME type of the file.
    default: null
  description:
    type: string
    description: A short description of the file.
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/GOOGLEDRIVE_CREATE_FILE
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_googledrive_create_file
      name: '{name}'
      fields: '{fields}'
      parents: '{parents}'
      starred: '{starred}'
      mimeType: '{mimeType}'
      description: '{description}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - googledrive
notes:
  env: COMPOSIO_API_KEY
  toolkit: googledrive
  composio_slug: GOOGLEDRIVE_CREATE_FILE
