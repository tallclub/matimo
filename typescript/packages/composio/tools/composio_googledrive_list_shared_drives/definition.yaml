name: composio_googledrive_list_shared_drives
description: >-
  Tool to list the user's shared drives. use when you need to get a list of all shared drives
  accessible to the authenticated user.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the GOOGLEDRIVE toolkit, scoped to the calling tenant.
      The "Connect GOOGLEDRIVE" flow must be completed before this tool will succeed.
    required: true
  q:
    type: string
    description: Query string for searching shared drives.
    default: null
  pageSize:
    type: number
    description: Maximum number of shared drives to return per page.
    default: null
  pageToken:
    type: string
    description: Page token for shared drives.
    default: null
  useDomainAdminAccess:
    type: boolean
    description: >-
      Issue the request as a domain administrator. If set to true, then all shared drives of the
      domain in which the requester is an administrator are returned.
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/GOOGLEDRIVE_LIST_SHARED_DRIVES
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_googledrive_list_shared_drives
      q: '{q}'
      pageSize: '{pageSize}'
      pageToken: '{pageToken}'
      useDomainAdminAccess: '{useDomainAdminAccess}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - googledrive
notes:
  env: COMPOSIO_API_KEY
  toolkit: googledrive
  composio_slug: GOOGLEDRIVE_LIST_SHARED_DRIVES
