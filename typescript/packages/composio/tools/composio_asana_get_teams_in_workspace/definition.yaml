name: composio_asana_get_teams_in_workspace
description: Returns the compact records for all teams in the workspace visible to the authorized user.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ASANA toolkit, scoped to the calling tenant. The
      "Connect ASANA" flow must be completed before this tool will succeed.
    required: true
  limit:
    type: number
    description: Results per page. The value must be between 1 and 100.
    default: null
  offset:
    type: string
    description: >-
      Offset token from a previous API response for pagination to retrieve the next page of results.
      If an offset is not passed in, the API will return the first page of results.
    default: null
  workspace_gid:
    type: string
    description: The Global ID (GID) of the workspace to get teams from.
    required: true
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ASANA_GET_TEAMS_IN_WORKSPACE
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_asana_get_teams_in_workspace
      limit: '{limit}'
      offset: '{offset}'
      workspace_gid: '{workspace_gid}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - asana
notes:
  env: COMPOSIO_API_KEY
  toolkit: asana
  composio_slug: ASANA_GET_TEAMS_IN_WORKSPACE
