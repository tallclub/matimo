name: composio_googlecalendar_patch_calendar
description: >-
  Partially updates (patches) an existing google calendar, modifying only the fields provided;
  `summary` is mandatory and cannot be an empty string, and an empty string for `description` or
  `location` clears them.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the GOOGLECALENDAR toolkit, scoped to the calling
      tenant. The "Connect GOOGLECALENDAR" flow must be completed before this tool will succeed.
    required: true
  summary:
    type: string
    description: New title for the calendar; cannot be an empty string.
    required: true
  location:
    type: string
    description: New geographic location of the calendar (e.g., 'Paris, France').
    default: null
  timezone:
    type: string
    description: New IANA Time Zone Database name for the calendar (e.g., 'Europe/Zurich', 'America/New_York').
    default: null
  calendar_id:
    type: string
    description: >-
      Identifier of the Google Calendar to update; use 'primary' for the main calendar or a specific
      ID.
    required: true
  description:
    type: string
    description: New description for the calendar.
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/GOOGLECALENDAR_PATCH_CALENDAR
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_googlecalendar_patch_calendar
      summary: '{summary}'
      location: '{location}'
      timezone: '{timezone}'
      calendar_id: '{calendar_id}'
      description: '{description}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - googlecalendar
notes:
  env: COMPOSIO_API_KEY
  toolkit: googlecalendar
  composio_slug: GOOGLECALENDAR_PATCH_CALENDAR
