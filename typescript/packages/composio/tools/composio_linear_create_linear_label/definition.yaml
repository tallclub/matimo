name: composio_linear_create_linear_label
description: Creates a new label in linear for a specified team, used to categorize and organize issues.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the LINEAR toolkit, scoped to the calling tenant. The
      "Connect LINEAR" flow must be completed before this tool will succeed.
    required: true
  name:
    type: string
    description: Name of the new label, displayed in the Linear UI.
    required: true
  color:
    type: string
    description: Hexadecimal color code (e.g., '#FF0000') for the label's appearance in the UI.
    required: true
  team_id:
    type: string
    description: Identifier of the team for which this label will be created.
    required: true
  description:
    type: string
    description: Optional detailed description for the label, providing context on its use.
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/LINEAR_CREATE_LINEAR_LABEL
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_linear_create_linear_label
      name: '{name}'
      color: '{color}'
      team_id: '{team_id}'
      description: '{description}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - linear
notes:
  env: COMPOSIO_API_KEY
  toolkit: linear
  composio_slug: LINEAR_CREATE_LINEAR_LABEL
