name: composio_jira_create_sprint
description: Creates a new sprint on a jira board with optional start/end dates and goal.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the JIRA toolkit, scoped to the calling tenant. The
      "Connect JIRA" flow must be completed before this tool will succeed.
    required: true
  goal:
    type: string
    description: Primary objective or goal for the sprint.
    default: null
  name:
    type: string
    description: Name for the new sprint.
    required: true
  end_date:
    type: string
    description: Intended end date and time for the sprint (ISO 8601 format).
    default: null
  start_date:
    type: string
    description: Intended start date and time for the sprint (ISO 8601 format).
    default: null
  origin_board_id:
    type: number
    description: Identifier of the Jira board for the new sprint.
    required: true
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/JIRA_CREATE_SPRINT
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_jira_create_sprint
      goal: '{goal}'
      name: '{name}'
      end_date: '{end_date}'
      start_date: '{start_date}'
      origin_board_id: '{origin_board_id}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - jira
notes:
  env: COMPOSIO_API_KEY
  toolkit: jira
  composio_slug: JIRA_CREATE_SPRINT
