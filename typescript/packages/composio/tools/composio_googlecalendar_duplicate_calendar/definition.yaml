name: composio_googlecalendar_duplicate_calendar
description: Creates a new, empty google calendar with the specified title (summary).
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the GOOGLECALENDAR toolkit, scoped to the calling
      tenant. The "Connect GOOGLECALENDAR" flow must be completed before this tool will succeed.
    required: true
  summary:
    type: string
    description: >-
      Title for the new Google Calendar to be created. If an empty string is provided, the calendar
      will be created without a title.
    default: ''
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/GOOGLECALENDAR_DUPLICATE_CALENDAR
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_googlecalendar_duplicate_calendar
      summary: '{summary}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - googlecalendar
notes:
  env: COMPOSIO_API_KEY
  toolkit: googlecalendar
  composio_slug: GOOGLECALENDAR_DUPLICATE_CALENDAR
