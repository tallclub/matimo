name: composio_one_drive_onedrive_find_folder
description: >-
  Finds folders by name within an accessible parent folder in onedrive, or lists all its direct
  child folders if no name is specified.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ONE_DRIVE toolkit, scoped to the calling tenant. The
      "Connect ONE_DRIVE" flow must be completed before this tool will succeed.
    required: true
  name:
    type: string
    description: >-
      Exact name of the folder to find. If omitted, all direct child folders of the parent `folder`
      are returned.
    default: null
  folder:
    type: string
    description: >-
      Path (e.g., '/My Files/Work', '/' for root) or unique ID of the parent folder where child
      folders are searched.
    default: /
  user_id:
    type: string
    description: >-
      User's unique identifier (e.g., email, UPN) or 'me' for the authenticated user, specifying the
      OneDrive account.
    default: me
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ONE_DRIVE_ONEDRIVE_FIND_FOLDER
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_one_drive_onedrive_find_folder
      name: '{name}'
      folder: '{folder}'
      user_id: '{user_id}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - one_drive
notes:
  env: COMPOSIO_API_KEY
  toolkit: one_drive
  composio_slug: ONE_DRIVE_ONEDRIVE_FIND_FOLDER
