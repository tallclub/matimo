name: composio_googlecalendar_remove_attendee
description: >-
  Removes an attendee from a specified event in a google calendar; the calendar and event must
  exist.
version: 1.0.0
risk: high
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the GOOGLECALENDAR toolkit, scoped to the calling
      tenant. The "Connect GOOGLECALENDAR" flow must be completed before this tool will succeed.
    required: true
  event_id:
    type: string
    description: Unique identifier of the event.
    required: true
  calendar_id:
    type: string
    description: >-
      Identifier of the Google Calendar to which the event belongs; 'primary' signifies the user's
      main calendar.
    default: primary
  attendee_email:
    type: string
    description: >-
      Email address of the attendee to remove; if the email does not match an existing attendee, the
      event remains unchanged.
    required: true
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/GOOGLECALENDAR_REMOVE_ATTENDEE
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_googlecalendar_remove_attendee
      event_id: '{event_id}'
      calendar_id: '{calendar_id}'
      attendee_email: '{attendee_email}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - googlecalendar
notes:
  env: COMPOSIO_API_KEY
  toolkit: googlecalendar
  composio_slug: GOOGLECALENDAR_REMOVE_ATTENDEE
