name: composio_one_drive_search_items
description: >-
  Searches for driveitems in onedrive that match the specified query. use this to find files or
  folders based on keywords.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ONE_DRIVE toolkit, scoped to the calling tenant. The
      "Connect ONE_DRIVE" flow must be completed before this tool will succeed.
    required: true
  q:
    type: string
    description: >-
      The query text used to search for items. Values may be matched across several fields including
      filename, metadata, and file content.
    required: true
  top:
    type: number
    description: The maximum number of items to return in a single page. Default is 200.
    default: null
  select:
    type: string
    description: Comma-separated list of properties to include in the response.
    default: null
  orderby:
    type: string
    description: >-
      A comma-separated list of properties used to sort the order of the items in the response. Use
      'asc' or 'desc' for ascending or descending order, e.g., 'name asc'.
    default: null
  drive_id:
    type: string
    description: >-
      The ID of the drive to search within. If not provided, the user's personal drive (me/drive)
      will be searched. Can also be a group ID, site ID, or user ID.
    default: null
  skip_token:
    type: string
    description: >-
      A token to retrieve the next page of results, obtained from the @odata.nextLink in a previous
      response.
    default: null
  search_scope:
    type: string
    description: >-
      Specifies the scope of the search. 'root' searches within a specific folder hierarchy (default
      if drive_id is specified for a drive item, or /me/drive/root). 'drive' broadens the search to
      include items shared with the current user (used with /me/drive/search).
    enum:
      - drive
      - root
    default: root
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ONE_DRIVE_SEARCH_ITEMS
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_one_drive_search_items
      q: '{q}'
      top: '{top}'
      select: '{select}'
      orderby: '{orderby}'
      drive_id: '{drive_id}'
      skip_token: '{skip_token}'
      search_scope: '{search_scope}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - one_drive
notes:
  env: COMPOSIO_API_KEY
  toolkit: one_drive
  composio_slug: ONE_DRIVE_SEARCH_ITEMS
