name: composio_googledrive_get_revision
description: >-
  Tool to get a specific revision's metadata by revision id. use when you need to retrieve
  information about a particular version of a file.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the GOOGLEDRIVE toolkit, scoped to the calling tenant.
      The "Connect GOOGLEDRIVE" flow must be completed before this tool will succeed.
    required: true
  file_id:
    type: string
    description: The ID of the file.
    required: true
  revision_id:
    type: string
    description: The ID of the revision.
    required: true
  acknowledge_abuse:
    type: boolean
    description: >-
      Whether the user is acknowledging the risk of downloading known malware or other abusive
      files. This is only applicable when the alt parameter is set to media and the user is the
      owner of the file or an organizer of the shared drive in which the file resides.
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/GOOGLEDRIVE_GET_REVISION
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_googledrive_get_revision
      file_id: '{file_id}'
      revision_id: '{revision_id}'
      acknowledge_abuse: '{acknowledge_abuse}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - googledrive
notes:
  env: COMPOSIO_API_KEY
  toolkit: googledrive
  composio_slug: GOOGLEDRIVE_GET_REVISION
