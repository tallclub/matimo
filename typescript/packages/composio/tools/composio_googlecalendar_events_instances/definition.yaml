name: composio_googlecalendar_events_instances
description: Returns instances of the specified recurring event.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the GOOGLECALENDAR toolkit, scoped to the calling
      tenant. The "Connect GOOGLECALENDAR" flow must be completed before this tool will succeed.
    required: true
  eventId:
    type: string
    description: Recurring event identifier.
    required: true
  timeMax:
    type: string
    description: >-
      Upper bound (exclusive) for an event's start time to filter by. Optional. The default is not
      to filter by start time. Must be an RFC3339 timestamp with mandatory time zone offset.
    default: null
  timeMin:
    type: string
    description: >-
      Lower bound (inclusive) for an event's end time to filter by. Optional. The default is not to
      filter by end time. Must be an RFC3339 timestamp with mandatory time zone offset.
    default: null
  timeZone:
    type: string
    description: Time zone used in the response. Optional. The default is the time zone of the calendar.
    default: null
  pageToken:
    type: string
    description: Token specifying which result page to return. Optional.
    default: null
  calendarId:
    type: string
    description: >-
      Calendar identifier. To retrieve calendar IDs call the `calendarList.list` method. If you want
      to access the primary calendar of the currently logged in user, use the "primary" keyword.
    required: true
  maxResults:
    type: number
    description: >-
      Maximum number of events returned on one result page. By default the value is 250 events. The
      page size can never be larger than 2500 events. Optional.
    default: null
  showDeleted:
    type: boolean
    description: >-
      Whether to include deleted events (with status equals "cancelled") in the result. Cancelled
      instances of recurring events will still be included if `singleEvents` is False. Optional. The
      default is False.
    default: null
  maxAttendees:
    type: number
    description: >-
      The maximum number of attendees to include in the response. If there are more than the
      specified number of attendees, only the participant is returned. Optional.
    default: null
  originalStart:
    type: string
    description: The original start time of the instance in the result. Optional.
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/GOOGLECALENDAR_EVENTS_INSTANCES
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_googlecalendar_events_instances
      eventId: '{eventId}'
      timeMax: '{timeMax}'
      timeMin: '{timeMin}'
      timeZone: '{timeZone}'
      pageToken: '{pageToken}'
      calendarId: '{calendarId}'
      maxResults: '{maxResults}'
      showDeleted: '{showDeleted}'
      maxAttendees: '{maxAttendees}'
      originalStart: '{originalStart}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - googlecalendar
notes:
  env: COMPOSIO_API_KEY
  toolkit: googlecalendar
  composio_slug: GOOGLECALENDAR_EVENTS_INSTANCES
