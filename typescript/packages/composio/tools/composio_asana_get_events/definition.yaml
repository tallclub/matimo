name: composio_asana_get_events
description: >-
  Retrieve events on a resource to monitor changes. use when you need to track activity or changes
  related to a specific asana resource like a task, project, or tag.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ASANA toolkit, scoped to the calling tenant. The
      "Connect ASANA" flow must be completed before this tool will succeed.
    required: true
  sync:
    type: string
    description: >-
      A sync token received from a previous events GET request. If provided, the API will return
      only events that have occurred since the sync token was created. If omitted, the API will
      return all events.
    default: null
  opt_fields:
    type: array
    description: >-
      Defines fields to return. Some requests return compact representations of objects in order to
      conserve resources and complete the request more efficiently. Other times requests return more
      information than you may need. This option allows you to list the exact set of fields that the
      API should be sure to return for the objects. The field names should be provided as paths,
      described below. The id of included objects will always be returned, regardless of the field
      options.
    default: null
  opt_pretty:
    type: boolean
    description: >-
      Provides “pretty” output. Provides the response in a “pretty” format. In the case of JSON this
      means doing proper line breaking and indentation to make it readable. This will take extra
      time and increase the response size so it is advisable only to use this during debugging.
    default: null
  resource_gid:
    type: string
    description: Globally unique identifier for the resource.
    required: true
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ASANA_GET_EVENTS
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_asana_get_events
      sync: '{sync}'
      opt_fields: '{opt_fields}'
      opt_pretty: '{opt_pretty}'
      resource_gid: '{resource_gid}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - asana
notes:
  env: COMPOSIO_API_KEY
  toolkit: asana
  composio_slug: ASANA_GET_EVENTS
