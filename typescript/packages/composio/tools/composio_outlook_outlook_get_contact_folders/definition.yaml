name: composio_outlook_outlook_get_contact_folders
description: >-
  Tool to retrieve a list of contact folders in the signed-in user's mailbox. use after
  authentication when you need to browse or select among contact folders.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the OUTLOOK toolkit, scoped to the calling tenant. The
      "Connect OUTLOOK" flow must be completed before this tool will succeed.
    required: true
  top:
    type: number
    description: Maximum number of contact folders to return.
    default: null
  skip:
    type: number
    description: Number of contact folders to skip for pagination.
    default: null
  expand:
    type: array
    description: Related entities to expand inline, e.g., ['contacts'].
  filter:
    type: string
    description: OData filter expression, e.g., startswith(displayName,'A').
    default: null
  select:
    type: array
    description: List of properties to include in the response, e.g., ['id','displayName'].
  orderby:
    type: array
    description: List of properties to order results by, e.g., ['displayName asc'].
  user_id:
    type: string
    description: User principal name or ID. Use 'me' for the authenticated user.
    default: me
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/OUTLOOK_OUTLOOK_GET_CONTACT_FOLDERS
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_outlook_outlook_get_contact_folders
      top: '{top}'
      skip: '{skip}'
      expand: '{expand}'
      filter: '{filter}'
      select: '{select}'
      orderby: '{orderby}'
      user_id: '{user_id}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - outlook
notes:
  env: COMPOSIO_API_KEY
  toolkit: outlook
  composio_slug: OUTLOOK_OUTLOOK_GET_CONTACT_FOLDERS
