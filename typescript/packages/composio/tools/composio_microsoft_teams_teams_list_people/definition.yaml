name: composio_microsoft_teams_teams_list_people
description: >-
  Retrieves a list of people relevant to a specified user from microsoft graph, noting the `search`
  parameter is only effective if `user id` is 'me'.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the MICROSOFT_TEAMS toolkit, scoped to the calling
      tenant. The "Connect MICROSOFT_TEAMS" flow must be completed before this tool will succeed.
    required: true
  top:
    type: number
    description: >-
      Maximum number of items per page for pagination. Actual count may be less. Service default if
      unspecified.
    default: null
  skip:
    type: number
    description: Number of items to skip for pagination.
    default: null
  filter:
    type: string
    description: OData $filter query to limit results (e.g., `"startsWith(displayName,'A')"`).
    default: null
  search:
    type: string
    description: >-
      Fuzzy search query (name, email, or topic like 'topic:marketing'). Effective only when
      `user_id` is 'me'.
    default: null
  select:
    type: string
    description: >-
      Comma-separated OData property names to include for each person (e.g., 'id,displayName'). If
      unspecified, a default set is returned.
    default: null
  orderby:
    type: string
    description: OData $orderby expression to sort results (e.g., 'displayName asc, relevanceScore desc').
    default: null
  user_id:
    type: string
    description: >-
      Identifier of the user (e.g., 'me', 'adelev@contoso.com', or GUID) whose relevant people are
      to be retrieved.
    default: me
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/MICROSOFT_TEAMS_TEAMS_LIST_PEOPLE
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_microsoft_teams_teams_list_people
      top: '{top}'
      skip: '{skip}'
      filter: '{filter}'
      search: '{search}'
      select: '{select}'
      orderby: '{orderby}'
      user_id: '{user_id}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - microsoft_teams
notes:
  env: COMPOSIO_API_KEY
  toolkit: microsoft_teams
  composio_slug: MICROSOFT_TEAMS_TEAMS_LIST_PEOPLE
