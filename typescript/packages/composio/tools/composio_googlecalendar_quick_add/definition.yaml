name: composio_googlecalendar_quick_add
description: >-
  Parses natural language text to quickly create a basic google calendar event with its title, date,
  and time, suitable for simple scheduling; does not support direct attendee addition or recurring
  events, and `calendar id` must be valid if not 'primary'.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the GOOGLECALENDAR toolkit, scoped to the calling
      tenant. The "Connect GOOGLECALENDAR" flow must be completed before this tool will succeed.
    required: true
  text:
    type: string
    description: >-
      Natural language input describing the event; Google Calendar parses this for event details
      like title, date, and time.
    default: ''
  calendar_id:
    type: string
    description: >-
      Identifier of the calendar for the event. Use 'primary' for the main calendar, or provide a
      specific calendar ID (e.g., email address).
    default: primary
  send_updates:
    type: string
    description: Controls whether email notifications about the event creation are sent to attendees.
    enum:
      - all
      - externalOnly
      - none
    default: none
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/GOOGLECALENDAR_QUICK_ADD
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_googlecalendar_quick_add
      text: '{text}'
      calendar_id: '{calendar_id}'
      send_updates: '{send_updates}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - googlecalendar
notes:
  env: COMPOSIO_API_KEY
  toolkit: googlecalendar
  composio_slug: GOOGLECALENDAR_QUICK_ADD
