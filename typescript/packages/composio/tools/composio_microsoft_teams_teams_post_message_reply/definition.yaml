name: composio_microsoft_teams_teams_post_message_reply
description: >-
  Sends a reply to an existing message, identified by `message id`, within a specific `channel id`
  of a given `team id` in microsoft teams.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the MICROSOFT_TEAMS toolkit, scoped to the calling
      tenant. The "Connect MICROSOFT_TEAMS" flow must be completed before this tool will succeed.
    required: true
  content:
    type: string
    description: >-
      The body of the reply message. This can be plain text or HTML, as specified by the
      `content_type` field.
    required: true
  team_id:
    type: string
    description: >-
      The unique identifier (GUID) of the Microsoft Teams team that contains the channel where the
      message to be replied to exists.
    required: true
  channel_id:
    type: string
    description: >-
      The unique identifier of the channel within the specified team. This channel contains the
      message to which the reply will be posted. Channel IDs typically follow a format like
      '19:{alphanumeric_string}@thread.tacv2'.
    required: true
  message_id:
    type: string
    description: >-
      The unique identifier of the specific message within the channel to which this reply is
      directed.
    required: true
  content_type:
    type: string
    description: >-
      Specifies the format of the `content` field. Accepted values are 'text' for plain text content
      and 'html' for content with HTML formatting. Defaults to 'text' if not provided.
    default: text
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/MICROSOFT_TEAMS_TEAMS_POST_MESSAGE_REPLY
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_microsoft_teams_teams_post_message_reply
      content: '{content}'
      team_id: '{team_id}'
      channel_id: '{channel_id}'
      message_id: '{message_id}'
      content_type: '{content_type}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - microsoft_teams
notes:
  env: COMPOSIO_API_KEY
  toolkit: microsoft_teams
  composio_slug: MICROSOFT_TEAMS_TEAMS_POST_MESSAGE_REPLY
