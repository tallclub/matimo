name: composio_one_drive_get_item_versions
description: >-
  Tool to retrieve the version history of a driveitem by its unique id. use when you need to access
  or list previous versions of a file.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ONE_DRIVE toolkit, scoped to the calling tenant. The
      "Connect ONE_DRIVE" flow must be completed before this tool will succeed.
    required: true
  item_id:
    type: string
    description: The unique identifier of the item (file or folder).
    required: true
  site_id:
    type: string
    description: The unique identifier of the site. Mutually exclusive with drive_id, group_id, and user_id.
    default: null
  user_id:
    type: string
    description: The unique identifier of the user. Mutually exclusive with drive_id, group_id, and site_id.
    default: null
  drive_id:
    type: string
    description: >-
      The unique identifier of the drive. Mutually exclusive with group_id, site_id, and user_id.
      One of these must be provided if not using the /me path.
    default: null
  group_id:
    type: string
    description: The unique identifier of the group. Mutually exclusive with drive_id, site_id, and user_id.
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ONE_DRIVE_GET_ITEM_VERSIONS
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_one_drive_get_item_versions
      item_id: '{item_id}'
      site_id: '{site_id}'
      user_id: '{user_id}'
      drive_id: '{drive_id}'
      group_id: '{group_id}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - one_drive
notes:
  env: COMPOSIO_API_KEY
  toolkit: one_drive
  composio_slug: ONE_DRIVE_GET_ITEM_VERSIONS
