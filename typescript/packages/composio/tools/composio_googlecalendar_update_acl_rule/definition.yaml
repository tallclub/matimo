name: composio_googlecalendar_update_acl_rule
description: Updates an access control rule for the specified calendar.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the GOOGLECALENDAR toolkit, scoped to the calling
      tenant. The "Connect GOOGLECALENDAR" flow must be completed before this tool will succeed.
    required: true
  role:
    type: string
    description: >-
      The role assigned to the scope. Possible values are: 

      - "none" - Provides no access. 

      - "freeBusyReader" - Provides read access to free/busy information. 

      - "reader" - Provides read access to the calendar. Private events will appear to users with
      reader access, but event details will be hidden. 

      - "writer" - Provides read and write access to the calendar. Private events will appear to
      users with writer access, and event details will be visible. 

      - "owner" - Provides ownership of the calendar. This role has all of the permissions of the
      writer role with the additional ability to see and manipulate ACLs.
    required: true
  rule_id:
    type: string
    description: ACL rule identifier.
    required: true
  calendar_id:
    type: string
    description: >-
      Calendar identifier. To retrieve calendar IDs call the calendarList.list method. If you want
      to access the primary calendar of the currently logged in user, use the "primary" keyword.
    required: true
  send_notifications:
    type: boolean
    description: >-
      Whether to send notifications about the calendar sharing change. Note that there are no
      notifications on access removal. Optional. The default is True.
    default: true
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/GOOGLECALENDAR_UPDATE_ACL_RULE
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_googlecalendar_update_acl_rule
      role: '{role}'
      rule_id: '{rule_id}'
      calendar_id: '{calendar_id}'
      send_notifications: '{send_notifications}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - googlecalendar
notes:
  env: COMPOSIO_API_KEY
  toolkit: googlecalendar
  composio_slug: GOOGLECALENDAR_UPDATE_ACL_RULE
