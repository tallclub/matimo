name: composio_microsoft_teams_chats_get_all_messages
description: >-
  Retrieves all messages from a specified microsoft teams chat using the microsoft graph api,
  automatically handling pagination; ensure `chat id` is valid and odata expressions in `filter` or
  `select` are correct.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the MICROSOFT_TEAMS toolkit, scoped to the calling
      tenant. The "Connect MICROSOFT_TEAMS" flow must be completed before this tool will succeed.
    required: true
  top:
    type: number
    description: Maximum number of messages to retrieve per page. Used for pagination.
    default: 50
  filter:
    type: string
    description: OData v4.0 filter query string for messages. If empty, no filtering is applied.
    default: ''
  select:
    type: array
    description: >-
      Message properties to return (e.g., 'id', 'body'). Optimizes the request. If empty, a default
      set of properties is returned.
    default: []
  chat_id:
    type: string
    description: Unique identifier of the Microsoft Teams chat.
    required: true
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/MICROSOFT_TEAMS_CHATS_GET_ALL_MESSAGES
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_microsoft_teams_chats_get_all_messages
      top: '{top}'
      filter: '{filter}'
      select: '{select}'
      chat_id: '{chat_id}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - microsoft_teams
notes:
  env: COMPOSIO_API_KEY
  toolkit: microsoft_teams
  composio_slug: MICROSOFT_TEAMS_CHATS_GET_ALL_MESSAGES
