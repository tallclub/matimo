name: composio_jira_list_sprints
description: Retrieves paginated sprints from a jira board with optional state filtering.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the JIRA toolkit, scoped to the calling tenant. The
      "Connect JIRA" flow must be completed before this tool will succeed.
    required: true
  state:
    type: string
    description: 'Filters sprints by state: ''future'', ''active'', or ''closed''. Returns all states if omitted.'
    default: null
  board_id:
    type: number
    description: Unique identifier of the Jira board.
    required: true
  start_at:
    type: number
    description: 0-based starting index for pagination.
    default: 0
  max_results:
    type: number
    description: Maximum number of sprints per page.
    default: 50
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/JIRA_LIST_SPRINTS
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_jira_list_sprints
      state: '{state}'
      board_id: '{board_id}'
      start_at: '{start_at}'
      max_results: '{max_results}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - jira
notes:
  env: COMPOSIO_API_KEY
  toolkit: jira
  composio_slug: JIRA_LIST_SPRINTS
