name: composio_linear_remove_issue_label
description: >-
  Removes a specified label from an existing linear issue using their ids; successful even if the
  label isn't on the issue.
version: 1.0.0
risk: high
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the LINEAR toolkit, scoped to the calling tenant. The
      "Connect LINEAR" flow must be completed before this tool will succeed.
    required: true
  issue_id:
    type: string
    description: Identifier of the Linear issue from which to remove the label.
    required: true
  label_id:
    type: string
    description: >-
      Identifier of the label to remove. The operation is successful without change if this label
      isn't on the issue.
    required: true
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/LINEAR_REMOVE_ISSUE_LABEL
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_linear_remove_issue_label
      issue_id: '{issue_id}'
      label_id: '{label_id}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - linear
notes:
  env: COMPOSIO_API_KEY
  toolkit: linear
  composio_slug: LINEAR_REMOVE_ISSUE_LABEL
