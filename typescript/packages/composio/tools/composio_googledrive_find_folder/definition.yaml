name: composio_googledrive_find_folder
description: >-
  Tool to find a folder in google drive by its name and optionally a parent folder. use when you
  need to locate a specific folder to perform further actions like creating files in it or listing
  its contents.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the GOOGLEDRIVE toolkit, scoped to the calling tenant.
      The "Connect GOOGLEDRIVE" flow must be completed before this tool will succeed.
    required: true
  starred:
    type: boolean
    description: Set to true to search for folders that are starred, or false for those that are not.
    default: null
  name_exact:
    type: string
    description: The exact name of the folder to search for. This search is case-sensitive.
    default: null
  name_contains:
    type: string
    description: A substring to search for within folder names. This search is case-insensitive.
    default: null
  modified_after:
    type: string
    description: >-
      Search for folders modified after a specific date and time. The timestamp must be in RFC 3339
      format (e.g., '2023-01-15T10:00:00Z' or '2023-01-15T10:00:00.000Z').
    default: null
  name_not_contains:
    type: string
    description: >-
      A substring to exclude from folder names. Folders with names containing this substring will
      not be returned. This search is case-insensitive.
    default: null
  full_text_contains:
    type: string
    description: >-
      A string to search for within the full text content of files within folders (if applicable and
      supported by Drive for the folder type or its contents). This search is case-insensitive.
    default: null
  full_text_not_contains:
    type: string
    description: >-
      A string to exclude from the full text content of files within folders. This search is
      case-insensitive.
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/GOOGLEDRIVE_FIND_FOLDER
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_googledrive_find_folder
      starred: '{starred}'
      name_exact: '{name_exact}'
      name_contains: '{name_contains}'
      modified_after: '{modified_after}'
      name_not_contains: '{name_not_contains}'
      full_text_contains: '{full_text_contains}'
      full_text_not_contains: '{full_text_not_contains}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - googledrive
notes:
  env: COMPOSIO_API_KEY
  toolkit: googledrive
  composio_slug: GOOGLEDRIVE_FIND_FOLDER
