name: composio_asana_insert_enum_option_for_custom_field
description: >-
  Tool to reorder an existing enum option or insert a new enum option for a custom field at a
  specific position. use when you need to manage the order of options in an enum custom field or add
  a new option at a defined place.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ASANA toolkit, scoped to the calling tenant. The
      "Connect ASANA" flow must be completed before this tool will succeed.
    required: true
  data:
    type: object
    description: The data for the enum option to be inserted or reordered.
    required: true
  opt_fields:
    type: array
    description: >-
      This endpoint returns a resource which excludes some properties by default. To include those
      optional properties, set this query parameter to a comma-separated list of the properties you
      wish to include.
    default: null
  opt_pretty:
    type: boolean
    description: Provides “pretty” output.
    default: false
  custom_field_gid:
    type: string
    description: Globally unique identifier for the custom field.
    required: true
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ASANA_INSERT_ENUM_OPTION_FOR_CUSTOM_FIELD
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_asana_insert_enum_option_for_custom_field
      data: '{data}'
      opt_fields: '{opt_fields}'
      opt_pretty: '{opt_pretty}'
      custom_field_gid: '{custom_field_gid}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - asana
notes:
  env: COMPOSIO_API_KEY
  toolkit: asana
  composio_slug: ASANA_INSERT_ENUM_OPTION_FOR_CUSTOM_FIELD
