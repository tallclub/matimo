name: composio_one_drive_onedrive_create_folder
description: >-
  Creates a new folder in the user's onedrive, automatically renaming on conflict, optionally within
  a specified parent folder (by id or full path from root) which, if not the root, must exist and be
  accessible.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ONE_DRIVE toolkit, scoped to the calling tenant. The
      "Connect ONE_DRIVE" flow must be completed before this tool will succeed.
    required: true
  name:
    type: string
    description: >-
      The desired name for the new folder. If a folder with this name already exists in the
      specified parent_folder, the new folder will be automatically renamed (e.g., 'New Folder'
      might become 'New Folder 1'). Examples: ['Annual Reports', 'Client Meeting Notes']
    required: true
  user_id:
    type: string
    description: >-
      Identifier for the user. This action operates on the currently authenticated user's OneDrive.
      Examples: ['me']
    default: me
  parent_folder:
    type: string
    description: >-
      ID or full path of the parent folder for the new folder. Paths must start from the root (e.g.,
      '/Documents/Reports'). If an ID is provided, it refers to an existing folder's unique ID.
      Examples: ['/Projects/Alpha', 'folder_id_12345ABC', '/']
    default: /
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ONE_DRIVE_ONEDRIVE_CREATE_FOLDER
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_one_drive_onedrive_create_folder
      name: '{name}'
      user_id: '{user_id}'
      parent_folder: '{parent_folder}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - one_drive
notes:
  env: COMPOSIO_API_KEY
  toolkit: one_drive
  composio_slug: ONE_DRIVE_ONEDRIVE_CREATE_FOLDER
