name: composio_one_drive_update_drive_item_metadata
description: >-
  Tool to update the metadata of a specific item (file or folder) in onedrive. use this to rename
  items, change descriptions, or move items to a new parent folder.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ONE_DRIVE toolkit, scoped to the calling tenant. The
      "Connect ONE_DRIVE" flow must be completed before this tool will succeed.
    required: true
  name:
    type: string
    description: The new name for the drive item.
    default: null
  item_id:
    type: string
    description: The unique identifier of the drive item (file or folder) to update.
    required: true
  site_id:
    type: string
    description: The unique identifier of the site. Used when updating an item within a site's drive.
    default: null
  user_id:
    type: string
    description: The unique identifier of the user. Used when updating an item within a specific user's drive.
    default: null
  drive_id:
    type: string
    description: >-
      The unique identifier of the drive. Required if not using other specific paths like /me,
      /groups/{group-id}, /sites/{site-id}, or /users/{user-id}.
    default: null
  group_id:
    type: string
    description: The unique identifier of the group. Used when updating an item within a group's drive.
    default: null
  description:
    type: string
    description: The new description for the drive item.
    default: null
  parent_reference_id:
    type: string
    description: >-
      The ID of the new parent item. Use this to move the item. The driveId of the parentReference
      can also be specified if moving between drives.
    default: null
  additional_properties:
    type: object
    description: Allows passing any other updatable DriveItem properties not explicitly defined in the model.
    default: null
  parent_reference_drive_id:
    type: string
    description: The drive ID of the new parent item, if moving to a different drive.
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ONE_DRIVE_UPDATE_DRIVE_ITEM_METADATA
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_one_drive_update_drive_item_metadata
      name: '{name}'
      item_id: '{item_id}'
      site_id: '{site_id}'
      user_id: '{user_id}'
      drive_id: '{drive_id}'
      group_id: '{group_id}'
      description: '{description}'
      parent_reference_id: '{parent_reference_id}'
      additional_properties: '{additional_properties}'
      parent_reference_drive_id: '{parent_reference_drive_id}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - one_drive
notes:
  env: COMPOSIO_API_KEY
  toolkit: one_drive
  composio_slug: ONE_DRIVE_UPDATE_DRIVE_ITEM_METADATA
