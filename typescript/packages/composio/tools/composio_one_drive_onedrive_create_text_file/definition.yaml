name: composio_one_drive_onedrive_create_text_file
description: >-
  Creates a new text file with specified content in a onedrive folder, using either the folder's
  unique id or its absolute path (paths are automatically resolved to ids); note that onedrive may
  rename or create a new version if the filename already exists.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ONE_DRIVE toolkit, scoped to the calling tenant. The
      "Connect ONE_DRIVE" flow must be completed before this tool will succeed.
    required: true
  name:
    type: string
    description: >-
      The desired name for the new text file, including its extension (e.g., 'report.txt',
      'notes.log').
    required: true
  folder:
    type: string
    description: >-
      The unique identifier (ID) or an absolute path of the OneDrive folder where the new text file
      will be created.
    default: /
  content:
    type: string
    description: The plain text content to be written into the new file.
    required: true
  user_id:
    type: string
    description: The user's ID or the literal 'me' to represent the currently authenticated user.
    default: me
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ONE_DRIVE_ONEDRIVE_CREATE_TEXT_FILE
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_one_drive_onedrive_create_text_file
      name: '{name}'
      folder: '{folder}'
      content: '{content}'
      user_id: '{user_id}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - one_drive
notes:
  env: COMPOSIO_API_KEY
  toolkit: one_drive
  composio_slug: ONE_DRIVE_ONEDRIVE_CREATE_TEXT_FILE
