name: composio_outlook_outlook_reply_email
description: >-
  Sends a plain text reply to an outlook email message, identified by `message id`, allowing
  optional cc and bcc recipients.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the OUTLOOK toolkit, scoped to the calling tenant. The
      "Connect OUTLOOK" flow must be completed before this tool will succeed.
    required: true
  comment:
    type: string
    description: The plain text body of the reply email.
    required: true
  user_id:
    type: string
    description: >-
      The user's email address or 'me' to indicate the authenticated user. This specifies the
      mailbox from which the reply will be sent.
    default: me
  cc_emails:
    type: array
    description: List of email addresses for CC recipients.
    default: []
  bcc_emails:
    type: array
    description: List of email addresses for BCC recipients.
    default: []
  message_id:
    type: string
    description: >-
      The unique ID of the message to reply to. This ID can be obtained from the
      `OUTLOOK_LIST_MESSAGES` action.
    required: true
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/OUTLOOK_OUTLOOK_REPLY_EMAIL
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_outlook_outlook_reply_email
      comment: '{comment}'
      user_id: '{user_id}'
      cc_emails: '{cc_emails}'
      bcc_emails: '{bcc_emails}'
      message_id: '{message_id}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - outlook
notes:
  env: COMPOSIO_API_KEY
  toolkit: outlook
  composio_slug: OUTLOOK_OUTLOOK_REPLY_EMAIL
