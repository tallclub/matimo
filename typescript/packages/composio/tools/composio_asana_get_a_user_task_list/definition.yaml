name: composio_asana_get_a_user_task_list
description: >-
  Retrieves a specific user's task list from asana by its `user task list gid`, optionally returning
  extended details like name, owner, and workspace if specified in `opt fields`.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ASANA toolkit, scoped to the calling tenant. The
      "Connect ASANA" flow must be completed before this tool will succeed.
    required: true
  workspace:
    type: string
    description: The GID of the workspace to filter the user task list.
    required: true
  opt_fields:
    type: array
    description: >-
      A list of optional field names to include in the response. By default, the response is compact
      and excludes some properties. Use this parameter to retrieve additional details. For example,
      to include the owner and workspace, provide `["owner", "workspace"]` as the value for this
      field.
    default: null
  opt_pretty:
    type: boolean
    description: >-
      Set to true to receive the API response in a pretty-printed JSON format. This is useful for
      debugging but may increase response size and processing time.
    default: null
  user_task_list_gid:
    type: string
    description: The globally unique identifier (GID) for the user task list to be retrieved.
    required: true
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ASANA_GET_A_USER_TASK_LIST
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_asana_get_a_user_task_list
      workspace: '{workspace}'
      opt_fields: '{opt_fields}'
      opt_pretty: '{opt_pretty}'
      user_task_list_gid: '{user_task_list_gid}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - asana
notes:
  env: COMPOSIO_API_KEY
  toolkit: asana
  composio_slug: ASANA_GET_A_USER_TASK_LIST
