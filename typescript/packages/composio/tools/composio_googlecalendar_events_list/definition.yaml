name: composio_googlecalendar_events_list
description: Returns events on the specified calendar.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the GOOGLECALENDAR toolkit, scoped to the calling
      tenant. The "Connect GOOGLECALENDAR" flow must be completed before this tool will succeed.
    required: true
  q:
    type: string
    description: Free text search terms to find events that match these terms in various fields. Optional.
    default: null
  iCalUID:
    type: string
    description: >-
      Specifies an event ID in the iCalendar format to be provided in the response. Optional. Use
      this if you want to search for an event by its iCalendar ID.
    default: null
  orderBy:
    type: string
    description: >-
      The order of the events returned in the result. Optional. The default is an unspecified,
      stable order. Acceptable values are: "startTime", "updated".
    default: null
  timeMax:
    type: string
    description: >-
      Upper bound (exclusive) for an event's start time to filter by. Optional. The default is not
      to filter by start time. Must be an RFC3339 timestamp with mandatory time zone offset, for
      example, 2011-06-03T10:00:00-07:00, 2011-06-03T10:00:00Z. Milliseconds may be provided but are
      ignored. If timeMin is set, timeMax must be greater than timeMin.
    default: '2025-09-01T08:20:14.636699Z'
  timeMin:
    type: string
    description: >-
      Lower bound (exclusive) for an event's end time to filter by. Optional. The default is not to
      filter by end time. Must be an RFC3339 timestamp with mandatory time zone offset, for example,
      2011-06-03T10:00:00-07:00, 2011-06-03T10:00:00Z. Milliseconds may be provided but are ignored.
      If timeMax is set, timeMin must be smaller than timeMax.
    default: '2025-08-25T08:20:14.636762Z'
  timeZone:
    type: string
    description: Time zone used in the response. Optional. The default is the user's primary time zone.
    default: null
  pageToken:
    type: string
    description: Token specifying which result page to return. Optional.
    default: null
  syncToken:
    type: string
    description: >-
      Token obtained from the nextSyncToken field returned on the last page of results from the
      previous list request. Optional. The default is to return all entries.
    default: null
  calendarId:
    type: string
    description: >-
      Calendar identifier. To retrieve calendar IDs call the calendarList.list method. If you want
      to access the primary calendar of the currently logged in user, use the "primary" keyword.
    required: true
  eventTypes:
    type: string
    description: >-
      Event types to return. Optional. This parameter can be repeated multiple times to return
      events of different types. If unset, returns all event types. Acceptable values are:
      "birthday", "default", "focusTime", "fromGmail", "outOfOffice", "workingLocation".
    default: null
  maxResults:
    type: number
    description: >-
      Maximum number of events returned on one result page. The number of events in the resulting
      page may be less than this value, or none at all, even if there are more events matching the
      query. Incomplete pages can be detected by a non-empty nextPageToken field in the response. By
      default the value is 250 events. The page size can never be larger than 2500 events. Optional.
    default: null
  updatedMin:
    type: string
    description: >-
      Lower bound for an event's last modification time (as a RFC3339 timestamp) to filter by. When
      specified, entries deleted since this time will always be included regardless of showDeleted.
      Optional. The default is not to filter by last modification time.
    default: null
  showDeleted:
    type: boolean
    description: >-
      Whether to include deleted events (with status equals "cancelled") in the result. Optional.
      The default is False.
    default: null
  maxAttendees:
    type: number
    description: >-
      The maximum number of attendees to include in the response. If there are more than the
      specified number of attendees, only the participant is returned. Optional.
    default: null
  singleEvents:
    type: boolean
    description: >-
      Whether to expand recurring events into instances and only return single one-off events and
      instances of recurring events. Optional. The default is False.
    default: null
  alwaysIncludeEmail:
    type: boolean
    description: Deprecated and ignored.
    default: null
  showHiddenInvitations:
    type: boolean
    description: Whether to include hidden invitations in the result. Optional. The default is False.
    default: null
  sharedExtendedProperty:
    type: string
    description: >-
      Extended properties constraint specified as propertyName=value. Matches only shared
      properties. This parameter might be repeated multiple times to return events that match all
      given constraints.
    default: null
  privateExtendedProperty:
    type: string
    description: >-
      Extended properties constraint specified as propertyName=value. Matches only private
      properties. This parameter might be repeated multiple times to return events that match all
      given constraints.
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/GOOGLECALENDAR_EVENTS_LIST
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_googlecalendar_events_list
      q: '{q}'
      iCalUID: '{iCalUID}'
      orderBy: '{orderBy}'
      timeMax: '{timeMax}'
      timeMin: '{timeMin}'
      timeZone: '{timeZone}'
      pageToken: '{pageToken}'
      syncToken: '{syncToken}'
      calendarId: '{calendarId}'
      eventTypes: '{eventTypes}'
      maxResults: '{maxResults}'
      updatedMin: '{updatedMin}'
      showDeleted: '{showDeleted}'
      maxAttendees: '{maxAttendees}'
      singleEvents: '{singleEvents}'
      alwaysIncludeEmail: '{alwaysIncludeEmail}'
      showHiddenInvitations: '{showHiddenInvitations}'
      sharedExtendedProperty: '{sharedExtendedProperty}'
      privateExtendedProperty: '{privateExtendedProperty}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - googlecalendar
notes:
  env: COMPOSIO_API_KEY
  toolkit: googlecalendar
  composio_slug: GOOGLECALENDAR_EVENTS_LIST
