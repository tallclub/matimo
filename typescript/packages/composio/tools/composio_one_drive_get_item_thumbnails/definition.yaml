name: composio_one_drive_get_item_thumbnails
description: >-
  Tool to retrieve the thumbnails associated with a driveitem. use when you need to display visual
  previews of files.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ONE_DRIVE toolkit, scoped to the calling tenant. The
      "Connect ONE_DRIVE" flow must be completed before this tool will succeed.
    required: true
  select:
    type: string
    description: >-
      A comma-separated list of thumbnail sizes to retrieve (e.g., "small,medium,large", or
      "c300x400_crop"). If not specified, all available thumbnails for the first thumbnailSet (id:
      "0") are returned.
    default: null
  item_id:
    type: string
    description: The unique identifier of the DriveItem.
    required: true
  site_id:
    type: string
    description: The unique identifier of a Site. Provide either drive_id, group_id, site_id, or user_id.
    default: null
  user_id:
    type: string
    description: The unique identifier of a User. Provide either drive_id, group_id, site_id, or user_id.
    default: null
  drive_id:
    type: string
    description: >-
      The unique identifier of the Drive. If not provided, 'me' will be used for the current user's
      drive.
    default: null
  group_id:
    type: string
    description: The unique identifier of a Group. Provide either drive_id, group_id, site_id, or user_id.
    default: null
  original_orientation:
    type: boolean
    description: >-
      If true, retrieves the thumbnail with its original EXIF orientation. This is only supported on
      OneDrive Personal. Defaults to false.
    default: false
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ONE_DRIVE_GET_ITEM_THUMBNAILS
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_one_drive_get_item_thumbnails
      select: '{select}'
      item_id: '{item_id}'
      site_id: '{site_id}'
      user_id: '{user_id}'
      drive_id: '{drive_id}'
      group_id: '{group_id}'
      original_orientation: '{original_orientation}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - one_drive
notes:
  env: COMPOSIO_API_KEY
  toolkit: one_drive
  composio_slug: ONE_DRIVE_GET_ITEM_THUMBNAILS
