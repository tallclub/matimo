name: composio_microsoft_teams_teams_list_channels
description: >-
  Retrieves channels for a specified microsoft teams team id (must be valid and for an existing
  team), with options to include shared channels, filter results, and select properties.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the MICROSOFT_TEAMS toolkit, scoped to the calling
      tenant. The "Connect MICROSOFT_TEAMS" flow must be completed before this tool will succeed.
    required: true
  filter:
    type: string
    description: >-
      OData v4 query string to filter channels (e.g., `startswith(displayName,'Sales')` or
      `membershipType eq 'private'`).
    default: ''
  select:
    type: string
    description: >-
      Comma-separated channel properties to return (e.g., 'id,displayName,description'); empty for
      default properties. Common: `id`, `displayName`, `description`, `email`, `membershipType`,
      `webUrl`.
    default: ''
  team_id:
    type: string
    description: Unique identifier (ID) of the Microsoft Teams team.
    required: true
  include_shared_channels:
    type: boolean
    description: If true, include channels shared with the team.
    default: false
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/MICROSOFT_TEAMS_TEAMS_LIST_CHANNELS
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_microsoft_teams_teams_list_channels
      filter: '{filter}'
      select: '{select}'
      team_id: '{team_id}'
      include_shared_channels: '{include_shared_channels}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - microsoft_teams
notes:
  env: COMPOSIO_API_KEY
  toolkit: microsoft_teams
  composio_slug: MICROSOFT_TEAMS_TEAMS_LIST_CHANNELS
