name: composio_jira_get_issue_property
description: Retrieves a custom property from a jira issue by key.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the JIRA toolkit, scoped to the calling tenant. The
      "Connect JIRA" flow must be completed before this tool will succeed.
    required: true
  property_key:
    type: string
    description: >-
      The key of the issue property to retrieve. Property keys are often dot-separated, like
      'com.example.property.key'.
    required: true
  issue_id_or_key:
    type: string
    description: The ID (e.g., '10000') or key (e.g., 'TEST-123') of the Jira issue.
    required: true
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/JIRA_GET_ISSUE_PROPERTY
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_jira_get_issue_property
      property_key: '{property_key}'
      issue_id_or_key: '{issue_id_or_key}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - jira
notes:
  env: COMPOSIO_API_KEY
  toolkit: jira
  composio_slug: JIRA_GET_ISSUE_PROPERTY
