name: composio_googledrive_list_replies_to_comment
description: >-
  Tool to list replies to a comment in google drive. use this when you need to retrieve all replies
  associated with a specific comment on a file.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the GOOGLEDRIVE toolkit, scoped to the calling tenant.
      The "Connect GOOGLEDRIVE" flow must be completed before this tool will succeed.
    required: true
  fields:
    type: string
    description: >-
      Selector specifying which fields to include in a partial response. Use '*' for all fields or
      e.g. 'replies(id,content),nextPageToken'
    default: '*'
  file_id:
    type: string
    description: The ID of the file.
    required: true
  page_size:
    type: number
    description: The maximum number of replies to return per page.
    default: null
  comment_id:
    type: string
    description: The ID of the comment.
    required: true
  page_token:
    type: string
    description: >-
      The token for continuing a previous list request on the next page. This should be set to the
      value of 'nextPageToken' from the previous response.
    default: null
  include_deleted:
    type: boolean
    description: Whether to include deleted replies. Deleted replies will not include their original content.
    default: false
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/GOOGLEDRIVE_LIST_REPLIES_TO_COMMENT
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_googledrive_list_replies_to_comment
      fields: '{fields}'
      file_id: '{file_id}'
      page_size: '{page_size}'
      comment_id: '{comment_id}'
      page_token: '{page_token}'
      include_deleted: '{include_deleted}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - googledrive
notes:
  env: COMPOSIO_API_KEY
  toolkit: googledrive
  composio_slug: GOOGLEDRIVE_LIST_REPLIES_TO_COMMENT
