name: composio_asana_get_team_memberships
description: >-
  Tool to retrieve compact team membership records. use when you need to list members of a team,
  teams a user belongs to, or all team memberships in a workspace.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ASANA toolkit, scoped to the calling tenant. The
      "Connect ASANA" flow must be completed before this tool will succeed.
    required: true
  team:
    type: string
    description: The team to filter memberships to.
    default: null
  user:
    type: string
    description: A user gid to filter memberships to.
    default: null
  limit:
    type: number
    description: Results per page.
    default: null
  offset:
    type: string
    description: Offset token.
    default: null
  workspace:
    type: string
    description: The workspace to filter memberships to.
    default: null
  opt_fields:
    type: array
    description: Defines fields to return.
    default: null
  opt_pretty:
    type: boolean
    description: Adds indentation to JSON response.
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ASANA_GET_TEAM_MEMBERSHIPS
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_asana_get_team_memberships
      team: '{team}'
      user: '{user}'
      limit: '{limit}'
      offset: '{offset}'
      workspace: '{workspace}'
      opt_fields: '{opt_fields}'
      opt_pretty: '{opt_pretty}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - asana
notes:
  env: COMPOSIO_API_KEY
  toolkit: asana
  composio_slug: ASANA_GET_TEAM_MEMBERSHIPS
