name: composio_asana_add_task_to_section
description: >-
  Adds an existing task to a section, optionally positioning it before or after another task in that
  section; if no position is specified, the task is added to the end.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ASANA toolkit, scoped to the calling tenant. The
      "Connect ASANA" flow must be completed before this tool will succeed.
    required: true
  task_gid:
    type: string
    description: GID of the existing task to add.
    required: true
  section_gid:
    type: string
    description: GID of the target section.
    required: true
  insert_after:
    type: string
    description: >-
      GID of a task in the section after which to insert the current task. Mutually exclusive with
      `insert_before`.
    default: null
  insert_before:
    type: string
    description: >-
      GID of a task in the section before which to insert the current task. Mutually exclusive with
      `insert_after`.
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ASANA_ADD_TASK_TO_SECTION
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_asana_add_task_to_section
      task_gid: '{task_gid}'
      section_gid: '{section_gid}'
      insert_after: '{insert_after}'
      insert_before: '{insert_before}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - asana
notes:
  env: COMPOSIO_API_KEY
  toolkit: asana
  composio_slug: ASANA_ADD_TASK_TO_SECTION
