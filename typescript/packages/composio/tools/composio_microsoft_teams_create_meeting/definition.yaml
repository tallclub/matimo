name: composio_microsoft_teams_create_meeting
description: >-
  Use to schedule a new standalone microsoft teams online meeting, i.e., one not linked to any
  calendar event.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the MICROSOFT_TEAMS toolkit, scoped to the calling
      tenant. The "Connect MICROSOFT_TEAMS" flow must be completed before this tool will succeed.
    required: true
  subject:
    type: string
    description: The subject or title for the online meeting.
    required: true
  participants:
    type: array
    description: >-
      An optional list of participants to invite to the meeting. Each participant is defined by
      their user ID and role.
    default: null
  end_date_time:
    type: string
    description: >-
      The end date and time of the meeting, specified in ISO 8601 format (e.g.,
      '2024-08-15T11:00:00Z'). Must be after start_date_time.
    required: true
  start_date_time:
    type: string
    description: >-
      The start date and time of the meeting, specified in ISO 8601 format (e.g.,
      '2024-08-15T10:00:00Z').
    required: true
  is_passcode_required:
    type: boolean
    description: >-
      An optional boolean indicating whether a passcode should be required to join this meeting. If
      not specified, the organization's default policy applies.
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/MICROSOFT_TEAMS_CREATE_MEETING
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_microsoft_teams_create_meeting
      subject: '{subject}'
      participants: '{participants}'
      end_date_time: '{end_date_time}'
      start_date_time: '{start_date_time}'
      is_passcode_required: '{is_passcode_required}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - microsoft_teams
notes:
  env: COMPOSIO_API_KEY
  toolkit: microsoft_teams
  composio_slug: MICROSOFT_TEAMS_CREATE_MEETING
