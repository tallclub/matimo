name: composio_jira_get_worklog
description: Retrieves worklogs for a specified jira issue.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the JIRA toolkit, scoped to the calling tenant. The
      "Connect JIRA" flow must be completed before this tool will succeed.
    required: true
  expand:
    type: string
    description: >-
      A comma-separated list of worklog properties to expand in the response. For instance,
      'properties' can be used to include custom fields associated with the worklogs. Refer to the
      Jira API documentation for other possible values.
    default: null
  start_at:
    type: number
    description: >-
      The 0-based index of the first worklog to return. Used for pagination to retrieve results
      beyond the initial page. For example, if `maxResults` is 50, `startAt=50` retrieves the second
      page.
    default: null
  max_results:
    type: number
    description: >-
      The maximum number of worklogs to return per page. Used for pagination. If not specified, a
      Jira-defined default is used (e.g., 50).
    default: null
  started_after:
    type: number
    description: >-
      Filters worklogs to include only those started on or after this specified date and time.
      Provide as a Unix timestamp in milliseconds (milliseconds since January 1, 1970, 00:00:00
      UTC).
    default: null
  started_before:
    type: number
    description: >-
      Filters worklogs to include only those started on or before this specified date and time.
      Provide as a Unix timestamp in milliseconds (milliseconds since January 1, 1970, 00:00:00
      UTC).
    default: null
  issue_id_or_key:
    type: string
    description: >-
      The ID (e.g., '10001') or key (e.g., 'PROJECT-123') of the Jira issue for which to retrieve
      worklogs.
    required: true
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/JIRA_GET_WORKLOG
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_jira_get_worklog
      expand: '{expand}'
      start_at: '{start_at}'
      max_results: '{max_results}'
      started_after: '{started_after}'
      started_before: '{started_before}'
      issue_id_or_key: '{issue_id_or_key}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - jira
notes:
  env: COMPOSIO_API_KEY
  toolkit: jira
  composio_slug: JIRA_GET_WORKLOG
