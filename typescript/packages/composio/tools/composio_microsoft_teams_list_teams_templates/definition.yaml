name: composio_microsoft_teams_list_teams_templates
description: >-
  Tool to list available microsoft teams templates. use when retrieving templates for team creation
  or customization workflows.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the MICROSOFT_TEAMS toolkit, scoped to the calling
      tenant. The "Connect MICROSOFT_TEAMS" flow must be completed before this tool will succeed.
    required: true
  top:
    type: number
    description: Maximum number of templates to return (1–999).
    default: null
  skip:
    type: number
    description: Number of templates to skip for pagination.
    default: null
  count:
    type: boolean
    description: If true, include a count of total matching templates in the response.
    default: false
  filter:
    type: string
    description: OData filter expression to filter the templates (e.g., "startsWith(displayName,'Template')").
    default: ''
  select:
    type: string
    description: >-
      Comma-separated template properties to include in the response (e.g.,
      'id,displayName,description'). If empty, default properties are returned.
    default: ''
  orderby:
    type: string
    description: Comma-separated properties and directions to order the results by (e.g., 'displayName desc').
    default: ''
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/MICROSOFT_TEAMS_LIST_TEAMS_TEMPLATES
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_microsoft_teams_list_teams_templates
      top: '{top}'
      skip: '{skip}'
      count: '{count}'
      filter: '{filter}'
      select: '{select}'
      orderby: '{orderby}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - microsoft_teams
notes:
  env: COMPOSIO_API_KEY
  toolkit: microsoft_teams
  composio_slug: MICROSOFT_TEAMS_LIST_TEAMS_TEMPLATES
