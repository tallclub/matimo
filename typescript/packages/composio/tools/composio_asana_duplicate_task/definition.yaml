name: composio_asana_duplicate_task
description: Duplicate a task
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ASANA toolkit, scoped to the calling tenant. The
      "Connect ASANA" flow must be completed before this tool will succeed.
    required: true
  name:
    type: string
    description: The name of the new task.
    default: null
  include:
    type: array
    description: A comma-separated string of properties to copy from the original task.
    default: null
  task_gid:
    type: string
    description: The globally unique identifier for the task to be duplicated.
    required: true
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ASANA_DUPLICATE_TASK
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_asana_duplicate_task
      name: '{name}'
      include: '{include}'
      task_gid: '{task_gid}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - asana
notes:
  env: COMPOSIO_API_KEY
  toolkit: asana
  composio_slug: ASANA_DUPLICATE_TASK
