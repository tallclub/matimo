name: composio_asana_get_task_templates
description: >-
  Tool to retrieve multiple task templates from a workspace. use when you need to list or find
  available task templates.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ASANA toolkit, scoped to the calling tenant. The
      "Connect ASANA" flow must be completed before this tool will succeed.
    required: true
  limit:
    type: number
    description: The number of objects to return per page.
    default: null
  offset:
    type: string
    description: Offset token for pagination.
    default: null
  opt_fields:
    type: string
    description: >-
      Comma-separated list of fields to include in the response. For example:
      'name,created_at,created_by'.
    default: null
  project_gid:
    type: string
    description: Globally unique identifier for the project. One of project or workspace must be specified.
    default: null
  workspace_gid:
    type: string
    description: Globally unique identifier for the workspace. One of project or workspace must be specified.
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ASANA_GET_TASK_TEMPLATES
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_asana_get_task_templates
      limit: '{limit}'
      offset: '{offset}'
      opt_fields: '{opt_fields}'
      project_gid: '{project_gid}'
      workspace_gid: '{workspace_gid}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - asana
notes:
  env: COMPOSIO_API_KEY
  toolkit: asana
  composio_slug: ASANA_GET_TASK_TEMPLATES
