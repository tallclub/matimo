name: composio_asana_get_task_attachments
description: >-
  Tool to get the list of attachments for a given task, project, or project brief. use when you need
  to retrieve files attached to a specific asana object.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ASANA toolkit, scoped to the calling tenant. The
      "Connect ASANA" flow must be completed before this tool will succeed.
    required: true
  limit:
    type: number
    description: The number of results per page.
    default: 50
  offset:
    type: string
    description: An offset token, used for pagination to retrieve the next page of results.
    default: null
  opt_fields:
    type: array
    description: >-
      A comma-separated list of fields to include in the response for each attachment. Possible
      fields include: `created_at`, `download_url`, `host`, `name`, `parent`, `parent.name`,
      `permanent_url`, `resource_subtype`, `size`, `view_url`.
    default: null
  parent_gid:
    type: string
    description: The GID of the task, project, or project_brief to fetch attachments from.
    required: true
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ASANA_GET_TASK_ATTACHMENTS
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_asana_get_task_attachments
      limit: '{limit}'
      offset: '{offset}'
      opt_fields: '{opt_fields}'
      parent_gid: '{parent_gid}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - asana
notes:
  env: COMPOSIO_API_KEY
  toolkit: asana
  composio_slug: ASANA_GET_TASK_ATTACHMENTS
