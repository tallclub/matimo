name: composio_linear_list_linear_teams
description: >-
  Retrieves all teams, including their members, and filters each team's associated projects by the
  provided 'project id'.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the LINEAR toolkit, scoped to the calling tenant. The
      "Connect LINEAR" flow must be completed before this tool will succeed.
    required: true
  project_id:
    type: string
    description: >-
      The unique identifier of a project. This ID is used to filter the list of projects associated
      with each retrieved team. If a team is not associated with this project ID, its 'projects'
      list in the response will be empty.
    required: true
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/LINEAR_LIST_LINEAR_TEAMS
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_linear_list_linear_teams
      project_id: '{project_id}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - linear
notes:
  env: COMPOSIO_API_KEY
  toolkit: linear
  composio_slug: LINEAR_LIST_LINEAR_TEAMS
