name: composio_googledrive_update_file_revision_metadata
description: >-
  Updates metadata of a file revision (e.g., keepforever, publish). use this tool to modify the
  metadata of a specific revision of a file in google drive.
version: 1.0.0
risk: medium
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the GOOGLEDRIVE toolkit, scoped to the calling tenant.
      The "Connect GOOGLEDRIVE" flow must be completed before this tool will succeed.
    required: true
  file_id:
    type: string
    description: The ID of the file.
    required: true
  published:
    type: boolean
    description: Whether this revision is published. This is only applicable to Docs Editors files.
    default: null
  publishAuto:
    type: boolean
    description: >-
      Whether subsequent revisions will be automatically republished. This is only applicable to
      Docs Editors files.
    default: null
  revision_id:
    type: string
    description: The ID of the revision.
    required: true
  keep_forever:
    type: boolean
    description: >-
      Whether to keep this revision forever, even if it is no longer the head revision. If not set,
      the revision will be automatically purged 30 days after newer content is uploaded. This can be
      set on a maximum of 200 revisions for a file. This field is only applicable to files with
      binary content in Drive.
    default: null
  publishedOutsideDomain:
    type: boolean
    description: >-
      Whether this revision is published outside the domain. This is only applicable to Docs Editors
      files.
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/GOOGLEDRIVE_UPDATE_FILE_REVISION_METADATA
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_googledrive_update_file_revision_metadata
      file_id: '{file_id}'
      published: '{published}'
      publishAuto: '{publishAuto}'
      revision_id: '{revision_id}'
      keep_forever: '{keep_forever}'
      publishedOutsideDomain: '{publishedOutsideDomain}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - googledrive
notes:
  env: COMPOSIO_API_KEY
  toolkit: googledrive
  composio_slug: GOOGLEDRIVE_UPDATE_FILE_REVISION_METADATA
