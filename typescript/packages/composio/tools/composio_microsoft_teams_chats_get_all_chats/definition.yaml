name: composio_microsoft_teams_chats_get_all_chats
description: >-
  Retrieves all microsoft teams chats a specified user is part of, supporting filtering, property
  selection, and pagination.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the MICROSOFT_TEAMS toolkit, scoped to the calling
      tenant. The "Connect MICROSOFT_TEAMS" flow must be completed before this tool will succeed.
    required: true
  top:
    type: number
    description: >-
      The maximum number of chats to retrieve in a single API call, used for pagination. Default is
      50. Must be a positive integer.
    default: 50
  filter:
    type: string
    description: >-
      An OData filter query string to apply to the chat list (e.g., "topic eq 'Project Updates'").
      Do not include '$filter=' in the string. This enables retrieving chats that match specific
      criteria.
    default: ''
  select:
    type: array
    description: >-
      A list of specific Microsoft Graph chat resource properties to retrieve (e.g., 'id', 'topic').
      If omitted or empty, a default set of properties is returned. Each string in the list should
      be a valid property name.
    default: []
  user_id:
    type: string
    description: >-
      The ID or user principal name (UPN) of the user whose chats are to be retrieved. Use 'me' to
      specify the currently authenticated user.
    default: me
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/MICROSOFT_TEAMS_CHATS_GET_ALL_CHATS
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_microsoft_teams_chats_get_all_chats
      top: '{top}'
      filter: '{filter}'
      select: '{select}'
      user_id: '{user_id}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - microsoft_teams
notes:
  env: COMPOSIO_API_KEY
  toolkit: microsoft_teams
  composio_slug: MICROSOFT_TEAMS_CHATS_GET_ALL_CHATS
