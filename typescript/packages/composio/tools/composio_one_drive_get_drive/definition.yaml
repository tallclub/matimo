name: composio_one_drive_get_drive
description: >-
  Retrieves the properties and relationships of a drive resource by its unique id. use this action
  when you need to get details about a specific onedrive, user's onedrive, group's document library,
  or a site's document library.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ONE_DRIVE toolkit, scoped to the calling tenant. The
      "Connect ONE_DRIVE" flow must be completed before this tool will succeed.
    required: true
  drive_id:
    type: string
    description: >-
      The unique identifier of the drive. This can be the ID of the user's personal OneDrive, a
      group's document library, or a specific drive ID.
    required: true
  select_fields:
    type: array
    description: >-
      A comma-separated list of properties to include in the response. Use this to retrieve specific
      fields and reduce the response size. For example, "id,name,driveType". If not provided, all
      default properties are returned.
    default: null
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ONE_DRIVE_GET_DRIVE
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_one_drive_get_drive
      drive_id: '{drive_id}'
      select_fields: '{select_fields}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - one_drive
notes:
  env: COMPOSIO_API_KEY
  toolkit: one_drive
  composio_slug: ONE_DRIVE_GET_DRIVE
