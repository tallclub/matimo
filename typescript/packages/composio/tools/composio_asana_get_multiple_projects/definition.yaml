name: composio_asana_get_multiple_projects
description: >-
  Returns a list of projects, optionally filtered by workspace, team, or archived status, supporting
  pagination for large datasets.
version: 1.0.0
risk: low
parameters:
  composio_user_id:
    type: string
    description: The Composio entity/user ID for the calling tenant or user.
    required: true
  composio_connected_account_id:
    type: string
    description: >-
      The Composio connected account ID for the ASANA toolkit, scoped to the calling tenant. The
      "Connect ASANA" flow must be completed before this tool will succeed.
    required: true
  team:
    type: string
    description: GID of the team to filter projects by.
  limit:
    type: number
    description: Number of projects to return per page (1-100).
  offset:
    type: string
    description: >-
      Offset token from a previous paginated request for retrieving the next page of results. Only
      use tokens from previous responses.
  archived:
    type: boolean
    description: 'Filter projects by archived status: `True` for archived only, `False` for unarchived only.'
  workspace:
    type: string
    description: GID of the workspace or organization to filter projects by.
  opt_fields:
    type: array
    description: >-
      Comma-separated list of optional properties to include for richer project details, as the
      default response is compact. See `OptFieldsEnm0` for available fields.
  opt_pretty:
    type: boolean
    description: >-
      Return JSON in a 'pretty' format (indented, line breaks). For debugging only due to increased
      response size/time.
execution:
  type: http
  method: POST
  url: https://backend.composio.dev/api/v3/tools/execute/ASANA_GET_MULTIPLE_PROJECTS
  headers:
    x-api-key: '{COMPOSIO_API_KEY}'
    Content-Type: application/json
  body:
    user_id: '{composio_user_id}'
    connected_account_id: '{composio_connected_account_id}'
    arguments:
      _matimo_tool: composio_asana_get_multiple_projects
      team: '{team}'
      limit: '{limit}'
      offset: '{offset}'
      archived: '{archived}'
      workspace: '{workspace}'
      opt_fields: '{opt_fields}'
      opt_pretty: '{opt_pretty}'
  timeout: 30000
authentication:
  type: api_key
  location: header
  name: x-api-key
output_schema:
  type: object
  description: Response envelope from Composio's tool execution endpoint.
  properties:
    success:
      type: boolean
      description: Whether the HTTP request to Composio succeeded (2xx status).
    data:
      type: object
      description: Composio's response body.
      properties:
        data:
          type: object
          description: The action-specific result payload.
        error:
          type:
            - string
            - 'null'
          description: Error message if Composio could not execute the action.
        successful:
          type: boolean
          description: Whether Composio successfully executed the underlying action.
tags:
  - composio
  - asana
notes:
  env: COMPOSIO_API_KEY
  toolkit: asana
  composio_slug: ASANA_GET_MULTIPLE_PROJECTS
