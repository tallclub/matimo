# Composio Provider Definition
#
# This file documents the governance-wrapper model for @matimo/composio.
# Unlike Slack/Notion/HubSpot, Composio is not a per-tenant OAuth2 provider —
# Composio brokers authentication to 250+ downstream toolkits itself (managed
# or custom OAuth apps). Matimo does not perform an OAuth2 dance for Composio;
# it only needs the three runtime values below, supplied by the embedding
# application's credential-injection layer.
#
# Runtime parameters required by EVERY generated composio_* tool:
#
# 1. COMPOSIO_API_KEY (env var, injected as the `x-api-key` header)
#    - Your Composio project API key.
#    - Get it from: https://app.composio.dev → Settings → API Keys
#
# 2. composio_user_id (tool parameter)
#    - The Composio entity/user ID for the calling tenant/user.
#    - See: https://docs.composio.dev/docs/authentication
#
# 3. composio_connected_account_id (tool parameter)
#    - The connected account ID for THIS toolkit, scoped to the calling
#      tenant. A user must "Connect <toolkit>" via Composio before this
#      tool will succeed.
#    - See: https://docs.composio.dev/docs/auth-configuration/connected-accounts
#
# How obtaining/storing composio_user_id and composio_connected_account_id,
# and the "Connect via Composio" OAuth UI flow, are integration-side concerns
# for the application embedding Matimo (e.g. Nova) — out of scope here.

name: composio-provider
type: provider
version: '1.0.0'
tags:
  - composio
  - governance
  - meta-provider

description: |
  Composio Governance Wrapper Provider Configuration

  Every tool generated by this package proxies a single Composio action via
  Composio's REST API: POST /api/v3/tools/execute/{TOOL_SLUG}

  Authentication is API-key based:
    Authentication: x-api-key: <COMPOSIO_API_KEY>

  Set COMPOSIO_API_KEY in your environment, and supply composio_user_id /
  composio_connected_account_id as tool parameters for every call.

provider:
  name: composio
  displayName: Composio
  authType: api_key
  documentation: https://docs.composio.dev/docs
  learnMore: https://composio.dev
