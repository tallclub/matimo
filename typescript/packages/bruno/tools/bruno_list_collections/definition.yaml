name: bruno_list_collections
description: Discover and introspect all Bruno API collections in a workspace directory. Returns metadata about available collections including request count and environments.
version: '1.0.0'
status: approved

parameters:
  workspace_path:
    type: string
    required: true
    description: Path to Bruno workspace directory

  filter:
    type: string
    required: false
    description: Filter collections by name (substring match)

execution:
  type: function
  code: index.ts
  timeout: 10000

output_schema:
  type: object
  properties:
    success:
      type: boolean
    collections:
      type: array
      items:
        type: object
        properties:
          name:
            type: string
          path:
            type: string
          request_count:
            type: number
          environments:
            type: array
            items:
              type: string
          tags:
            type: array
            items:
              type: string

authentication:
  type: api_key
  location: header
  name: Authorization


examples:
  - name: "List all collections in workspace"
    params:
      workspace_path: "./bruno-collections"

  - name: "Filter collections by name"
    params:
      workspace_path: "./bruno-collections"
      filter: "api"
